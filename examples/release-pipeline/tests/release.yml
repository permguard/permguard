#
# What this workspace claims its policies decide. `permguard test` compiles the
# policies beside this file and checks every claim, offline, before anything is
# pushed.
#
# `policies` names the authored aliases, not the identities: an alias is what an
# author wrote and what survives a rename, and it means the same thing in every
# ledger this workspace is applied to.

# --- the org chart decides who may act at all ------------------------------
- name: a developer opens a release for a service their team owns
  request: ../requests/release-create-permit.json
  expect: { decision: permit, policies: [release-authors] }

- name: nobody opens a release for another team's service
  request: ../requests/release-create-deny.json
  # Nothing permitted it. The quiet no, and not the same as a policy refusing.
  expect: { decision: deny, policies: [] }

# --- separation of duties: a guardrail overrides an entitlement -------------
- name: a release manager approves somebody else's release
  request: ../requests/signoff-permit.json
  expect: { decision: permit, policies: [release-approvers] }

- name: nobody approves the release they created themselves
  request: ../requests/signoff-separation-of-duties-deny.json
  expect: { decision: deny, policies: [delivery-guardrails] }

- name: an untested release is not approvable, whoever asks
  request: ../requests/signoff-untested-deny.json
  expect: { decision: deny, policies: [delivery-guardrails] }

# --- machine identities, under a profile of their own -----------------------
- name: the build uploads an artifact for the service it builds
  request: ../requests/artifact-upload-permit.json
  expect: { decision: permit, policies: [pipeline-workloads] }

- name: signing is not the build's job
  request: ../requests/artifact-sign-deny.json
  expect: { decision: deny, policies: [] }

- name: the controller deploys a release that cleared every gate
  request: ../requests/deploy-permit.json
  expect: { decision: permit, policies: [pipeline-workloads] }

- name: a failed security scan stops the deployment
  request: ../requests/deploy-scan-failed-deny.json
  expect: { decision: deny, policies: [] }

# --- context: the same person, refused and then allowed ---------------------
- name: a routine production rollback is refused
  request: ../requests/rollback-deny.json
  expect: { decision: deny, policies: [delivery-guardrails] }

- name: the same rollback is allowed during an incident, on call
  request: ../requests/rollback-during-incident-permit.json
  expect: { decision: permit, policies: [rollback-responders] }

# --- one field, two readings: Cedar reads `context.action`, Rego reads
#     `input.action.properties`, and the Cedar schema types it ---------------
- name: a high-risk release with a signed artifact is approvable
  request: ../requests/signoff-high-risk-permit.json
  expect: { decision: permit, policies: [release-approvers] }

- name: a high-risk release with no signature is refused by the guardrails
  request: ../requests/signoff-high-risk-unsigned-deny.json
  # Two rules object, and they live in one module: a decision cites the policy that
  # decided, not the rule inside it.
  expect: { decision: deny, policies: [delivery-guardrails] }

- name: a critical release is beyond what an approval can permit
  request: ../requests/signoff-critical-risk-deny.json
  # Cedar reads `context.action.risk` and stops permitting: nothing else does.
  expect: { decision: deny, policies: [] }

- name: a risk that is not a string fails closed, with the schema's own diagnosis
  request: ../requests/signoff-risk-not-a-string-deny.json
  expect: { error: schema }

- name: a caller may not write the context Permguard fills in
  request: ../requests/error-context-action-reserved.json
  expect: { error: field_reserved }

# --- one request, two entity graphs: Cedar reads the org chart, Rego reads its
#     own list, and neither could read the other's ---------------------------
- name: a frozen service is not rolled back, incident or not
  request: ../requests/rollback-frozen-service-deny.json
  # The org chart still entitles alice — the guardrail's own graph is what refuses.
  expect: { decision: deny, policies: [delivery-guardrails] }

# --- what a request may hand a partition, and what happens when it gets it wrong.
#
#     Every one of these is refused *before a policy is consulted*, and that is the
#     point: a caller who addressed the wrong partition, or sent the wrong shape,
#     has made a mistake nobody's rules have an opinion about. Answering `deny`
#     would send them reading policies that were never the problem.
- name: the org chart is required, and a request without it is refused by name
  request: ../requests/error-input-required.json
  # `admin-cedar` declares `required: true`: its policies traverse that store, and
  # deciding against an empty one would deny for the wrong reason.
  expect: { error: partition_input_required }

- name: a partition that reads only the request is not addressable
  request: ../requests/error-input-unsupported.json
  # `pipeline-rego` declares no input. Ignoring one sent to it would look, from the
  # caller's side, exactly like a policy ignoring it.
  expect: { error: partition_input_unsupported }

- name: the type a request states is checked against the ledger, never obeyed
  request: ../requests/error-input-type-mismatch.json
  # Stating `permguard.rego.data.v1` does not switch `admin-cedar` to a Rego reading:
  # a caller cannot choose the parser for data it also supplies.
  expect: { error: partition_input_type_mismatch }

- name: a document its partition's schema refuses never reaches a rule
  request: ../requests/error-input-schema.json
  # `frozen` is not `frozen_services`. Without the schema the guardrail would read
  # nothing, decide nothing, and the release would go out — a rename turning a
  # control into silence is exactly what a schema is for.
  expect: { error: partition_input_schema }

- name: the removed entities extension is refused rather than ignored
  request: ../requests/error-entities-removed.json
  # Ignoring it is the one unacceptable outcome: the request would be decided
  # against an empty world and nothing on the wire would say why.
  expect: { error: field_removed }

- name: an input addressed to a partition the profile does not hold is refused
  request: ../requests/error-partition-unknown.json
  expect: { error: partition_unknown }
