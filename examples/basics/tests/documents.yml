#
# What this workspace claims its policies decide. Run with `permguard -w
# examples/basics test`, offline: the policies are compiled here, not asked of a
# plane, so this holds before anything is applied.

- name: a member of the finance group may read a document
  request: ../requests/permit.json
  # Both partitions permit it, and the decision cites both: the Cedar policy that
  # permits the finance group, and the Rego module that lets any User read. Either
  # alone would be enough — which is why the reason names them.
  expect: { decision: permit, policies: [document-readers, gateway-access] }

- name: writing a document somebody else owns is refused
  request: ../requests/deny.json
  # Nothing permitted it: neither partition said yes.
  expect: { decision: deny, policies: [] }

- name: the gateway profile answers with Rego alone
  request: ../requests/gateway-permit.json
  expect: { decision: permit, policies: [gateway-access] }

- name: the same request under the default profile leaves the Cedar schema
  request: ../requests/gateway-permit.json
  profile: default
  # `create` is not an action the Cedar schema declares, so that partition cannot
  # evaluate the request — and a partition that cannot evaluate denies.
  expect: { error: schema }

- name: three questions in one request, and the batch is their conjunction
  request: ../requests/boxcarred.json
  # `purge` is not a rule the gateway module has, so nothing permits it — and the
  # whole batch is a deny even though two of the three were allowed.
  expect:
    decision: deny
    evaluations: { read: permit, create: permit, purge: deny }
