apiVersion: 1

providers:
  - name: Permguard
    orgId: 1
    folder: Permguard
    type: file
    disableDeletion: false
    # Edits in the browser are kept until the file changes, so a demo can be adjusted live without
    # the provisioner overwriting it mid-sentence.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
