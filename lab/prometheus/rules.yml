# The alerts worth having in a lab: the ones that demonstrate what the metrics are for.
#
# There is no Alertmanager here on purpose — a lab does not need to page anybody. The rules still
# evaluate, and Grafana shows them firing, which is what makes them reviewable before they are copied
# into a real deployment.
groups:
  - name: permguard-availability
    rules:
      - alert: PermguardNotReady
        expr: permguard_ready == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.component }} is not willing to be sent work"
          description: >-
            The process is answering and reporting itself not ready: starting up, or draining. If it
            stays here, it is neither.

      - alert: PermguardNotLive
        expr: permguard_up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.component }} reports itself wedged"
          description: "A liveness failure means restart, not wait."

      # Only the discovered containers. The host job is a fixed pair of addresses that is *expected*
      # to be down whenever the planes are running in containers rather than from an editor — and an
      # alert that fires in the normal case is an alert nobody reads.
      - alert: PermguardTargetDown
        expr: up{job="permguard-containers"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.component }} was discovered and is not answering scrapes"

  - name: permguard-saturation
    rules:
      # Any value above zero here is a client that was turned away. It is the first thing that
      # happens under a connection flood, and it happens long before anything else shows.
      - alert: PermguardConnectionsRefused
        expr: increase(permguard_surface_connections_refused_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.surface }} refused connections: it is at its limit"

      - alert: PermguardServerErrors
        expr: |
          sum by (component, surface) (rate(permguard_surface_requests_total{status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.surface }} is answering 5xx"

      - alert: PermguardDecisionAuditLoss
        expr: increase(permguard_authz_audit_records_total{outcome=~"dropped|failed"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Decision audit records were not written"

  - name: permguard-mirrors
    rules:
      - alert: PermguardMirrorStale
        expr: max by (component, zone, ledger) (permguard_sync_mirror_age_seconds) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.zone }}/{{ $labels.ledger }} mirror is stale"
          description: >-
            The data plane is still serving this mirror, but it has not completed a successful sync
            inside the production baseline window.

      - alert: PermguardMirrorSyncFailing
        expr: increase(permguard_sync_mirrors_total{outcome=~"failed|timeout"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.zone }}/{{ $labels.ledger }} mirror sync is failing"

      - alert: PermguardMirrorRoundPartial
        expr: increase(permguard_sync_rounds_total{outcome="partial"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A mirror round completed partially"

  - name: permguard-decision-log
    rules:
      - alert: PermguardDecisionLogBacklogGrowing
        expr: sum by (component) (permguard_decisions_unshipped_records) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.component }} decision log backlog is not draining"
          description: >-
            Records are durable locally but have not been acknowledged by the control plane. Check
            control-plane reachability and the decision-log shipper.

      - alert: PermguardDecisionLogDroppedRecords
        expr: increase(permguard_decisions_dropped_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Decision records were dropped"

      - alert: PermguardDecisionLogDiscontinuity
        expr: increase(permguard_decisions_discontinuities_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A decision stream recorded a discontinuity"

      - alert: PermguardDecisionLogBatchRejected
        expr: increase(permguard_decisions_shipped_total{outcome="rejected"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The control plane rejected a decision-log batch"

      - alert: PermguardDecisionStoreRefusingBatches
        expr: increase(permguard_decisions_refusals_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The decision store refused one or more batches"

      - alert: PermguardDecisionStreamClosed
        expr: increase(permguard_decisions_streams_closed_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A decision stream was permanently closed"

  - name: permguard-tls
    rules:
      # A timestamp rather than "days remaining", so the subtraction happens here and is true
      # whenever it is evaluated.
      # Expiry of the revocation list is enforced at the handshake: past nextUpdate, every
      # mutual-TLS client is refused. This alert is what turns that moment into a prediction.
      - alert: PermguardRevocationListExpiringSoon
        expr: |
          (permguard_tls_crl_expiry_timestamp_seconds - time()) / 86400 < 7
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.surface }}'s revocation list expires in less than 7 days"
          description: >-
            An expired list refuses every mutual-TLS handshake, deliberately. The renewal process
            that maintains it has this long to run.

      - alert: PermguardCertificateExpiringSoon
        expr: |
          (permguard_tls_certificate_expiry_timestamp_seconds - time()) / 86400 < 30
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.surface }}'s certificate expires in less than 30 days"
          description: "A 90-day certificate renews at 60; under 30 means two windows were missed."
