# What the lab scrapes.
#
# Two sets of targets, and both are always configured:
#
#   * the containers the lab starts, by service name, which resolve only inside the compose network;
#   * the runtime a developer starts on the host with `task run:all`, through the gateway address.
#
# A target that is not running is `up == 0` and nothing else — Prometheus is built for that — so the
# same file works whether the planes are in containers, on the host, or both. The dashboards select
# on the `component` label rather than on the job, so they do not care which one answered.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  # A lab exists to show a change immediately. Five seconds is far faster than anything production
  # would use, and it is the difference between a demo where the graph moves and one where it does not.
  evaluation_interval: 15s
  external_labels:
    environment: lab

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # The containers this lab is running, found by asking the compose network's DNS.
  #
  # Not a static list, because a list has to name every shape the lab can take — the two planes and
  # the all-in-one — and whichever shape is *not* running then shows as a target that is permanently
  # down. In a demo a red target reads as a fault.
  #
  # DNS rather than the Docker daemon, because a service that is not running simply has no record:
  # discovery yields nothing and there is no target to be down. Asking the daemon would work too, and
  # would mean mounting its socket into Prometheus — which is root on the host, for a lab, to learn
  # something the network already knows.
  - job_name: permguard-containers
    metrics_path: /metrics
    dns_sd_configs:
      # Each container is a separate Server Host and therefore uses the canonical operations port.
      - names: [control-plane, data-plane, all-in-one]
        type: A
        port: 5443
        refresh_interval: 10s
    relabel_configs:
      # `__meta_dns_name` is the service that was asked for, which is exactly the component name.
      - source_labels: [__meta_dns_name]
        target_label: component
      - target_label: source
        replacement: container

  # The Server Host a developer runs on the host with `task run:all`, `task run:control`, or
  # `task run:data`. It stays static because there is nothing to discover about a process outside
  # Docker. Additional standalone processes should use separate IP addresses or network namespaces
  # while retaining the canonical 5443 port.
  #
  # `host.docker.internal` is the host as seen from a container; on Linux the compose file maps it
  # explicitly, because only Docker Desktop provides it for free.
  - job_name: permguard-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5443"]
        labels:
          component: server-host
          source: host
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
