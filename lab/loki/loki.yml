# Loki as a lab needs it: one process, local filesystem, no object store, no ring to configure.
# Nothing here is a production topology — it is the smallest thing that answers a query.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 0
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # A lab is restarted, and a restart replays log lines that are older than "now". Without this, Loki
  # rejects them and the demo has no logs for the most interesting minute.
  reject_old_samples: false
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 72h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
