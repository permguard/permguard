#
# The Compose lab's all-in-one with identity providers (WP-8.1, `IDENTITY=1 scripts/compose-lab.sh
# all-in-one`): the baseline, plus two Keycloak realms as providers at once and local users with
# passwords. What varies per container comes from the environment
# `permguard-lab serve` sets — the listeners' certificates, issued by the lab's own authority.
#
# A lab, on its own network: the development profile and a test authority. Never a template for a
# deployment.

working_dir: /var/lib/permguard/volume
development_mode: true
autogenerate: true
assurance: { profile: development }
log: { level: info, format: json }

runtime: { planes: [control, data] }

host:
  addr: 0.0.0.0:5443
  # The Data Plane's own certificate, as its mirror presents it to the Control Plane.
  principals:
    - san_uri: "spiffe://permguard-lab/all-in-one"
    # Two realms, each a provider; their keys found through discovery and fetched every minute.
    # Plain HTTP is admitted only because the lab is the development profile.
    - oidc:
        name: ops
        issuer: "http://keycloak:8080/realms/ops"
        audience: permguard
        refresh: 1m
        max_stale: 10m
    - oidc:
        name: partners
        issuer: "http://keycloak:8080/realms/partners"
        audience: permguard
        refresh: 1m
        max_stale: 10m
        link: email
  authentication:
    methods: [password, oidc]
    password: { min_length: 12, mfa: "off" }
admin: { addr: 0.0.0.0:5444 }

operations:
  keys: { enabled: "true", publish_ahead: 5m, rotate_every: 1h, retain: 1d }
  secrets: { provider: directory, coordinator_root_ref: zone-root }
  audit: { pseudonym: { enabled: true, key_ref: audit-pseudonym, key_version: "v1" } }

controlPlane:
  public:
    http: { addr: 0.0.0.0:6443 }
    grpc: { addr: 0.0.0.0:6443 }
  # Every decision its Data Plane records reaches it in-process, and is read from here.
  decisions: { enabled: "true" }

dataPlane:
  public:
    http: { addr: 0.0.0.0:7443 }
    grpc: { addr: 0.0.0.0:7443 }
  # The baseline has no membership: its Data Plane follows its own Control Plane in-process, every
  # zone and ledger it holds, verified under this Host's own `control.attest` ring (WP-7.7).
  mirrors:
    enabled: "true"
    interval: 5s
  # Every decision is recorded, then shipped to this Host's own Control Plane in-process.
  decisions:
    log: { enabled: "true" }
