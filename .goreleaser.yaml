# .goreleaser.yaml
#
# The release, described once: four binaries, six targets each, cross-compiled
# with cargo-zigbuild (the toolchain the pipeline installs). Archives, deb/rpm/apk
# packages, checksums and container images all come from these builds — the same
# structure the Go repository releases with, so one team runs one process.
#
# The tagged source already carries its version (scripts/release.sh bumps
# Cargo.toml before tagging), so nothing here injects one.

version: 2

project_name: permguard

env:
  - ORG=permguard
  - REPO=permguard

before:
  hooks:
    - cargo fetch --locked

builds:
  - id: permguard_cli
    builder: rust
    binary: permguard
    tool: cargo
    command: zigbuild
    flags: ["--release", "--locked", "--package=permguard-cli"]
    targets: &targets
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm
    env:
      - PERMGUARD_BUILD_COMMIT={{ .FullCommit }}

  - id: permguard_all_in_one
    builder: rust
    binary: permguard-all-in-one
    tool: cargo
    command: zigbuild
    flags: ["--release", "--locked", "--package=permguard-all-in-one"]
    targets: *targets
    env:
      - PERMGUARD_BUILD_COMMIT={{ .FullCommit }}

  - id: permguard_control_plane
    builder: rust
    binary: permguard-control-plane
    tool: cargo
    command: zigbuild
    flags: ["--release", "--locked", "--package=permguard-control-plane"]
    targets: *targets
    env:
      - PERMGUARD_BUILD_COMMIT={{ .FullCommit }}

  - id: permguard_data_plane
    builder: rust
    binary: permguard-data-plane
    tool: cargo
    command: zigbuild
    flags: ["--release", "--locked", "--package=permguard-data-plane"]
    targets: *targets
    env:
      - PERMGUARD_BUILD_COMMIT={{ .FullCommit }}

  # The Apple binaries are not cross-compiled: they are built on macOS, by the `macos-binaries` job,
  # and imported here.
  #
  # Zig gives this repository a linker and a libc for four targets from one Linux runner, which is
  # why everything above is a `zigbuild`. What it cannot give is Apple's SDK — `Security.framework`
  # and `CoreFoundation.framework` are not redistributable, and `rustls-native-certs` needs them to
  # read the macOS keychain. The alternative was to stop reading the keychain, which would silently
  # take the corporate root out of the trust path on exactly the machines that have one. So macOS is
  # built on macOS, and the two halves meet here.
  - id: permguard_cli_darwin
    builder: prebuilt
    binary: permguard
    goos: [darwin]
    goarch: [amd64, arm64]
    prebuilt:
      path: prebuilt/{{ .Os }}_{{ .Arch }}/permguard

  - id: permguard_all_in_one_darwin
    builder: prebuilt
    binary: permguard-all-in-one
    goos: [darwin]
    goarch: [amd64, arm64]
    prebuilt:
      path: prebuilt/{{ .Os }}_{{ .Arch }}/permguard-all-in-one

  - id: permguard_control_plane_darwin
    builder: prebuilt
    binary: permguard-control-plane
    goos: [darwin]
    goarch: [amd64, arm64]
    prebuilt:
      path: prebuilt/{{ .Os }}_{{ .Arch }}/permguard-control-plane

  - id: permguard_data_plane_darwin
    builder: prebuilt
    binary: permguard-data-plane
    goos: [darwin]
    goarch: [amd64, arm64]
    prebuilt:
      path: prebuilt/{{ .Os }}_{{ .Arch }}/permguard-data-plane

checksum:
  name_template: "checksums.txt"

docker_digest:
  name_template: "digests.txt"

source:
  enabled: true

# The same naming the Go repository publishes with, so install scripts and
# download habits carry over unchanged.
archives:
  - formats: [tar.gz]
    id: permguard_cli
    ids: ["permguard_cli"]
    name_template: >-
      {{ .ProjectName }}_cli_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
  # The Apple CLI archives carry their own archive id: the Homebrew cask selects
  # by *archive* id, and it must ship the Apple build only. Same name template,
  # so the published artifact names do not change.
  - formats: [tar.gz]
    id: permguard_cli_darwin
    ids: ["permguard_cli_darwin"]
    name_template: >-
      {{ .ProjectName }}_cli_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
  - formats: [tar.gz]
    id: permguard_all_in_one
    ids: ["permguard_all_in_one", "permguard_all_in_one_darwin"]
    name_template: >-
      permguard_all_in_one_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
  - formats: [tar.gz]
    id: permguard_control_plane
    ids: ["permguard_control_plane", "permguard_control_plane_darwin"]
    name_template: >-
      permguard_control_plane_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
  - formats: [tar.gz]
    id: permguard_data_plane
    ids: ["permguard_data_plane", "permguard_data_plane_darwin"]
    name_template: >-
      permguard_data_plane_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  use: github
  groups:
    - title: "Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Refactor"
      regexp: "^refactor"
      order: 2
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: >-
    ---
    Released by the Permguard Team using [GoReleaser](https://github.com/goreleaser/goreleaser).

nfpms:
  - vendor: Permguard
    homepage: https://www.permguard.com
    maintainer: Permguard Team <opensource@permguard.com>
    description: Permguard CLI
    license: Apache 2.0
    formats:
      - deb
      - rpm
      - apk
    file_name_template: '{{ .ProjectName }}_cli_{{- title .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}'
    # The CLI packages are Linux only; the Apple half is delivered by the Homebrew cask.
    ids:
      - permguard_cli

# Container images from the same tested binaries — a distroless base and one static musl binary,
# nothing else in the filesystem. Every image is published twice, from one build, to two registries:
#
#   ghcr.io/permguard/permguard/<name>   the full set of tags, `latest` included. GHCR nests under
#                                        this repository, so nothing here can collide with anything.
#   permguard/<name>                     Docker Hub, **versioned tags only**. Those names still
#                                        carry the Go images, whose last release was v0.0.52 and
#                                        whose `latest` still points at it. This CLI starts at
#                                        v0.1.0, so `0.1.0` and `0.1` are free while `latest` and
#                                        every `0.0.x` stay where they are. When the Rust build
#                                        becomes *the* Permguard, `latest` moves here in one commit
#                                        — the same handover the `cli-rust` Homebrew cask is waiting
#                                        on. Until then a `docker pull permguard/all-in-one` gets
#                                        what it has always got.
#
# Two blocks per image rather than one, because `tags` applies to every entry in `images`: a single
# block cannot give GHCR a `latest` and withhold it from Docker Hub. The second build is a cache hit
# on the first — only the push is real work.
dockers_v2:
  # `extra_files` is not decoration: the build context GoReleaser assembles holds the Dockerfile and
  # the prebuilt binary at `${TARGETPLATFORM}/${BINARY_NAME}`, and nothing else. Anything else a
  # COPY names — the licence, the state directory the image ships — has to be listed here or the
  # build fails at release time, which is the worst possible moment to find out.

  - id: permguard_all_in_one_ghcr
    dockerfile: ./docker/release/all-in-one.Dockerfile
    ids:
      - permguard_all_in_one
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "ghcr.io/permguard/permguard/all-in-one"
    tags:
      - "{{ .Version }}"
      - "latest"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard-all-in-one
    labels:
      org.opencontainers.image.title: "permguard-all-in-one"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"

  # Docker Hub: the same digest, versioned tags only — see the note above.
  - id: permguard_all_in_one_dockerhub
    dockerfile: ./docker/release/all-in-one.Dockerfile
    ids:
      - permguard_all_in_one
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "permguard/all-in-one"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard-all-in-one
    labels:
      org.opencontainers.image.title: "permguard-all-in-one"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"

  - id: permguard_control_plane_ghcr
    dockerfile: ./docker/release/control-plane.Dockerfile
    ids:
      - permguard_control_plane
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "ghcr.io/permguard/permguard/control-plane"
    tags:
      - "{{ .Version }}"
      - "latest"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard-control-plane
    labels:
      org.opencontainers.image.title: "permguard-control-plane"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"

  # Docker Hub: the same digest, versioned tags only — see the note above.
  - id: permguard_control_plane_dockerhub
    dockerfile: ./docker/release/control-plane.Dockerfile
    ids:
      - permguard_control_plane
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "permguard/control-plane"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard-control-plane
    labels:
      org.opencontainers.image.title: "permguard-control-plane"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"

  - id: permguard_data_plane_ghcr
    dockerfile: ./docker/release/data-plane.Dockerfile
    ids:
      - permguard_data_plane
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "ghcr.io/permguard/permguard/data-plane"
    tags:
      - "{{ .Version }}"
      - "latest"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard-data-plane
    labels:
      org.opencontainers.image.title: "permguard-data-plane"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"

  # Docker Hub: the same digest, versioned tags only — see the note above.
  - id: permguard_data_plane_dockerhub
    dockerfile: ./docker/release/data-plane.Dockerfile
    ids:
      - permguard_data_plane
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "permguard/data-plane"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard-data-plane
    labels:
      org.opencontainers.image.title: "permguard-data-plane"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"

  # The CLI, published as an image too: a pipeline step that runs `permguard check` or `permguard
  # apply` wants the binary without installing it, and the Dockerfile already existed with nothing
  # releasing it.
  - id: permguard_cli_ghcr
    dockerfile: ./docker/release/cli.Dockerfile
    ids:
      - permguard_cli
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "ghcr.io/permguard/permguard/cli"
    tags:
      - "{{ .Version }}"
      - "latest"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard
    labels:
      org.opencontainers.image.title: "permguard-cli"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"

  # Docker Hub: the same digest, versioned tags only — see the note above.
  - id: permguard_cli_dockerhub
    dockerfile: ./docker/release/cli.Dockerfile
    ids:
      - permguard_cli
    extra_files:
      - LICENSE
      - docker/rootfs
    images:
      - "permguard/cli"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_NAME: permguard
    labels:
      org.opencontainers.image.title: "permguard-cli"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "github.com/permguard/permguard"
