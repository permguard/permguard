#
# The Compose lab (TD-3): five topologies, one per profile, each enrolled by the lab's own test
# authority and each with the assertions it must pass (`scripts/compose-lab.sh`).
#
#   all-in-one         one Server with the Control and Data Planes
#   split-plane        one Control Plane Host and one Data Plane Host
#   multi-data-plane   one Control Plane Host and two Data Plane Hosts on one ledger
#   multi-group        two Data Plane groups with disjoint selectors, each its own service
#   temporal-replicas  two temporal Data Plane Hosts, the coordinator's event store and imports
#
# Start one with its name in COMPOSE_PROFILES — the lab's bootstrap reads it from there:
#
#   COMPOSE_PROFILES=split-plane docker compose -f docker-compose.lab.yml up -d --wait
#   COMPOSE_PROFILES=split-plane,observability docker compose -f docker-compose.lab.yml up -d --wait
#
# Every Host is reached by its service name inside the lab's network; nothing depends on a loopback
# alias, the host's network or a fixed host port. The ports published on the host's loopback are
# ephemeral (`docker compose port control-plane 6443` names them), and the certificates name the
# service, so a client on the host passes `--tls-server-name control-plane` with the lab's
# authority, which `lab-pki` writes to the `lab` volume.
#
# One image runs everything: `permguard/lab:local`, built from this checkout by
# `lab/compose/Dockerfile`. The script and the examples are mounted, never baked in.

name: permguard-compose-lab

x-lab: &lab
  image: ${PERMGUARD_LAB_IMAGE:-permguard/lab:local}
  build:
    context: .
    dockerfile: lab/compose/Dockerfile
  entrypoint: ["bash", "/opt/permguard/lab/permguard-lab.sh"]

x-mounts:
  # The lab's authority writes it; a Host only reads it. One volume holds every Host's listener key
  # and the operator's: a lab's concession, which a deployment's secret per workload never makes.
  - &lab-volume lab:/lab
  - &lab-volume-ro lab:/lab:ro
  - &lab-scripts ./lab/compose:/opt/permguard/lab:ro
  - &lab-examples ./examples:/opt/permguard/examples:ro

# A Host: healthy once it answers discovery on its Server Host listener.
x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5443/.well-known/server-configuration"]
  interval: 2s
  timeout: 2s
  retries: 90

x-after-pki: &after-pki
  lab-pki: { condition: service_completed_successfully }

x-after-catalog: &after-catalog
  lab-pki: { condition: service_completed_successfully }
  lab-catalog: { condition: service_completed_successfully }

services:
  # ---------------------------------------------------------------------------------------------
  # The lab's authority: certificates once, then the catalog, then the enrollments.
  # ---------------------------------------------------------------------------------------------

  lab-pki:
    <<: *lab
    profiles: [all-in-one, split-plane, multi-data-plane, multi-group, temporal-replicas]
    command: ["pki"]
    volumes: [*lab-volume, *lab-scripts]

  lab-catalog:
    <<: *lab
    profiles: [all-in-one, split-plane, multi-data-plane, multi-group, temporal-replicas]
    command: ["catalog", "${COMPOSE_PROFILES:-}"]
    volumes: [*lab-volume, *lab-scripts, *lab-examples]
    depends_on:
      control-plane: { condition: service_healthy, required: false }
      all-in-one: { condition: service_healthy, required: false }

  lab-enroll:
    <<: *lab
    profiles: [split-plane, multi-data-plane, multi-group, temporal-replicas]
    command: ["enroll", "${COMPOSE_PROFILES:-}"]
    volumes: [*lab-volume, *lab-scripts]
    depends_on:
      data-plane: { condition: service_healthy, required: false }
      data-plane-a: { condition: service_healthy, required: false }
      data-plane-b: { condition: service_healthy, required: false }
      data-plane-acme: { condition: service_healthy, required: false }
      data-plane-beta: { condition: service_healthy, required: false }
      temporal-a: { condition: service_healthy, required: false }
      temporal-b: { condition: service_healthy, required: false }

  # What `scripts/compose-lab.sh` runs the assertions in: `docker compose run --rm lab assert …`.
  # Never started by `up`.
  lab:
    <<: *lab
    profiles: [tools]
    volumes: [*lab-volume, *lab-scripts, *lab-examples]

  # ---------------------------------------------------------------------------------------------
  # The Hosts. Each runs `permguard-lab serve`: its claim moved forward, the lab's operator granted
  # on its volume, its listeners under the certificate issued to its service name.
  # ---------------------------------------------------------------------------------------------

  all-in-one:
    <<: *lab
    profiles: [all-in-one]
    command: ["serve", "permguard-all-in-one", "/opt/permguard/lab/all-in-one.yml"]
    environment: { LAB_HOST: all-in-one }
    volumes: [*lab-volume-ro, *lab-scripts, "all-in-one-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::6443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-pki

  control-plane:
    <<: *lab
    profiles: [split-plane, multi-data-plane, multi-group, temporal-replicas]
    command: ["serve", "permguard-control-plane", "/opt/permguard/lab/control-plane.yml"]
    environment: { LAB_HOST: control-plane }
    volumes: [*lab-volume-ro, *lab-scripts, "control-plane-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::6443"]
    healthcheck: *healthcheck
    depends_on: *after-pki

  data-plane:
    <<: *lab
    profiles: [split-plane]
    command: ["serve", "permguard-data-plane", "/opt/permguard/lab/data-plane.yml"]
    environment: { LAB_HOST: data-plane }
    volumes: [*lab-volume-ro, *lab-scripts, "data-plane-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-catalog

  # Two replicas of one static file: two Hosts, two identities, two producer streams.
  data-plane-a:
    <<: *lab
    profiles: [multi-data-plane]
    command: ["serve", "permguard-data-plane", "/opt/permguard/lab/data-plane.yml"]
    environment: { LAB_HOST: data-plane-a }
    volumes: [*lab-volume-ro, *lab-scripts, "data-plane-a-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-catalog

  data-plane-b:
    <<: *lab
    profiles: [multi-data-plane]
    command: ["serve", "permguard-data-plane", "/opt/permguard/lab/data-plane.yml"]
    environment: { LAB_HOST: data-plane-b }
    volumes: [*lab-volume-ro, *lab-scripts, "data-plane-b-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-catalog

  # Two groups: the same file, disjoint memberships — `acme` and `beta` — each its own service.
  data-plane-acme:
    <<: *lab
    profiles: [multi-group]
    command: ["serve", "permguard-data-plane", "/opt/permguard/lab/data-plane.yml"]
    environment: { LAB_HOST: data-plane-acme }
    volumes: [*lab-volume-ro, *lab-scripts, "data-plane-acme-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-catalog

  data-plane-beta:
    <<: *lab
    profiles: [multi-group]
    command: ["serve", "permguard-data-plane", "/opt/permguard/lab/data-plane.yml"]
    environment: { LAB_HOST: data-plane-beta }
    volumes: [*lab-volume-ro, *lab-scripts, "data-plane-beta-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-catalog

  # Two temporal replicas of the file `lab-catalog` rendered: each records, ships, and imports what
  # the other recorded.
  temporal-a:
    <<: *lab
    profiles: [temporal-replicas]
    command: ["serve", "permguard-data-plane", "/lab/state/data-plane-temporal.yml"]
    environment: { LAB_HOST: temporal-a }
    volumes: [*lab-volume-ro, *lab-scripts, "temporal-a-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-catalog

  temporal-b:
    <<: *lab
    profiles: [temporal-replicas]
    command: ["serve", "permguard-data-plane", "/lab/state/data-plane-temporal.yml"]
    environment: { LAB_HOST: temporal-b }
    volumes: [*lab-volume-ro, *lab-scripts, "temporal-b-state:/var/lib/permguard"]
    ports: ["127.0.0.1::5443", "127.0.0.1::7443"]
    healthcheck: *healthcheck
    depends_on: *after-catalog

  # ---------------------------------------------------------------------------------------------
  # Observability. `observability` beside a lab profile watches its Hosts; alone, it watches planes
  # a developer started on the host (`task run:all`). Prometheus finds the containers by their
  # service names, so a profile that runs only some of them leaves the rest simply down.
  # ---------------------------------------------------------------------------------------------

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
      # What lets k6 push its client-side metrics into this same Prometheus, so a load test's two
      # views — what the client felt, what the server measured — sit on one dashboard. Harmless when
      # unused, and this Prometheus is a lab on loopback.
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PERMGUARD_PROMETHEUS_PORT:-7591}:9090"
    volumes:
      - ./lab/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./lab/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Docker Desktop provides this; on Linux it has to be asked for. It is how the containerised
      # Prometheus reaches a plane a developer started on the host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:${PERMGUARD_LOKI_PORT:-7592}:3100"
    volumes:
      - ./lab/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./lab/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # Read-only: this reads container metadata and log files, and must never be able to change
      # anything about the daemon it is reading from.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # Traces, when a plane's `telemetry.otel` points here. Tempo keeps them for the lab's horizon;
  # Grafana queries it beside Prometheus and Loki.
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:${PERMGUARD_TEMPO_OTLP_PORT:-7593}:4317"
    volumes:
      - ./lab/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.1
    ports:
      - "127.0.0.1:${PERMGUARD_GRAFANA_PORT:-7590}:3000"
    environment:
      # A lab, on loopback, with no data worth protecting: a login screen between a demo and its
      # dashboard buys nothing. Never copy these three lines anywhere else.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_LOG_LEVEL: warn
      # Opens straight on the overview dashboard.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      GF_FEATURE_TOGGLES_ENABLE: lokiLogsDataplane
    volumes:
      - ./lab/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./lab/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  lab:
  all-in-one-state:
  control-plane-state:
  data-plane-state:
  data-plane-a-state:
  data-plane-b-state:
  data-plane-acme-state:
  data-plane-beta-state:
  temporal-a-state:
  temporal-b-state:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
