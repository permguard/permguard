# The checks this repository already had, made real.
#
# `task check` and the two structural checks existed before this file did, and ran only when somebody
# remembered to type them. For a security product a check that is not enforced is not a check.

name: ci

on:
  push:
    branches: [main, develop]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

# Read-only: nothing here publishes, and a job that compiles must not hold a token that could.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # build.rs validates these and fails the build when they are missing.
  PERMGUARD_COPYRIGHT_YEAR: "2022"
  PERMGUARD_COPYRIGHT_HOLDER: "Nitro Agility S.r.l."

jobs:
  check:
    name: lint, structure, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version declared as `rust-version` in Cargo.toml. Building with exactly the minimum is
      # what makes the minimum a fact: a job on `stable` would pass while the declared MSRV quietly
      # stopped compiling.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The chart's conformance tests (`permguard-conformance/tests/chart.rs`) render it with helm.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: the declared MSRV is the one we build with
        run: |
          declared="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          built="$(rustc --version | cut -d' ' -f2 | cut -d. -f1,2)"
          if [ "${declared}" != "${built}" ]; then
            echo "Cargo.toml declares rust-version ${declared}, this job builds with ${built}" >&2
            echo "update both, or the declared minimum is a claim nothing checks" >&2
            exit 1
          fi
          echo "ok: built with the declared minimum, ${declared}"
      - name: formatting
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: only the binary composes collaborators
        run: ./scripts/check-composition-root.sh
      - name: permguard-core keeps its dependency allowlist
        run: ./scripts/check-core-dependencies.sh
      - name: the Makefile and the Taskfile agree
        run: ./scripts/check-build-systems.sh
      - name: every source file carries the licence header
        run: ./scripts/check-license-headers.sh
      - name: every untrusted decoder is registered, bounded and fuzzed
        run: cargo test -p permguard-conformance --test boundaries --locked
      - name: the third-party notices match what the build links
        # A dependency change that does not reach THIRD_PARTY_NOTICES.md is a distribution whose
        # notices are wrong, which is why this fails the build rather than warning. The fix it
        # prints is one command: `task notices`, then commit.
        run: ./scripts/third-party-notices.sh --check
      - name: every feature combination still builds
        run: |
          cargo check -p permguard-std --all-targets --no-default-features --locked
          cargo check -p permguard-std --all-targets --locked
      - name: tests
        # --all-features because `permguard-std` keeps `provision` outside its default set, and a
        # plain run would never compile the tests that cover it.
        run: cargo test --workspace --all-features --locked
      # WP-7.13: what the traceability test checked, every section and finding of the blueprint to
      # the code and the tests above, kept with the run.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability
          path: target/traceability.json
          if-no-files-found: error

  # Deterministic replay on a second platform (TL-6): each runtime's golden vectors and upstream
  # corpora, and the rest of the languages crate, on Apple silicon — another operating system and
  # another architecture than the `check` job — against the same expected bytes.
  languages-macos:
    name: languages on macOS
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: the languages crate, vectors and corpora included
        run: cargo test -p permguard-languages --all-features --locked

  # The release benchmark's harness on every change (TS-3), so it cannot rot between releases: the
  # binaries built in release mode from this commit, a short ladder, every interface and evidence
  # mode, and the report kept as an artifact. A release runs the full ladder on what it published.
  benchmark:
    name: benchmark (short ladder) and serving gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: the release binaries and the harness
        run: cargo build --release --locked -p permguard-all-in-one -p permguard-cli -p permguard-conformance --bins
      - name: a short ladder, every interface and evidence mode
        run: |
          target/release/permguard-bench run \
            --server target/release/permguard-all-in-one --cli target/release/permguard \
            --storage-class "github-hosted runner, ephemeral disk" \
            --directory "${RUNNER_TEMP}/permguard-bench" \
            --ladder 1,8,64,256 --step-seconds 3 --warmup-seconds 2 \
            --revision "${GITHUB_SHA}" --out permguard-benchmark.json
          # Informative here: the serving gate is what holds a candidate to the objective.
          target/release/permguard-bench capacity permguard-benchmark.json ||
            echo "::warning title=Capacity::an interface and evidence mode met the objective at no step of the short ladder"
      # TS-4: the candidate meets the published objective with its headroom, refuses typed within
      # bounds past its request bound, and reaches no network from a decision. Blocking.
      - name: the serving gate
        run: |
          target/release/permguard-bench gate \
            --server target/release/permguard-all-in-one --cli target/release/permguard \
            --directory "${RUNNER_TEMP}/permguard-gate" --out permguard-gate.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: |
            permguard-benchmark.json
            permguard-gate.json
          if-no-files-found: warn

  fuzz:
    name: fuzz every untrusted decoder (short budget)
    # Pull requests only: a short run on every change catches a decoder that panics on its first
    # malformed input; the nightly workflow runs the long budget.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libFuzzer's sanitizer coverage needs nightly; nothing else in this repository does.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: cargo-fuzz
        run: cargo install cargo-fuzz@0.13.2 --locked
      - name: every target, 20 seconds each, bounded by the boundary registry
        run: ./scripts/fuzz.sh 20
      - name: keep what crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  supply-chain:
    name: advisories, licences, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  release-config:
    name: release configuration and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release configuration is only exercised by tagging, which is the worst moment to discover
      # it is wrong: the tag is already public. Both files are validated on every change instead.
      - name: goreleaser configuration is valid
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          # Same major pin as the release pipeline: validation must exercise
          # the release toolchain we actually use.
          version: "~> v2"
          args: check --config ./.goreleaser.yaml
        env:
          GORELEASER_KEY: ${{ secrets['GORELEASER_KEY'] }}

      - name: goreleaser pro configuration is valid
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: check --config ./.goreleaser-pro.yaml
        env:
          GORELEASER_KEY: ${{ secrets['GORELEASER_KEY'] }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The release Dockerfiles are built here with a stand-in binary, so a typo in a COPY path or a
      # broken stage fails a pull request rather than a release. The binary is not the point; the
      # image layout is — and these are the *same* Dockerfiles `dockers_v2` publishes, so what is
      # smoke-tested here is what ships. The context is assembled the way GoReleaser assembles it:
      # the binary at `${TARGETPLATFORM}/${BINARY_NAME}`, plus whatever `extra_files` lists.
      - name: the release images build
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          mkdir -p "${context}/linux/amd64" "${context}/docker"
          cp -R docker/rootfs "${context}/docker/rootfs"
          cp LICENSE "${context}/LICENSE"
          printf '#!/bin/sh\nexit 0\n' > "${context}/linux/amd64/stand-in"
          chmod +x "${context}/linux/amd64/stand-in"
          for dockerfile in docker/release/*.Dockerfile; do
            echo "building ${dockerfile}"
            docker buildx build \
              --platform linux/amd64 \
              --build-arg BINARY_NAME=stand-in \
              --file "${dockerfile}" \
              --output type=cacheonly \
              "${context}"
          done

  commits:
    name: commit subjects
    # Release notes are grouped by commit prefix, so a subject that does not carry one lands in
    # "Other" and is invisible. Checked on pull requests only: history already written cannot be
    # fixed by failing a build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every subject is a conventional commit
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|test|chore|refactor|perf|build|ci|revert)(\([a-z0-9./-]+\))?!?: .+'
          failed=0
          while read -r sha subject; do
            if ! printf '%s' "${subject}" | grep -qE "${pattern}"; then
              echo "${sha} does not start with a type: ${subject}" >&2
              failed=1
            fi
            if [ "${#subject}" -gt 100 ]; then
              echo "${sha} has a subject longer than 100 characters" >&2
              failed=1
            fi
          done < <(git log --no-merges --format='%h %s' \
                     "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}")
          if [ "${failed}" -ne 0 ]; then
            echo "expected: <type>(<scope>): <subject>, for example 'fix(cli): report a draining plane as degraded'" >&2
            exit 1
          fi
          echo "ok: every commit subject carries a type"

  changelog:
    name: changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A changed interface with no changelog line is the normal way a release ends up
      # undocumented. The check is advisory — plenty of changes legitimately have nothing to say to
      # an operator — so it annotates rather than blocks.
      - name: does this need a changelog line
        continue-on-error: true
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "${base}"...HEAD)"
          watched="$(echo "${changed}" | grep -E '^(crates/.*/(src|config).*|crates/.*\.yml|charts/)' || true)"
          if [ -z "${watched}" ]; then
            echo "nothing an operator can see changed"
            exit 0
          fi
          if echo "${changed}" | grep -q '^CHANGELOG.md$'; then
            echo "ok: the changelog was updated"
            exit 0
          fi
          echo "::warning::this changes behaviour or configuration and CHANGELOG.md was not touched"

  forward-compatibility:
    name: the next toolchain
    runs-on: ubuntu-latest
    # The `check` job builds with the declared minimum. This one builds with whatever `stable` is
    # today, so a compiler change is found here rather than by a release that suddenly will not
    # build. Allowed to fail: it reports the future, and the future is not a regression in this
    # pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08; the toolchain is chosen by `toolchain:`, not by the ref
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The chart's conformance tests (`permguard-conformance/tests/chart.rs`) render it with helm.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: clippy and tests, on stable
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-08; the toolchain is chosen by `toolchain:`, not by the ref
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The chart's conformance tests (`permguard-conformance/tests/chart.rs`) render it with helm.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-llvm-cov
      # Reported, not gated. A coverage threshold buys tests written to move a number; a number in
      # the summary of every run buys the conversation about the part nobody covered.
      - name: measure
        run: |
          cargo llvm-cov --workspace --all-features --summary-only \
            | tee "${GITHUB_STEP_SUMMARY}"

  chart-e2e:
    name: helm chart on a cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The end-to-end run upgrades from the single-group chart, read from its last commit.
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: kind, pinned by digest
        run: |
          set -euo pipefail
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: the data plane image
        run: docker build --build-arg PACKAGE=permguard-data-plane --build-arg BIN=permguard-data-plane -t permguard/data-plane:e2e .
      # A group scaled 3 → 1 and back: drained replicas, retained claims, the same identities, and
      # an upgrade from the single-group chart that keeps its claim (TD-1).
      - name: scale a group down and up
        run: ./scripts/chart-e2e.sh permguard/data-plane:e2e

  # Image verification at deploy (TD-4): with the chart's `verify-image` on, an unattested image, an
  # image attested for another repository, by another builder or from another ref never reaches
  # Ready, and an attested image passes under its own identity.
  chart-supply-chain:
    name: helm chart refuses unverified images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: kind, pinned by digest
        run: |
          set -euo pipefail
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: the verifier image
        run: docker build -f docker/verifier/Dockerfile -t permguard/verifier:e2e docker/verifier
      - name: unverified images never reach Ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/chart-supply-chain.sh permguard/verifier:e2e

  # The Compose lab's five profiles, each enrolled by the lab's own authority and checked — the same
  # script and the same assertions on Linux and on macOS (TD-3, F-24, F-25, F-26). The image is built
  # once, here, and the macOS job runs that very image.
  compose-lab:
    name: compose lab (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the lab image
        run: docker build -f lab/compose/Dockerfile -t permguard/lab:local .
      - name: every profile
        run: NO_BUILD=1 ./scripts/compose-lab.sh
      - name: the image, for the macOS job
        run: docker save permguard/lab:local | gzip > lab-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-lab-image
          path: lab-image.tar.gz
          retention-days: 1
      - name: the logs of a failed profile
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-lab-linux
          path: target/compose-lab

  compose-lab-macos:
    name: compose lab (macos)
    needs: compose-lab
    # An Intel runner: the Docker engine runs in a virtual machine, which the Apple silicon runners
    # cannot nest. Both runners are amd64, so the Linux job's image runs here unchanged.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compose-lab-image
      - name: a Docker engine, in Colima
        run: |
          set -euo pipefail
          brew install colima docker docker-compose
          mkdir -p "${HOME}/.docker/cli-plugins"
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" "${HOME}/.docker/cli-plugins/docker-compose"
          colima start --cpu 3 --memory 8 --disk 30
          docker version
          docker compose version
      - name: the Linux job's image
        run: gunzip -c lab-image.tar.gz | docker load
      - name: every profile
        run: NO_BUILD=1 ./scripts/compose-lab.sh
      - name: the logs of a failed profile
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-lab-macos
          path: target/compose-lab

  chart-drain:
    name: drain controller and storage takeover on a cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: kind, pinned by digest
        run: |
          set -euo pipefail
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: the images
        run: |
          set -euo pipefail
          docker build --build-arg PACKAGE=permguard-data-plane --build-arg BIN=permguard-data-plane -t permguard/data-plane:e2e .
          docker build --build-arg PACKAGE=permguard-control-plane --build-arg BIN=permguard-control-plane -t permguard/control-plane:e2e .
          docker build --build-arg PACKAGE=permguard-cli --build-arg BIN=permguard -t permguard/cli:e2e .
      # A forced timeout never deletes an evidence claim; the fenced drain Job prints its receipt
      # (TD-2).
      - name: the drain controller
        run: ./scripts/chart-reclaim-e2e.sh
      # Kill the replica while it writes; no stale-writer frame (TD-2, H-05).
      - name: the storage takeover gate
        run: ./scripts/chart-takeover.sh permguard/data-plane:e2e takeover-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takeover-qualification
          path: takeover-qualification.json

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: lint
        run: helm lint charts/permguard
      # Rendered in every shape the chart supports, because a template that only works with the
      # default values is a template that breaks the first time somebody turns something on.
      # Outside developmentMode every public listener states its TLS (WP-2.11): each shape below
      # says how, a Secret for some and an upstream termination for others.
      - name: render every shape
        run: |
          set -euo pipefail
          # From `production` every Host declares its storage, backups and objectives (TS-5).
          tls="--values charts/permguard/ci/production-controls.yaml --set controlPlane.tls.secretName=permguard-control-plane-tls,dataPlane.tls.terminatedUpstream=true,allInOne.tls.secretName=permguard-all-in-one-tls"
          for values in \
            "${tls}" \
            "--values charts/permguard/values-production.yaml --values charts/permguard/ci/image-verification.yaml --values charts/permguard/ci/production-controls.yaml" \
            "${tls} --set allInOne.enabled=true,controlPlane.enabled=false,dataPlane.enabled=false" \
            "${tls} --set persistence.enabled=true" \
            "${tls} --set dataPlane.replicaCount=1" \
            "${tls} --set metrics.serviceMonitor.enabled=true" \
            "${tls} --set image.registry=ghcr.io" \
            "--set developmentMode=true,autogenerate=true,controlPlane.assurance.profile=development,dataPlane.groupDefaults.assurance.profile=development"; do
            echo "helm template ${values}"
            # shellcheck disable=SC2086
            helm template permguard charts/permguard ${values} > /dev/null
          done
      # The shape the chart must refuse: the all-in-one beside a standalone plane is two deployments
      # fighting over one identity, and asking for it has to fail at template time, not in a cluster.
      - name: the chart refuses the all-in-one beside the planes
        run: |
          set -euo pipefail
          # The TS-5 declarations in, so each shape below is refused for its own reason.
          tls="--values charts/permguard/ci/production-controls.yaml --set controlPlane.tls.secretName=permguard-control-plane-tls,dataPlane.tls.terminatedUpstream=true,allInOne.tls.secretName=permguard-all-in-one-tls"
          # A public listener secured by nothing, outside developmentMode, is refused at render
          # (WP-2.11), and so is one stating both ways at once.
          if helm template permguard charts/permguard > /dev/null 2>&1; then
            echo "the chart rendered public listeners in the clear outside developmentMode" >&2
            exit 1
          fi
          if helm template permguard charts/permguard ${tls} \
               --set dataPlane.tls.secretName=permguard-data-plane-tls > /dev/null 2>&1; then
            echo "the chart rendered a listener with a Secret and an upstream termination" >&2
            exit 1
          fi
          if helm template permguard charts/permguard ${tls} --set allInOne.enabled=true > /dev/null 2>&1; then
            echo "the chart rendered a mixed all-in-one + planes shape it must refuse" >&2
            exit 1
          fi
          if helm template permguard charts/permguard ${tls} \
               --set controlPlane.enabled=false --set dataPlane.enabled=false > /dev/null 2>&1; then
            echo "the chart rendered an install that installs nothing" >&2
            exit 1
          fi
          # A data plane group that records evidence keeps a volume per replica, and scaling it on
          # load waits for drain recovery (TD-2); every other group refusal is a named test of
          # `crates/permguard-conformance/tests/chart.rs`.
          if helm template permguard charts/permguard ${tls} \
               --set dataPlane.autoscaling.enabled=true > /dev/null 2>&1; then
            echo "the chart rendered an autoscaled data plane group that keeps evidence" >&2
            exit 1
          fi
          # A control plane holds the authority: the catalog, the refs, the key ring. Two of them
          # behind one Service either fight over a volume or diverge. An autoscaler that can reach
          # more than one replica is asking for exactly that, so it is refused the same way a
          # replicaCount above one is.
          if helm template permguard charts/permguard ${tls} \
               --set controlPlane.autoscaling.enabled=true > /dev/null 2>&1; then
            echo "the chart rendered a control plane that can autoscale past one replica" >&2
            exit 1
          fi
          echo "ok: the mixed shape and the empty shape are both refused"
      # Blocking: a chart that renders objects the API server would refuse is a chart that fails at
      # install time, and CI is the place to find that out. The render itself must succeed too — the
      # `|| true` would have turned a broken template into an empty file kubeconform waves through.
      #
      # The render happens on the runner, where helm already is, and only the *validation* runs in
      # the container. The previous shape asked the image for a shell to run both — and that image
      # has no shell, so the step failed before it validated anything. A container that carries one
      # binary is the point of that image; expecting a shell inside it was the mistake.
      - name: render the chart for validation
        run: helm template permguard charts/permguard --values charts/permguard/ci/production-controls.yaml --set controlPlane.tls.secretName=permguard-control-plane-tls,dataPlane.tls.secretName=permguard-data-plane-tls > rendered.yaml
      - uses: docker://ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e # latest, 2026-08
        with:
          args: -strict -summary -ignore-missing-schemas /github/workspace/rendered.yaml
