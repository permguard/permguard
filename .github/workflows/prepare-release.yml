# Cuts a release: moves the chart, promotes the changelog, and creates the tag that the release
# pipeline reacts to.
#
# The version of a release is its tag. GoReleaser stamps it into every build as
# `PERMGUARD_BUILD_VERSION`, so Cargo.toml stays where it is and no release churns the lockfile.
# What still has to be in the commit the tag points at is the chart: its `appVersion` is the image
# tag it deploys, and Helm reads a file, not an environment variable. This is what puts it there,
# and then proves — by running the binaries it just built — that the tag is what they report.

name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v — e.g. 0.1.1. The tag becomes v<version>."
        required: true
        type: string
      dry_run:
        description: "Do everything, verify it, and push nothing."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Move to ${{ inputs.version }} and tag
    runs-on: ubuntu-latest
    steps:
      # `GH_TOKEN` rather than the job's own: a tag pushed with the default `GITHUB_TOKEN` does not
      # trigger other workflows, so the release pipeline would never see it and the release would
      # silently never happen. The same token the release already uses to publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # The toolchain the release is built with, because this runs the same checks the release
      # pipeline will run, against the same lockfile.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the chart
        run: ./scripts/prepare-release.sh "${{ inputs.version }}"

      # Everything the release pipeline's `verify` job would refuse the tag for, refused here
      # instead — while the tag is still hypothetical and costs nothing to not create.
      - name: The chart would name this version
        run: |
          expected="${{ inputs.version }}"
          expected="${expected#v}"
          if ! grep -qx "version: ${expected}" charts/permguard/Chart.yaml ||
             ! grep -qx "appVersion: \"${expected}\"" charts/permguard/Chart.yaml; then
            echo "Chart.yaml does not carry version and appVersion ${expected}" >&2
            grep -E '^(version|appVersion):' charts/permguard/Chart.yaml >&2
            exit 1
          fi
      - name: formatting
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: only the binary composes collaborators
        run: ./scripts/check-composition-root.sh
      - name: permguard-core keeps its dependency allowlist
        run: ./scripts/check-core-dependencies.sh
      - name: the build systems agree
        run: ./scripts/check-build-systems.sh
      - name: every source file carries the licence header
        run: ./scripts/check-license-headers.sh
      - name: tests
        run: cargo test --workspace --all-features --locked

      # These are the four artifacts GoReleaser ships. Built the way the release builds them —
      # with the version stamped in — and then asked what they are, because a stamp that never
      # reaches rustc is exactly the failure this whole scheme could have.
      - name: Every binary reports the requested version
        run: |
          set -euo pipefail
          expected="${{ inputs.version }}"
          expected="${expected#v}"
          export PERMGUARD_BUILD_VERSION="${expected}"
          export PERMGUARD_BUILD_COMMIT="${GITHUB_SHA}"
          cargo build --locked \
            --package permguard-cli \
            --package permguard-all-in-one \
            --package permguard-control-plane \
            --package permguard-data-plane
          for binary in permguard permguard-all-in-one permguard-control-plane permguard-data-plane; do
            output="$("target/debug/${binary}" version 2>&1)"
            if ! grep -Fq "${expected}" <<<"${output}"; then
              echo "${binary} does not report ${expected}:" >&2
              echo "${output}" >&2
              exit 1
            fi
            echo "${binary}: ${expected}"
          done

      - name: What changed
        run: git --no-pager diff --stat

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          version="${version#v}"
          git config user.name "Permguard Team"
          git config user.email "opensource@permguard.com"
          git add charts/permguard/Chart.yaml CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${version}"
            git push origin HEAD:main
          else
            echo "the version commit is already on main; only the tag was missing"
          fi
          git tag -a "v${version}" -m "v${version}"
          git push origin "v${version}"
          echo "tagged v${version} — the release pipeline takes it from here"

      - name: Nothing was pushed
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry run: the working tree holds ${{ inputs.version }} and every check passed,"
          echo "but no commit and no tag left this runner."
