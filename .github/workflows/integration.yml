# What a change is held to beyond `ci.yml`: the images and what runs on them, the Compose lab, the
# chart on a cluster, the drain controller, the tests on Windows and the benchmark with its serving
# gate. Minutes each, tens of minutes together, so they are not run once per commit of a branch.
#
#   a pull request       every job, as before it merges; a new push supersedes the run before it
#   a push to a branch   every job but the three below, for the latest commit: one run at a time,
#                        and of the pushes that arrive meanwhile only the newest waits its turn
#   every night          every job, on `main`
#   asked for by hand    every job, on the ref named: what a release candidate runs before its tag
#
# Not on a push: the Compose lab on macOS, the next toolchain and the coverage report.

name: integration

on:
  push:
    branches: [main, develop]
    paths-ignore: ["docs/**", "website/**"]
  pull_request:
    paths-ignore: ["docs/**", "website/**"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# One group per pull request, and per branch and kind of run otherwise: a nightly run and a run
# asked for by hand are never the push a newer push replaces. Only a pull request's run is
# cancelled while it runs; on a branch the run in progress finishes and the newest pending one
# follows it, so the commit a branch stands at is always verified whole.
concurrency:
  group: integration-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: nothing here publishes, and a job that compiles must not hold a token that could.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # build.rs validates these and fails the build when they are missing.
  PERMGUARD_COPYRIGHT_YEAR: "2022"
  PERMGUARD_COPYRIGHT_HOLDER: "Nitro Agility S.r.l."

jobs:
  # The Compose lab's five profiles, each enrolled by the lab's own authority and checked — the same
  # script and the same assertions on Linux and on macOS (TD-3, F-24, F-25, F-26). The image is built
  # once, here, and the macOS job runs that very image.
  # The four binaries every cluster and lab job below runs, built once — natively, with the
  # release's own cross toolchain, warm from the `release-linux_amd64` cache the release's Linux
  # build shares — and the three e2e images and the lab image made from them in seconds. Before
  # this, three jobs each compiled the workspace from scratch inside Docker, nine to twelve minutes
  # apiece with nothing cached, and the macOS lab waited for the Linux lab to finish to get its image.
  images:
    name: the e2e and lab images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08
        with:
          toolchain: "1.97"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-linux_amd64
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        # Pinned: with no version the action asks ziglang.org for the latest one at every run, so the
        # job fails when that fetch does, and a release would be built by whatever Zig is newest.
        with:
          version: 0.17.1
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.4
      - name: the binaries, as the release builds them
        # No version stamp: the binaries report the workspace version, as the lab's always did.
        env:
          PERMGUARD_BUILD_VERSION: ""
        run: |
          set -euo pipefail
          ./scripts/build-cross.sh prebuilt x86_64-unknown-linux-musl
          # Static, with no program interpreter. musl links these static-pie, which `ldd` does not
          # call "statically linked", so the ELF headers are asked instead.
          for binary in prebuilt/linux_amd64/*; do
            if readelf --program-headers "${binary}" | grep -q 'Requesting program interpreter'; then
              echo "${binary} needs a dynamic loader and the runtime image has no libc" >&2
              exit 1
            fi
          done
      - name: the images, from the binaries
        run: |
          set -euo pipefail
          docker build --build-arg BINARY_SOURCE=prebuilt --build-arg BIN=permguard-data-plane -t permguard/data-plane:e2e .
          docker build --build-arg BINARY_SOURCE=prebuilt --build-arg BIN=permguard-control-plane -t permguard/control-plane:e2e .
          docker build --build-arg BINARY_SOURCE=prebuilt --build-arg BIN=permguard -t permguard/cli:e2e .
          docker build --build-arg BINARY_SOURCE=prebuilt -f lab/compose/Dockerfile -t permguard/lab:local .
          docker save permguard/data-plane:e2e permguard/control-plane:e2e permguard/cli:e2e | gzip > e2e-images.tar.gz
          docker save permguard/lab:local | gzip > lab-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-lab-image
          path: lab-image.tar.gz
          retention-days: 1

  chart-e2e:
    name: helm chart on a cluster
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The end-to-end run upgrades from the single-group chart, read from its last commit.
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: kind, pinned by digest
        run: |
          set -euo pipefail
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images
      - name: the images, built once by the `images` job
        run: gunzip -c e2e-images.tar.gz | docker load
      # A group scaled 3 → 1 and back: drained replicas, retained claims, the same identities, and
      # an upgrade from the single-group chart that keeps its claim (TD-1).
      - name: scale a group down and up
        run: ./scripts/chart-e2e.sh permguard/data-plane:e2e

  compose-lab:
    name: compose lab (linux)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose-lab-image
      - name: the lab image, built once by the `images` job
        run: gunzip -c lab-image.tar.gz | docker load
      - name: every profile
        run: NO_BUILD=1 ./scripts/compose-lab.sh
      - name: the logs of a failed profile
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-lab-linux
          path: target/compose-lab

  compose-lab-macos:
    name: compose lab (macos)
    # Not on a push: a pull request, the nightly run and a run asked for by hand have it; the
    # release candidate gets it from that run by hand before it is tagged.
    if: github.event_name != 'push'
    # On the image, not on the Linux job: the two run the same profiles side by side.
    needs: images
    # An Intel runner: the Docker engine runs in a virtual machine, which the Apple silicon runners
    # cannot nest. Both runners are amd64, so the Linux job's image runs here unchanged.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose-lab-image
      - name: a Docker engine, in Colima
        run: |
          set -euo pipefail
          brew install colima docker docker-compose
          mkdir -p "${HOME}/.docker/cli-plugins"
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" "${HOME}/.docker/cli-plugins/docker-compose"
          colima start --cpu 3 --memory 8 --disk 30
          docker version
          docker compose version
      - name: the lab image, built once by the `images` job
        run: gunzip -c lab-image.tar.gz | docker load
      # The evaluation latency is measured through a Docker engine nested in a virtual machine on
      # a shared Intel runner: twice the product's objective here, which the Linux job holds as
      # stated (bench/slo.json); every other assertion is the same.
      - name: every profile
        run: NO_BUILD=1 LAB_P99_OBJECTIVE_SCALE=2 ./scripts/compose-lab.sh
      - name: the logs of a failed profile
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-lab-macos
          path: target/compose-lab

  chart-drain:
    name: drain controller and storage takeover on a cluster
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `chart-reclaim-e2e.sh` builds the command line, whose generated gRPC code needs `protoc`.
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: kind, pinned by digest
        run: |
          set -euo pipefail
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images
      - name: the images, built once by the `images` job
        run: gunzip -c e2e-images.tar.gz | docker load
      # A forced timeout never deletes an evidence claim; the fenced drain Job prints its receipt
      # (TD-2).
      - name: the drain controller
        run: ./scripts/chart-reclaim-e2e.sh
      # Kill the replica while it writes; no stale-writer frame (TD-2, H-05).
      - name: the storage takeover gate
        run: ./scripts/chart-takeover.sh permguard/data-plane:e2e takeover-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takeover-qualification
          path: takeover-qualification.json

  windows-tests:
    name: the tests, on Windows
    runs-on: windows-latest
    timeout-minutes: 120
    # The `windows` job proves the crates compile for Windows; this one runs their tests there, where
    # the release's Windows binaries run. It checks out the way git does on Windows, CRLF by default,
    # so `.gitattributes` is what keeps the fixtures and vectors the bytes that were committed
    # (knowledge/rust/2-verification). Required since its first green run: a change that breaks
    # Windows fails here, as it fails anywhere else.
    steps:
      # Some fixtures' paths pass the 260 characters Windows allows by default.
      - name: long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08; the toolchain is chosen by `toolchain:`, not by the ref
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The chart's conformance tests render it with helm, as the `check` job does.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: no file changed its line endings in the checkout
        shell: bash
        run: |
          crlf="$(git ls-files --eol | grep 'w/crlf' || true)"
          if [ -n "${crlf}" ]; then
            echo "::error::these files were checked out with CRLF: ${crlf}"
            exit 1
          fi
      # Every test binary, not the first that fails: one run reports all that Windows breaks.
      - name: every test, on Windows
        run: cargo test --workspace --all-features --locked --no-fail-fast

  # The release benchmark's harness on every change (TS-3), so it cannot rot between releases: the
  # binaries built in release mode from this commit, a short ladder, every interface and evidence
  # mode, and the report kept as an artifact. A release runs the full ladder on what it published.
  benchmark:
    name: benchmark (short ladder) and serving gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08
        with:
          toolchain: "1.97"
      # Named, so the release pipeline's `verify` job, which builds the same release binaries for
      # the same gate, restores what this job saved on `main`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: gate
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: the release binaries and the harness
        run: cargo build --release --locked -p permguard-all-in-one -p permguard-cli -p permguard-conformance --bins
      - name: a short ladder, every interface and evidence mode
        run: |
          target/release/permguard-bench run \
            --server target/release/permguard-all-in-one --cli target/release/permguard \
            --storage-class "github-hosted runner, ephemeral disk" \
            --directory "${RUNNER_TEMP}/permguard-bench" \
            --ladder 1,8,64,256 --step-seconds 3 --warmup-seconds 2 \
            --revision "${GITHUB_SHA}" --out permguard-benchmark.json
          # Informative here: the serving gate is what holds a candidate to the objective.
          target/release/permguard-bench capacity permguard-benchmark.json ||
            echo "::warning title=Capacity::an interface and evidence mode met the objective at no step of the short ladder"
      # TS-4: the candidate meets the published objective with its headroom, refuses typed within
      # bounds past its request bound, and reaches no network from a decision. Blocking.
      - name: the serving gate
        run: |
          target/release/permguard-bench gate \
            --server target/release/permguard-all-in-one --cli target/release/permguard \
            --directory "${RUNNER_TEMP}/permguard-gate" --out permguard-gate.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: |
            permguard-benchmark.json
            permguard-gate.json
          if-no-files-found: warn

  forward-compatibility:
    name: the next toolchain
    # Not on a push: a pull request, the nightly run and a run asked for by hand have it; the
    # release candidate gets it from that run by hand before it is tagged.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The `check` job builds with the declared minimum. This one builds with whatever `stable` is
    # today, so a compiler change is found here rather than by a release that suddenly will not
    # build. Allowed to fail: it reports the future, and the future is not a regression in this
    # pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08; the toolchain is chosen by `toolchain:`, not by the ref
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The chart's conformance tests (`permguard-conformance/tests/chart.rs`) render it with helm.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: clippy and tests, on stable
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

  coverage:
    name: coverage
    # Not on a push: a pull request, the nightly run and a run asked for by hand have it; the
    # release candidate gets it from that run by hand before it is tagged.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08; the toolchain is chosen by `toolchain:`, not by the ref
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The chart's conformance tests (`permguard-conformance/tests/chart.rs`) render it with helm.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov
      # Reported, not gated. A coverage threshold buys tests written to move a number; a number in
      # the summary of every run buys the conversation about the part nobody covered.
      - name: measure
        run: |
          cargo llvm-cov --workspace --all-features --summary-only \
            | tee "${GITHUB_STEP_SUMMARY}"
