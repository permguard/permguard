# Builds and publishes docs.permguard.com, whose custom domain belongs to this repository.
#
#   /                the Permguard documentation, `latest`, built from `main`
#   /MAJOR.MINOR/    each documented line, built from its newest `vMAJOR.MINOR.PATCH` tag
#   /soglia/         the Soglia site, built from permguard/soglia
#
# Pages replaces the whole site on each deploy, so each deploy rebuilds all of it
# (see `website/scripts/build-versions.sh`). Deploys run only from `main`, which the `github-pages`
# environment allows: a release tag asks for a fresh run on `main`, and that run picks the tag up.
# The daily schedule brings Soglia changes in even when nothing changed here.

name: website

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every release tag reaches this workflow.
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [soglia-docs]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling one already publishing.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  # A release tag hands over to a run on `main`, which rebuilds every version including this one.
  retrigger:
    name: rebuild from main
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: dispatch the website workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "${GITHUB_REPOSITORY}" --ref main

  # Pull requests only prove that `latest` still builds.
  check:
    name: build latest
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run docs:build

  build:
    name: build the site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Every release tag is needed to build its version.
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: permguard/soglia
          ref: main
          path: .soglia
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: build every Permguard version
        run: >-
          website/scripts/build-versions.sh
          "${RUNNER_TEMP}/site"
          "${{ steps.pages.outputs.base_path }}"
          "${{ steps.pages.outputs.base_url }}"
      - name: build Soglia under /soglia
        working-directory: .soglia/website
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/soglia
        run: |
          npm ci --no-audit --no-fund
          npm run docs:build
          mkdir -p "${RUNNER_TEMP}/site/soglia"
          cp -R .vitepress/dist/. "${RUNNER_TEMP}/site/soglia/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
