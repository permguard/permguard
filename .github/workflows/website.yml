# Checks the documentation site in `website/` and asks the organisation site to publish it.
#
# The documentation is served at the root of docs.permguard.com, a domain owned by the
# permguard/permguard.github.io repository. That repository builds `latest` from `main` and every
# `MAJOR.MINOR` line from its newest `vMAJOR.MINOR.PATCH` tag (see `website/scripts/build-versions.sh`)
# and deploys them. This workflow only makes sure `latest` still builds, then asks it for a run.
#
# The request needs the `DOCS_DISPATCH_TOKEN` secret: a token allowed to create repository dispatch
# events on permguard/permguard.github.io (Contents: read and write). Without it the check still
# runs, and the organisation site catches up on its daily schedule.

name: website

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every release tag reaches this workflow.
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: build latest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: install
        run: npm ci
      - name: build
        run: npm run docs:build

  publish:
    name: ask the organisation site to publish
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: dispatch permguard-docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::DOCS_DISPATCH_TOKEN is not set; docs.permguard.com updates on its daily schedule."
            exit 0
          fi
          gh api repos/permguard/permguard.github.io/dispatches \
            -f event_type=permguard-docs \
            -f "client_payload[ref]=${GITHUB_REF}"
