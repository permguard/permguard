name: Release Pipeline

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Read-only by default. Building, packaging, attestation and publication run in the reusable
# workflow `release-build.yml`, the release's SLSA Build L3 builder; inside it, only the job that
# compiles nothing may write a release, push an image or mint the OIDC token that signs an
# attestation: a job that compiles runs every dependency's build script, and one holding
# `id-token: write` would let that script sign provenance in this repository's name. The one
# attestation made here, the evidence manifest's, is made by the last job, which compiles nothing
# either: `scripts/verify-evidence.sh` names this file as its signer.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PERMGUARD_COPYRIGHT_YEAR: "2022"
  PERMGUARD_COPYRIGHT_HOLDER: "Nitro Agility S.r.l."

jobs:
  # Everything that can say no, before anything is published. A tag is already public by the time
  # this runs, so the worst outcome here is a release that does not happen — which is recoverable,
  # and a released binary that was never tested is not.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The binaries take their version from this tag, so there is nothing in Cargo.toml to agree
      # with. The chart is the exception: its appVersion is the image tag it deploys, and Helm
      # reads a file — a chart left behind would deploy images this release does not publish.
      - name: The chart must name this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -qx "version: ${tag}" charts/permguard/Chart.yaml ||
             ! grep -qx "appVersion: \"${tag}\"" charts/permguard/Chart.yaml; then
            echo "Chart.yaml does not carry version and appVersion ${tag}" >&2
            grep -E '^(version|appVersion):' charts/permguard/Chart.yaml >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: formatting
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: only the binary composes collaborators
        run: ./scripts/check-composition-root.sh
      - name: permguard-core keeps its dependency allowlist
        run: ./scripts/check-core-dependencies.sh
      - name: the build systems agree
        run: ./scripts/check-build-systems.sh
      - name: every source file carries the licence header
        run: ./scripts/check-license-headers.sh
      - name: tests
        run: cargo test --workspace --all-features --locked
      # TS-4: the candidate meets its published objective with its headroom, refuses typed within
      # bounds, and reaches no network from a decision — before anything is published.
      - name: the serving gate
        run: |
          cargo build --release --locked -p permguard-all-in-one -p permguard-cli -p permguard-conformance --bins
          target/release/permguard-bench gate \
            --server target/release/permguard-all-in-one --cli target/release/permguard \
            --directory "${RUNNER_TEMP}/permguard-gate" --out permguard-gate.json
      # WP-7.13: the serving gate's verdict and the traceability report the tests wrote, kept for
      # the evidence manifest the last job pins to the release.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified
          path: |
            permguard-gate.json
            target/traceability.json
          retention-days: 1
          if-no-files-found: warn

  supply-chain:
    name: Advisories, licences, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  # The builder: every binary, every package and image, their provenance, its verification, and the
  # release. A reusable workflow, so the provenance names it rather than this file (see its header).
  # The permissions are the most it may use; inside, only the job that compiles nothing uses them.
  build:
    name: Build and publish
    needs: [verify, supply-chain]
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-build.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  # The release benchmark (TS-3, H-09): the Linux binaries this release published, measured on a
  # GitHub-hosted runner over every served interface and evidence mode, a full ladder. It compiles
  # the harness, so it holds a read-only token; the report is attached by the job after it. It
  # reports on a release already published and never blocks it: a run that does not complete
  # leaves a note in the report's place, so no release is silently without one.
  benchmark:
    name: Benchmark what was published
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08
        with:
          toolchain: "1.97"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The published server and CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --dir published \
            --pattern 'permguard_all_in_one_Linux_x86_64.tar.gz' --pattern 'permguard_cli_Linux_x86_64.tar.gz'
          mkdir -p shipped
          for archive in published/*.tar.gz; do tar -xzf "${archive}" -C shipped; done
          install -m 0755 "$(find shipped -type f -name permguard-all-in-one)" ./permguard-all-in-one
          install -m 0755 "$(find shipped -type f -name permguard)" ./permguard
      - name: The harness
        run: cargo build --release --locked -p permguard-conformance --bin permguard-bench
      - name: Measure
        run: |
          target/release/permguard-bench run \
            --server ./permguard-all-in-one --cli ./permguard \
            --storage-class "github-hosted runner, ephemeral disk" \
            --directory "${RUNNER_TEMP}/permguard-bench" \
            --revision "${GITHUB_SHA}" --out permguard-benchmark.json
          # The capacity is read off the report whatever it says; the report is what is published.
          { target/release/permguard-bench capacity permguard-benchmark.json ||
            echo 'an interface and evidence mode met the objective at no step'; } | tee capacity.txt
      - name: Say what did not complete
        if: always()
        run: |
          if [ ! -s permguard-benchmark.json ]; then
            printf 'the release benchmark of %s (%s) did not complete; see the workflow run %s\n' \
              "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > permguard-benchmark.txt
          fi
          [ -s capacity.txt ] || echo 'no capacity was read off a report' > capacity.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: |
            permguard-benchmark.json
            permguard-benchmark.txt
            capacity.txt
          retention-days: 1
          if-no-files-found: error

  # Attaches the report. Separate from the measurement because writing to the release needs a token
  # that may write, and a job that compiles must not hold one.
  publish-benchmark:
    name: Publish the benchmark report
    needs: [build, benchmark]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark
      - name: Attach the report to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The report, or the note that says why there is none: a release is never silently
          # without either.
          if [ -s permguard-benchmark.json ]; then
            gh release upload "${GITHUB_REF_NAME}" permguard-benchmark.json --clobber
          else
            gh release upload "${GITHUB_REF_NAME}" permguard-benchmark.txt --clobber
            echo "::warning title=No benchmark report::$(cat permguard-benchmark.txt)"
          fi
          {
            echo "## Benchmark"
            echo
            echo '```'
            cat capacity.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # The drills (WP-7.7) against the release: the split-brain drill with the server this release
  # published, the restore drill on the Compose lab built from the tagged source. They report on a
  # release already published and never block it; each writes its record, or the job after it
  # leaves a note in the record's place. It compiles the lab image, so it holds a read-only token.
  drills:
    name: Drill what was published
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The published server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --dir published --pattern 'permguard_all_in_one_Linux_x86_64.tar.gz'
          mkdir -p shipped
          tar -xzf published/permguard_all_in_one_Linux_x86_64.tar.gz -C shipped
          install -m 0755 "$(find shipped -type f -name permguard-all-in-one)" ./permguard-all-in-one
      - name: Split-brain, on one volume
        run: ./scripts/drill-split-brain.sh ./permguard-all-in-one drill-split-brain.json
      - name: Restore, on the Compose lab
        if: always()
        run: |
          docker build -f lab/compose/Dockerfile -t permguard/lab:local .
          NO_BUILD=1 ./scripts/drill-restore.sh drill-restore.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drills
          path: |
            drill-split-brain.json
            drill-restore.json
          retention-days: 1
          if-no-files-found: ignore

  # Attaches the drill records. Separate from the drills because writing to the release needs a
  # token that may write, and a job that compiles must not hold one.
  publish-drills:
    name: Publish the drill records
    needs: [build, drills]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: drills
      - name: Attach the records to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Each record, or the note that says why there is none: a release is never silently
          # without either.
          for drill in drill-split-brain drill-restore; do
            if [ -s "${drill}.json" ]; then
              gh release upload "${GITHUB_REF_NAME}" "${drill}.json" --clobber
            else
              printf 'the %s of %s (%s) did not complete; see the workflow run %s\n' \
                "${drill}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" \
                "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "${drill}.txt"
              gh release upload "${GITHUB_REF_NAME}" "${drill}.txt" --clobber
              echo "::warning title=No ${drill} record::$(cat "${drill}.txt")"
            fi
          done

  # The release fuzz budget (WP-7.13): every coverage-guided target of the tagged source for the
  # nightly's ten minutes each, bounded by the boundary registry. The targets do not fit one job's
  # time limit, so they are dealt round-robin to six shards, each writing its own record; the job
  # after them merges the records and the release passes only when every target ran in a shard that
  # passed without a crash. Read-only: it compiles.
  fuzz:
    name: Fuzz the tagged source for the release budget (shard ${{ matrix.shard }})
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08
        with:
          toolchain: nightly
      - name: cargo-fuzz
        run: cargo install cargo-fuzz@0.13.2 --locked
      - name: this shard's targets
        run: |
          set -euo pipefail
          sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -v '^permguard-fuzz$' |
            awk -v shard="${SHARD}" -v shards="${SHARDS}" '(NR - 1) % shards == shard' > shard-targets.txt
          cat shard-targets.txt
      - name: every target of the shard, ten minutes each
        run: |
          set -euo pipefail
          mapfile -t targets < shard-targets.txt
          ./scripts/fuzz.sh 600 "${targets[@]}"
      - name: the shard's record
        if: always()
        run: |
          set -euo pipefail
          targets="$(jq -R . shard-targets.txt | jq -s .)"
          crashes=0
          if [ -d fuzz/artifacts ]; then
            crashes="$(find fuzz/artifacts -type f | wc -l | tr -d ' ')"
          fi
          jq -n --argjson shard "${SHARD}" --argjson targets "${targets}" \
            --argjson crashes "${crashes}" --arg result "${{ job.status }}" \
            '{shard: $shard, seconds_per_target: 600, targets: $targets, crashes: $crashes,
              result: (if $result == "success" and $crashes == 0 then "passed" else "failed" end)}' \
            > "fuzz-shard-${SHARD}.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-shard-${{ matrix.shard }}
          path: |
            fuzz-shard-${{ matrix.shard }}.json
            fuzz/artifacts/
          retention-days: 1
          if-no-files-found: ignore

  # Merges the shards' records into the release's one and attaches it, or the note saying why there
  # is none. Separate because writing to the release needs a token that may write; it compiles
  # nothing.
  publish-fuzz:
    name: Publish the fuzz record
    needs: [build, fuzz]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: fuzz-shard-*
          path: shards
          merge-multiple: true
      - name: Merge the shards and attach the record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -v '^permguard-fuzz$' | jq -R . | jq -s 'sort')"
          if compgen -G 'shards/fuzz-shard-*.json' >/dev/null; then
            # Passed only when all six shards passed and together ran every target, each once.
            jq -s --arg commit "${GITHUB_SHA}" --arg tag "${GITHUB_REF_NAME}" --argjson expected "${expected}" \
              '{fuzz: "release budget", commit: $commit, tag: $tag, seconds_per_target: 600,
                shards: length, targets: ([.[].targets[]] | sort), crashes: ([.[].crashes] | add),
                missing: ($expected - [.[].targets[]]),
                result: (if length == 6 and all(.[]; .result == "passed")
                            and ([.[].targets[]] | sort) == $expected
                         then "passed" else "failed" end)}' \
              shards/fuzz-shard-*.json > fuzz-release.json
            gh release upload "${GITHUB_REF_NAME}" fuzz-release.json --clobber
          else
            printf 'the release fuzz budget of %s (%s) did not complete; see the workflow run %s\n' \
              "${GITHUB_REF_NAME}" "${GITHUB_SHA}" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > fuzz-release.txt
            gh release upload "${GITHUB_REF_NAME}" fuzz-release.txt --clobber
            echo "::warning title=No fuzz record::$(cat fuzz-release.txt)"
          fi

  # An independent rebuild, compared byte for byte with what was published. Never blocking:
  # provenance says where an artifact came from, reproducibility says anyone can get the same bytes,
  # and only the second claim depends on this job. It runs on a fresh runner without the build cache,
  # so nothing of the shipped build is reused, and it compares against the release's own archives —
  # what a third party would download — rather than an intermediate artifact. It holds a read-only
  # token and leaves none in `.git/config`: it compiles, and the release is already public.
  reproducible-rebuild:
    name: Rebuild independently and compare (non-blocking)
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-08
        with:
          toolchain: "1.97"
          targets: >-
            x86_64-unknown-linux-musl,
            aarch64-unknown-linux-musl,
            x86_64-pc-windows-gnu,
            aarch64-pc-windows-gnullvm
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.23.4

      # Either half failing is a verdict too: the comparison below then says the rebuild did not
      # complete, and the release does not claim to be reproducible.
      - name: Rebuild
        id: rebuild
        continue-on-error: true
        run: ./scripts/build-cross.sh rebuilt

      - name: Download what was published
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --dir published \
            --pattern 'permguard_*_Linux_*.tar.gz' --pattern 'permguard_*_Windows_*.zip'
          ./scripts/extract-shipped.sh published shipped

      - name: Compare
        if: always()
        env:
          REBUILT: ${{ steps.rebuild.outcome }}
          DOWNLOADED: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          if [ "${REBUILT}" != success ] || [ "${DOWNLOADED}" != success ]; then
            {
              printf 'independent rebuild of the Linux and Windows binaries, compared with what shipped\n'
              printf 'commit %s, tag %s\n\n' "${GITHUB_SHA}" "${GITHUB_REF_NAME}"
              printf 'the comparison did not run: rebuild %s, download of the published archives %s\n' \
                "${REBUILT}" "${DOWNLOADED}"
              printf 'reproducible: no — this release does not claim to be reproducible\n'
            } > reproducibility.txt
            echo 4 > reproducibility.status
            exit 0
          fi
          status=0
          ./scripts/compare-rebuild.sh shipped rebuilt reproducibility.txt || status=$?
          echo "${status}" > reproducibility.status

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility
          path: |
            reproducibility.txt
            reproducibility.status
          retention-days: 1
          if-no-files-found: error

  # Publishes the verdict. Separate from the rebuild because writing to the release needs a token
  # that may write, and a job that compiles must not hold one.
  publish-reproducibility:
    name: Publish the reproducibility verdict
    needs: [reproducible-rebuild]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducibility

      - name: Attach the verdict to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" reproducibility.txt --clobber
          {
            echo "## Reproducibility"
            echo
            echo '```'
            cat reproducibility.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # A mismatch is reported, never fatal: the release is published and its provenance holds.
          if [ "$(cat reproducibility.status)" != "0" ]; then
            echo "::warning title=Not reproducible::the independent rebuild did not confirm the published binaries; see reproducibility.txt on the release"
          fi

  # The iteration exit gate's evidence (WP-7.13): the serving gate's verdict and the traceability
  # report are attached, then every file the release carries is pinned by its SHA-256 to the tagged
  # commit in `evidence-manifest.json`, which names what the gate still lacks. The manifest is
  # attested, published and verified the way an auditor would, from the release alone. It compiles
  # nothing, so it may hold the token that signs. A gate that is incomplete fails this job after
  # the manifest is published: what is missing is said, never hidden.
  evidence:
    name: Pin the release's evidence
    needs:
      [verify, build, publish-benchmark, publish-drills, publish-fuzz, publish-reproducibility]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: verified
          path: verified
      - name: Attach the serving gate and the traceability report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -s verified/target/traceability.json ] && cp verified/target/traceability.json verified/
          for record in permguard-gate traceability; do
            if [ -s "verified/${record}.json" ]; then
              gh release upload "${GITHUB_REF_NAME}" "verified/${record}.json" --clobber
            else
              printf 'the %s of %s (%s) was not produced; see the workflow run %s\n' \
                "${record}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" \
                "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "${record}.txt"
              gh release upload "${GITHUB_REF_NAME}" "${record}.txt" --clobber
              echo "::warning title=No ${record} record::$(cat "${record}.txt")"
            fi
          done
      - name: The manifest of the release as published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --dir evidence
          rm -f evidence/evidence-manifest.json
          ./scripts/evidence-manifest.sh evidence "${GITHUB_REF_NAME}" "${GITHUB_SHA}" evidence-manifest.json
          cp evidence-manifest.json evidence/
      - name: Attest the manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: evidence-manifest.json
      - name: Publish and verify the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" evidence-manifest.json --clobber
          {
            echo "## Exit gate evidence"
            echo
            echo '```'
            jq '{tag, commit, complete, incomplete, artifacts: (.artifacts | length)}' evidence-manifest.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          ./scripts/verify-evidence.sh evidence "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
