name: Feature request
description: Something Permguard should be able to do and cannot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where it stops. Not the solution yet.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, if there is one. It is usually the best description of the gap.

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: |
        If it touches something automated against — a configuration key, a flag, an exit status, a
        metric — say which. Those are versioned interfaces, see COMPATIBILITY.md.
