# A conservative production baseline. Keep environment-specific values (image tag, storage class,
# allowed namespaces and sizing) in the deployment repository that owns the cluster.

# Only verified images start (TD-4): each Pod's `verify-image` init container checks the digest it
# runs against the release's signed SLSA provenance. The deployment repository fills in the
# verifier image and each component's digest — `controlPlane.digest`, `dataPlane.digest`, and
# `dataPlane.drainController.digest` when the controller is on — from the release's
# `provenance-images.txt`, and creates the token Secret. No published image passes the defaults yet:
# see `ops/container-verification.md` for the releases that can and the builder and tag they need.
imageVerification:
  enabled: true
  verifier:
    image: ""
  tokenSecret:
    name: permguard-image-verification

controlPlane:
  # TLS from a `kubernetes.io/tls` Secret the deployment repository creates (WP-2.11); or, behind an
  # ingress or a mesh sidecar that terminates TLS, `terminatedUpstream: true` instead.
  tls:
    secretName: permguard-control-plane-tls
  # One, and not a compromise: see the note beside `controlPlane.replicaCount` in values.yaml. The
  # budget below and a fast restart are what availability means here until the catalog lives in
  # something that arbitrates.
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  podDisruptionBudget:
    # `maxUnavailable: 0` on a single replica: voluntary disruption waits for a human, which is the
    # right trade for the component that holds the authority. One budget, named — nothing to unset.
    enabled: true
    budget: maxUnavailable
    value: 0
  autoscaling:
    enabled: false
  # What a control plane keeps is on a volume, and a volume is bound to a node.
  affinity: {}
  topologySpreadConstraints: []
  extraConfig:
    controlPlane:
      # The signing ring. Without it a control plane serves no NOTP and no decision routes at all
      # — fail-closed, by design — so a "production" install that leaves it out is three healthy
      # pods that no data plane can pull from and no producer can ship to. The directory is on the
      # volume below; the material itself is what a cluster's secret manager should place there,
      # and `autogenerate` stays off for exactly that reason.
      keys:
        enabled: "true"
        directory: "operations/keys"
      # The data plane groups below record every decision (`evidence.mode: required`, the
      # `production` floor) on their Host's stream and ship it to this Host over their
      # membership's `decisions.ship` task: nothing here names their keys. Their own material —
      # the Plane signing ring, the commitment secret and the pseudonymisation key — comes from
      # the overlay that owns the cluster's secrets, never from this file; a group missing it
      # refuses to start rather than answer unrecorded.

dataPlane:
  # TLS from a `kubernetes.io/tls` Secret, as the control plane (WP-2.11).
  tls:
    secretName: permguard-data-plane-tls
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  # One group serving every ledger. A deployment that splits its ledgers across groups lists one
  # entry per group, with disjoint selectors (TD-1).
  groups:
    - name: serving
      selector: plane/data/*
      replicas: 3
      # A replica answers only with recorded decisions (`required`, the `production` floor), so it
      # keeps its spool and its signing ring on a volume of its own, retained when the group scales
      # down. The decision log then needs material this chart cannot invent — the Plane signing
      # ring, the commitment secret, the pseudonymisation key, and the control plane it ships to —
      # which an overlay that owns the cluster's secrets supplies under `extraConfig` and mounted
      # Secrets. Without it the pod refuses to start rather than answer unrecorded.
      evidence: { mode: required }
      assurance: { profile: production }
      persistence:
        enabled: true
        size: 20Gi
      podDisruptionBudget:
        budget: minAvailable
        value: 2
      # Fixed replicas: autoscaling a group that keeps evidence waits for the drain controller and
      # the recovery Job (TD-2).
  # A replicated mirror needs policies to mirror, or it is three pods answering `deny` to
  # everything. Each replica follows the `policy.mirror` tasks of its membership, enrolled with the
  # control plane's Host (WP-7.7): every zone and ledger the task's signed selector covers.
  extraConfig:
    dataPlane:
      mirrors:
        enabled: "true"
        interval: "30s"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: permguard
              app.kubernetes.io/component: data-plane
              permguard.com/group: serving
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: permguard
          app.kubernetes.io/component: data-plane
          permguard.com/group: serving

persistence:
  # The control plane's catalog, key ring and audit store live here. Each data plane replica keeps
  # its own volume, from its group's claim template.
  enabled: true
  size: 20Gi

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    labels:
      prometheus: kube-prometheus
      role: alert-rules

networkPolicy:
  enabled: true
  public:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: default
  telemetry:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
