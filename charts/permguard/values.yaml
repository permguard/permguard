# What this chart deploys, and how.
#
# The defaults deploy the two planes separately, which is how they are meant to run: they scale for
# different reasons — the data plane with request volume, the control plane with administration — and
# a single deployment can only be sized for one of them. Set `allInOne.enabled` and turn the two off
# to run the single-process runtime instead, which is what a small installation or a test environment
# wants.

# Where the images come from — registry *and* namespace, because the two registries do not agree on
# the namespace: Docker Hub publishes `permguard/<name>`, while GHCR nests under the repository as
# `permguard/permguard/<name>`. Holding the whole prefix in one value is the point: a cluster that
# mirrors one of them overrides this one string, not four image names.
image:
  registry: docker.io/permguard
  # `ghcr.io/permguard/permguard` is the other one, digest for digest the same images.
  #
  # One caveat on Docker Hub: these names still carry the Go implementation, whose `latest` and `0.0`
  # tags were never moved. The release publishes versioned tags there and nothing else, so pin `tag`
  # (or leave it empty and let the chart's appVersion pin it) — never reach for `latest` here.
  pullPolicy: IfNotPresent
  # Empty means the chart's appVersion, so an upgrade of the chart is an upgrade of the product
  # unless something says otherwise.
  tag: ""
  pullSecrets: []

# Image verification at deploy (TD-4). On, every Permguard Pod starts with a `verify-image` init
# container that runs `gh attestation verify` on the exact digest the Pod runs: the GitHub artifact
# attestation, its Sigstore signature, its SLSA provenance, the builder workflow, the repository and
# the tag — the policy the release itself applies (`scripts/verify-provenance.sh`). An image that
# fails it never starts, so its Pod never becomes Ready.
#
# On, each enabled component names its image by digest (`controlPlane.digest`, `dataPlane.digest`,
# `allInOne.digest`, `dataPlane.drainController.digest`): a tag resolved later by the kubelet is not
# what was verified. A `regulated` workload refuses to render without it; `values-production.yaml`
# turns it on.
imageVerification:
  enabled: false
  # The source repository and the builder workflow the provenance must name.
  repository: permguard/permguard
  signerWorkflow: permguard/permguard/.github/workflows/release-build.yml
  # The ref the image was built from. Empty means `refs/tags/v<appVersion>`.
  sourceRef: ""
  verifier:
    # An image whose entrypoint is the GitHub CLI, by digest: `<registry>/<name>@sha256:<hex>`.
    # `docker/verifier/Dockerfile` builds one from the pinned `cli/cli` release.
    image: ""
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  # The token the attestation API is read with (any GitHub token; no scope is needed for a public
  # repository), from a Secret: never a value.
  tokenSecret:
    name: ""
    key: token

controlPlane:
  enabled: true
  repository: control-plane
  # The image's digest, `sha256:<hex>`: what `imageVerification` verifies and the Pod runs.
  digest: ""
  # One. A control plane's catalog, refs and key ring have a single maintaining process, so two
  # replicas either fight over one volume or diverge behind one Service — a zone created through
  # one pod missing from the other. `templates/checks.yaml` refuses more, rather than letting a
  # cluster discover it. Availability comes from a PodDisruptionBudget and a fast restart until the
  # catalog lives in something that arbitrates.
  replicaCount: 1
  # The serving floor of this Host, as for a data plane group: see `dataPlane.groupDefaults.assurance`.
  assurance:
    profile: production
    addedControls: []
    custody: {}
  # The plane's public surface and the Server Host operations surface. The latter serves process
  # discovery, health, readiness and metrics and must never be part of the public API.
  ports:
    http: 6443
    grpc: 6443
    telemetry: 5443
  # How the public listener is secured (WP-2.11). Outside `developmentMode` a public listener beyond
  # loopback serves TLS, or the deployment says an ingress or a mesh sidecar terminates TLS in front
  # of it; `templates/checks.yaml` refuses a values file that says neither, or both.
  #   secretName: a `kubernetes.io/tls` Secret, mounted at /etc/permguard-tls: HTTP and gRPC serve
  #     TLS with its `tls.crt` and `tls.key`, and the published URLs say `https`. A data plane the
  #     chart points at this control plane verifies it with its own Secret's `ca.crt`.
  #   terminatedUpstream: true renders `tls.terminated_upstream`: the listener serves in the clear
  #     behind what terminates TLS, published as `upstream_tls` and the relaxation
  #     `tls.terminated_upstream`, which the `regulated` profile refuses.
  tls:
    secretName: ""
    terminatedUpstream: false
  # The Server Host listener (WP-2.5): what operators, peer Hosts and memberships reach, mutual TLS
  # only. Off by default; a Host without it holds no membership, ships no evidence and issues no
  # drain receipt. `tls.secretName` is a `kubernetes.io/tls` Secret whose `tls.crt` and `tls.key`
  # the listener presents and whose `ca.crt` its clients' certificates are verified against;
  # `allow` names the operators' certificates, as `admin.allow` does (`cn:<name>`, `san:<uri>`).
  hostListener:
    enabled: false
    port: 5444
    tls:
      secretName: ""
    allow: []
  service:
    type: ClusterIP
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # No CPU limit on purpose: a limit throttles a process that is answering requests, and the
      # request above is what the scheduler needs. Memory is limited because a leak has to stop
      # somewhere.
      memory: 256Mi
  # A rollout that takes the last ready replica with it is a rollout with an outage in it.
  podDisruptionBudget:
    enabled: true
    # One budget: its name, and its number. `minAvailable` or `maxUnavailable` — a
    # PodDisruptionBudget takes one, so this says one, and an override that chooses the
    # other replaces a string rather than having to null a key out.
    budget: minAvailable
    value: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Anything else this deployment needs mounted, passed through verbatim. In practice: TLS
  # material. The configuration below names certificates and authorities by path, and these are how
  # a file gets to that path.
  #
  # extraVolumes:
  #   - name: tls
  #     secret:
  #       secretName: permguard-control-plane-tls
  # extraVolumeMounts:
  #   - name: tls
  #     mountPath: /etc/permguard/tls
  #     readOnly: true
  extraVolumes: []
  extraVolumeMounts: []

  # Extra configuration merged into the generated ConfigMap, so a value that has no field in this
  # file can still be set without forking the chart. This is where a control plane in a cluster says
  # where it keeps the decisions its data planes ship it:
  #
  #   extraConfig:
  #     controlPlane:
  #       decisions:
  #         enabled: "true"
  #         directory: "data/decisions/store"  # put it on a PersistentVolume: it is an audit store, not a cache
  #         retention: "90d"         # also the bound on how far behind a reader may fall
  #
  # and where it keeps the events they ship it — the only supported remote source for reading
  # events back, because a data plane's journal is a shipping buffer rather than an archive:
  #
  #   extraConfig:
  #     controlPlane:
  #       events:
  #         enabled: "true"
  #         directory: "data/events/store"     # a PersistentVolume, for the same reason
  #         retention: "90d"
  #         # no producer key file: events arrive over the Host's `events.ship`
  #     experimental:
  #       dogwood: { enabled: "true" }        # required alongside it, and refused if missing
  extraConfig: {}
  # Extra environment for the container, as a list of EnvVar.
  extraEnv: []

dataPlane:
  enabled: true
  repository: data-plane
  # The image's digest, `sha256:<hex>`: what `imageVerification` verifies and the Pod runs.
  digest: ""
  # The data plane is rendered as named groups (TD-1), not as one implicit global plane. Each group
  # has one membership selector and one operating policy, and each of its replicas is a distinct
  # Server: its own Host identity, its own volume. A group gets its own workload, Service,
  # NetworkPolicy, disruption budget, autoscaler and membership manifest, so two groups never route,
  # admit or scale each other's traffic.
  #
  #   groups:
  #     - name: billing                        # a DNS label; it names objects and labels pods only
  #       selector: plane/data/zone/billing/*  # the membership selector its replicas enroll under
  #       replicas: 3
  #     - name: people
  #       selector: plane/data/zone/people/*
  #       replicas: 2
  #       # `host.identity` in the KMS; `host.operations` in the token, since it signs while a
  #       # recorded decision waits and a remote KMS is not allowed there.
  #       assurance:
  #         profile: regulated
  #         custody:
  #           provider: pkcs11
  #           identity: kms
  #           pkcs11: { module: /usr/lib/softhsm/libsofthsm2.so, tokenLabel: permguard, pinRef: hsm-pin }
  #           kms: { address: "https://vault:8200", tokenRef: vault-token }
  #
  # What a group leaves out comes from `groupDefaults` below. The Plane-wide values in this section
  # (image, ports, TLS, resources, placement, `extraConfig`, `extraEnv`) are the static
  # configuration every group shares; a group's own `extraConfig` and `extraEnv` are layered on top.
  #
  # Empty `groups` renders one group, `default`, with selector `plane/data/*`. The keys of the older
  # single-group chart — `dataPlane.replicaCount`, `autoscaling`, `persistence`,
  # `podDisruptionBudget` and `service` — still describe that one group; beside a non-empty `groups` they would be
  # a second source of truth, and `templates/checks.yaml` refuses them.
  groups: []
  groupDefaults:
    replicas: 3
    # A group that keeps a volume autoscales only with the drain controller enabled, its storage
    # takeover qualified (`persistence.takeover`) and a scale-down stabilization of at least its
    # shutdown budget plus the drain Job's deadline (TD-2): removing a replica that keeps evidence
    # needs all three, and the chart refuses each missing one.
    autoscaling:
      enabled: false
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationSeconds: 1200
    service:
      enabled: true
      type: ClusterIP
      annotations: {}
    # `required` (a decision is answered only once its record is durable) or `disabled`, rendered as
    # the decision log's `mode`. `production` and `regulated` take `required` only: the decision-log
    # contract lets `production` relax it per ledger, with a recorded risk acceptance, never for a
    # whole group; `best-effort` is refused until its loss record is defined, as the server does.
    evidence:
      mode: required
    # A group with a volume is a StatefulSet: one claim per replica, from one template, retained
    # when the group scales down and when the release is deleted — deleting a claim that may hold
    # unshipped evidence is a separate, verified operation, never a side effect of `helm`.
    # `accessModes` empty means `ReadWriteOncePod` from `production` on Kubernetes 1.29 or later,
    # `ReadWriteOnce` otherwise; state them when the storage class does not offer the former.
    # `size` and `storageClass` empty take the chart-wide `persistence` values.
    persistence:
      enabled: true
      size: ""
      storageClass: ""
      accessModes: []
      retention:
        whenScaled: Retain
        whenDeleted: Retain
      # Evidence that this storage revokes a replica's old writer before attaching its successor,
      # which automatic failover and autoscaling need (TD-2): the CSI `driver`, the `storageClass`
      # and the `evidence` reference of the qualification — a node kill and a partition on that
      # driver and class, which `scripts/chart-takeover.sh` starts with its Pod kills and its
      # offline verification. The chart cannot check the evidence; it refuses only its absence.
      # A Kubernetes lease or an expired heartbeat alone is not fencing.
      takeover:
        qualified: false
        driver: ""
        storageClass: ""
        evidence: ""
    # The serving floor of every replica (`development`, `production`, `regulated`), rendered into
    # its Host configuration, checked at Bootstrap and published by discovery. `custody` says where
    # the Host's private keys are held: `provider` (`development`, `file`, `pkcs11`, `kms`), the
    # `identity` and `operations` rings when they differ, and the `pkcs11` (`module`, `tokenLabel`,
    # `pinRef`) or `kms` (`address`, `mount`, `tokenRef`, `ca`) references. `regulated` keeps
    # `host.identity` and `host.operations` in `pkcs11` or `kms`, and the chart refuses it otherwise.
    # Where decisions are recorded, `host.operations` stays out of a remote KMS: it signs while a
    # decision waits (TS-4).
    assurance:
      profile: production
      addedControls: []
      custody: {}
    podDisruptionBudget:
      enabled: true
      budget: maxUnavailable
      value: 1
    # One budget for a replica's shutdown. The `preStop` hook asks the server to drain, which then
    # has `timeoutSeconds` to stop: `drainTimeoutSeconds` of it to drain, at least one second left
    # to seal and release the volume. The grace period is `timeoutSeconds` plus five seconds.
    shutdown:
      timeoutSeconds: 30
      drainTimeoutSeconds: 25
    # The membership tasks its replicas are invited with, by type. Empty renders `policy.mirror`,
    # `decisions.ship` when evidence is recorded and `events.ship` when the group keeps temporal
    # history, each on the group's selector. An entry of one of those types narrows it
    # (`selector`, `resourceTypes`, `required`, `limits`, `assuranceRequirements`, `taskId`); an
    # entry of another membership type adds it.
    tasks: []
    # Who may reach the group: `public.from` and `telemetry.from` as under `networkPolicy`, which
    # they replace for this group when set.
    networkPolicy: {}
  ports:
    http: 7443
    grpc: 7443
    # Pods have independent network namespaces, so every Server Host uses the canonical port.
    telemetry: 5443
  # How the public listener is secured (WP-2.11). Outside `developmentMode` a public listener beyond
  # loopback serves TLS, or the deployment says an ingress or a mesh sidecar terminates TLS in front
  # of it; `templates/checks.yaml` refuses a values file that says neither, or both.
  #   secretName: a `kubernetes.io/tls` Secret, mounted at /etc/permguard-tls: HTTP and gRPC serve
  #     TLS with its `tls.crt` and `tls.key`, and the published URLs say `https`. A data plane the
  #     chart points at this control plane verifies it with its own Secret's `ca.crt`.
  #   terminatedUpstream: true renders `tls.terminated_upstream`: the listener serves in the clear
  #     behind what terminates TLS, published as `upstream_tls` and the relaxation
  #     `tls.terminated_upstream`, which the `regulated` profile refuses.
  tls:
    secretName: ""
    terminatedUpstream: false
  # The Server Host listener (WP-2.5): what operators, peer Hosts and memberships reach, mutual TLS
  # only. Off by default, and shared by every group; a Host without it holds no membership, ships no evidence and issues no
  # drain receipt. `tls.secretName` is a `kubernetes.io/tls` Secret whose `tls.crt` and `tls.key`
  # the listener presents and whose `ca.crt` its clients' certificates are verified against;
  # `allow` names the operators' certificates, as `admin.allow` does (`cn:<name>`, `san:<uri>`).
  hostListener:
    enabled: false
    port: 5444
    tls:
      secretName: ""
    allow: []
  # The drain controller (TD-2): a CronJob per group that keeps a volume, running
  # `permguard reclaim run` with the CLI image. A retained claim of an ordinal above the replicas
  # gets a fenced drain Job on its own claim; the claim is deleted only when that Job prints a drain
  # receipt that verifies under the member's pin the coordinator holds and the coordinator's
  # frontier acknowledges every stream it names. A Job that fails or reaches `jobDeadlineSeconds`
  # (a forced timeout) never authorizes it. Needs the data plane's Host listener, the coordinator's
  # (`coordinator`, or this release's control plane Host listener when empty) and `tls.secretName`,
  # a `kubernetes.io/tls` Secret holding the client certificate of an operator granted
  # `membership.read` and `streams.read` there, and the authority (`ca.crt`) to verify it against.
  # A record no required subscription acknowledges keeps the claim: decisions recorded before the
  # replica enrolled, and events of a group whose memberships have no `events.ship` task, whose
  # temporal history is then kept on the claim rather than reclaimed.
  # One coordinator: a stream another coordinator acknowledges keeps its claim. A succeeded Job
  # whose proof is missing (no receipt, no membership) keeps its claim too, and stays until an
  # operator deletes it; the next pass then runs a new one.
  drainController:
    enabled: false
    schedule: "*/5 * * * *"
    repository: cli
    # The CLI image's digest, under `imageVerification`.
    digest: ""
    coordinator: ""
    tls:
      secretName: ""
    jobDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Placement, for every group unless a group states its own.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # Anything else this deployment needs mounted, passed through verbatim. See the note under
  # `controlPlane.extraVolumes`.
  extraVolumes: []
  extraVolumeMounts: []
  # Extra configuration merged into the generated ConfigMap. This is where a data plane in a cluster
  # says where its policies come from: mirroring lives under `dataPlane.mirrors`, and the URL alone means
  # every zone and every ledger that control plane lists. Patterns narrow it; per-server `tls` carries
  # the authority (and, for mutual TLS, our own certificate) out of a mounted Secret.
  #
  # extraConfig:
  #   dataPlane:
  #     mirrors:
  #       enabled: "true"
  #       interval: "30s"        # how often a round STARTS; an overlapping tick is skipped
  #       timeout: "2m"          # per ledger
  #       parallelism: "4"
  #       jitter: "0.1"          # so replicas do not all wake on the same second
  #       servers:
  #         - url: "https://permguard-control-plane:6443"
  #           zones: ["acme-.*"]                   # absent: every zone the server lists
  #           ledgers: ["main-ledger"]             # absent: every ledger of a matching zone
  #           tls:
  #             ca_file: tls/control-plane-ca.pem  # from a Secret mounted on the volume
  #     decisions:
  #       cache:
  #         partitions: "64"   # compiled partitions held in memory at once
  #         bytes: "256M"      # what they may weigh, against this pod's memory limit
  #       max_evaluations: "256"
  #       # Every decision, recorded on the Host's stream, named by its `host_id` and run. Whether
  #       # the log is on, and its `mode`, come from each group's `evidence.mode`: stating them here
  #       # as well is refused.
  #       log:
  #         server:
  #           url: "grpcs://permguard-control-plane:6443"
  #           tls:
  #             ca_file: tls/control-plane-ca.pem
  #             cert: tls/decision-log-client.pem   # its own identity, not the mirror's
  #             key: tls/decision-log-client.key
  #         spool:
  #           directory: "data/decisions/spool"  # on a persistent volume: it is the copy that survives a restart
  #           bytes: "512M"             # decision records only; the terminal record is reserved apart
  #           age: "24h"
  #         batch: { bytes: "256k", interval: "1s" }
  #         sample: { permits: "1.0" }
  #         commitment:
  #           key_ref: decision-commitment   # required: a commitment keyed by anything public is
  #           key_version: "v1"              # a bare digest of a low-entropy caller attribute
  #         include:
  #           subject_properties: []    # an allow-list, never "all"
  #           resource_properties: []
  #           context: []
  extraConfig: {}
  extraEnv: []

allInOne:
  enabled: false
  repository: all-in-one
  # The image's digest, `sha256:<hex>`: what `imageVerification` verifies and the Pod runs.
  digest: ""
  replicaCount: 1
  # The serving floor of this Host: see `dataPlane.groupDefaults.assurance`.
  assurance:
    profile: production
    addedControls: []
    custody: {}
  ports:
    controlHttp: 6443
    dataHttp: 7443
    telemetry: 5443
  # How the public listener is secured (WP-2.11). Outside `developmentMode` a public listener beyond
  # loopback serves TLS, or the deployment says an ingress or a mesh sidecar terminates TLS in front
  # of it; `templates/checks.yaml` refuses a values file that says neither, or both.
  #   secretName: a `kubernetes.io/tls` Secret, mounted at /etc/permguard-tls: both Planes, HTTP and gRPC, serve
  #     TLS with its `tls.crt` and `tls.key`.
  #   terminatedUpstream: true renders `tls.terminated_upstream`: the listener serves in the clear
  #     behind what terminates TLS, published as `upstream_tls` and the relaxation
  #     `tls.terminated_upstream`, which the `regulated` profile refuses.
  tls:
    secretName: ""
    terminatedUpstream: false
  # The Server Host listener (WP-2.5): what operators, peer Hosts and memberships reach, mutual TLS
  # only. Off by default; a Host without it holds no membership, ships no evidence and issues no
  # drain receipt. `tls.secretName` is a `kubernetes.io/tls` Secret whose `tls.crt` and `tls.key`
  # the listener presents and whose `ca.crt` its clients' certificates are verified against;
  # `allow` names the operators' certificates, as `admin.allow` does (`cn:<name>`, `san:<uri>`).
  hostListener:
    enabled: false
    port: 5444
    tls:
      secretName: ""
    allow: []
  service:
    type: ClusterIP
    annotations: {}
  # Anything else this deployment needs mounted, passed through verbatim. See the note under
  # `controlPlane.extraVolumes`.
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      memory: 384Mi
  # Extra configuration merged into the generated ConfigMap. An all-in-one that runs at the edge and
  # follows a control plane elsewhere states it the same way — under `dataPlane.mirrors`, exactly as a
  # standalone data plane does. One hosting both planes itself has nothing to mirror.
  #
  # extraConfig:
  #   dataPlane:
  #     mirrors:
  #       enabled: "true"
  #       servers:
  #         - url: "https://control.acme.com"   # the URL alone: everything it lists
  extraConfig: {}
  extraEnv: []

# What every pod gets, and what it is not allowed to do. These are the defaults because the images
# were built for them: a static binary from `scratch`, running as 65532, needing nothing writable
# except the state directory.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

# Where the control plane and the all-in-one keep generated keys and their audit trail. Data plane
# groups state their own storage under `dataPlane.groupDefaults.persistence`, and take `size` and
# `storageClass` from here when they leave them empty.
#
# `emptyDir` by default, and that is a real decision rather than a placeholder: with `autogenerate`
# on, a pod that loses this directory mints itself a new signing key on restart, which is fine for a
# test environment and wrong for anything issuing tokens somebody else verifies.
persistence:
  # The default for the control plane and the all-in-one; each may override it with its own
  # `persistence: { enabled: … }`.
  enabled: false
  # A StatefulSet with a claim template instead of one PersistentVolumeClaim, for the control
  # plane. Switching it on an existing release changes the workload kind, and Kubernetes does not
  # convert a Deployment into a StatefulSet: the old workload has to be deleted first. That is why
  # it is opted into rather than deduced.
  perReplica: false
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 1Gi

# Liveness and readiness answer different questions, so they are configured separately. Readiness
# goes false at the first instant of shutdown, before anything is closed, which is what lets a
# service stop routing to a pod that is still finishing what it has.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  startup:
    enabled: true
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30

# Prometheus. `annotations` works with any scraper that reads them; `serviceMonitor` is for the
# Prometheus Operator, and needs its CRD to be installed.
metrics:
  annotations: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  # Prometheus Operator alert rules. Disabled by default because the CRD belongs to the cluster's
  # monitoring stack, not to this chart.
  prometheusRule:
    enabled: false
    labels: {}
    mirror:
      staleSeconds: 900
      staleFor: 5m
    decisionLog:
      backlogRecords: 1000
      backlogFor: 10m
    tls:
      certificateExpiryDays: 30
      crlExpiryDays: 7

logging:
  level: info
  # `json`, because a cluster's logs are read by a collector before they are read by a person.
  format: json

# Development mode and autogeneration. Both default to what a cluster should have: off.
#
# `autogenerate` on means a plane will mint its own certificate authority and signing keys when it
# finds none. That is exactly right on a laptop and exactly wrong in a cluster, where the material
# should come from something that manages it.
developmentMode: false
autogenerate: false

# Who may reach a plane, and — for the control plane — who may administer it.
#
# There is no separate administrative surface: creating a zone, deleting a ledger, pushing a policy
# version and reading the decision log are answered on the public endpoint, beside the reads. So
# `public.from` is not only a reachability control, it is the administration boundary. Narrow it to
# the namespaces that hold your PEPs and your delivery pipeline, and terminate mutual TLS in front
# of it if the cluster is not trusted. `docs/operations/administrative-surface.md` says what this
# does and does not protect.
#
# The ports a pod serves are the only ones it accepts, once any NetworkPolicy selects it. On by
# default: the policy always closes what is not served, and `from` decides who may reach what is.
# Each `from` is a list of NetworkPolicyPeer (namespaceSelector / podSelector / ipBlock), passed
# through as written; an empty list means any peer — a PDP usually serves the whole cluster, and
# telemetry is scraped from a namespace this chart cannot guess. Narrow them where the cluster
# knows better:
#
#   networkPolicy:
#     telemetry:
#       from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: monitoring
#
# Ingress only: the data plane dials out (the control plane it mirrors, the decision log, DNS),
# and an egress list maintained here would either break that or allow everything.
networkPolicy:
  enabled: true
  public:
    from: []
  telemetry:
    from: []
  # The Host listener's peers: operators, peer Hosts and the drain controller.
  host:
    from: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

commonLabels: {}
commonAnnotations: {}
