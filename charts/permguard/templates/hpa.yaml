{{- range $component, $plane := dict "control-plane" .Values.controlPlane "data-plane" .Values.dataPlane }}
{{- if and $plane.enabled $plane.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "permguard.fullname" $ }}-{{ $component }}
  labels:
    {{- include "permguard.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    # The kind the component is actually deployed as. Hardcoding `Deployment` produced an
    # autoscaler pointing at a resource that does not exist as soon as a component became a
    # StatefulSet — silently, because a dangling `scaleTargetRef` is not a render error.
    kind: {{ include "permguard.workloadKind" (dict "root" $ "plane" $plane) }}
    name: {{ include "permguard.fullname" $ }}-{{ $component }}
  minReplicas: {{ $plane.autoscaling.minReplicas }}
  maxReplicas: {{ $plane.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $plane.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
