{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "permguard.serviceAccountName" . }}
  labels:
    {{- include "permguard.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing here talks to the Kubernetes API, so no pod needs a token for it. Mounting one anyway is
# a credential in a container for no reason.
automountServiceAccountToken: false
{{- end }}
