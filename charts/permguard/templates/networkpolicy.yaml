{{/*
One NetworkPolicy per running component, default-on.

What it always does is close every port the pod does not serve: selected pods
accept ingress only on the public ports and the telemetry port. What the values
decide is who may reach the two surfaces — `public.from` and `telemetry.from`
are lists of NetworkPolicyPeer, and an empty list means any peer, because a PDP
usually serves the whole cluster and a telemetry port is scraped from a
namespace this chart cannot guess. Narrowing them is one values entry, not a
forked template.

Ingress only, deliberately: the data plane dials out — the control plane it
mirrors, the decision log, DNS — and an egress list maintained here would either
break those or grow into an allow-everything.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $components := dict }}
{{- if .Values.controlPlane.enabled }}
{{- $_ := set $components "control-plane" (list .Values.controlPlane.ports.http .Values.controlPlane.ports.grpc .Values.controlPlane.ports.telemetry) }}
{{- end }}
{{- if .Values.dataPlane.enabled }}
{{- $_ := set $components "data-plane" (list .Values.dataPlane.ports.http .Values.dataPlane.ports.grpc .Values.dataPlane.ports.telemetry) }}
{{- end }}
{{- if .Values.allInOne.enabled }}
{{- $_ := set $components "all-in-one" (list .Values.allInOne.ports.controlHttp .Values.allInOne.ports.dataHttp .Values.allInOne.ports.telemetry) }}
{{- end }}
{{- range $component, $ports := $components }}
{{- $telemetry := last $ports }}
{{- $public := initial $ports | uniq }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "permguard.fullname" $ }}-{{ $component }}
  labels:
    {{- include "permguard.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "permguard.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        {{- range $public }}
        - port: {{ int . }}
          protocol: TCP
        {{- end }}
      {{- with $.Values.networkPolicy.public.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: {{ int $telemetry }}
          protocol: TCP
      {{- with $.Values.networkPolicy.telemetry.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- end }}
