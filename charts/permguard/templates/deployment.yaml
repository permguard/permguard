{{- range $component, $plane := dict "control-plane" .Values.controlPlane }}
{{- if $plane.enabled }}
{{- $perReplica := include "permguard.perReplica" (dict "root" $ "plane" $plane) }}
apiVersion: apps/v1
kind: {{ include "permguard.workloadKind" (dict "root" $ "plane" $plane) }}
metadata:
  name: {{ include "permguard.fullname" $ }}-{{ $component }}
  labels:
    {{- include "permguard.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $plane.autoscaling.enabled }}
  replicas: {{ $plane.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "permguard.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  {{- if $perReplica }}
  # The headless Service that gives each pod its own DNS name. A StatefulSet requires one, and the
  # name is what a peer — or an operator reading a log — uses to reach the replica that owns a
  # particular persistent journal rather than whichever pod a load balancer picks.
  serviceName: {{ include "permguard.fullname" $ }}-{{ $component }}-headless
  # One at a time, highest ordinal first, and each pod's own volume goes with it. `maxSurge` has no
  # meaning here: a replacement cannot start beside the pod it replaces, because there is one claim
  # and one writer of it.
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "permguard.componentLabels" (dict "root" $ "component" $component) | nindent 8 }}
      annotations:
        # The configuration's own hash, so a ConfigMap change rolls the pods. Without it, editing
        # configuration changes nothing until something unrelated happens to restart them.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- include "permguard.metricsAnnotations" (dict "root" $ "telemetryPort" $plane.ports.telemetry) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "permguard.serviceAccountName" $ }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      # Long enough for readiness to go false, the load balancer to notice, and connections in
      # flight to finish. The process drains on SIGTERM; this is the time it is given to.
      terminationGracePeriodSeconds: 30
      {{- if include "permguard.persists" (dict "root" $ "plane" $plane) }}
      # The orchestrator's claim (WP-1.4), moved forward before every Pod's server opens the
      # volume, as for a data plane group: from `production` a volume is served only under one.
      initContainers:
        - name: claim
          image: {{ include "permguard.image" (dict "root" $ "repository" $plane.repository) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["volume", "claim", "--volume", "/var/lib/permguard/volume", "--next", "--create"]
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $plane.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/permguard
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "permguard.image" (dict "root" $ "repository" $plane.repository) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["/etc/permguard/config.yml"]
          # The decision and event streams are named by the Host's `host_id` and run (WP-6.1,
          # WP-6.2): no producer name comes from the pod any more.
          env:
            # The Host's volume is a directory inside the mount, which the server can own and keep
            # private: a mounted volume's root belongs to root (TD-1, TD-2).
            - name: PERMGUARD_WORKING_DIR
              value: /var/lib/permguard/volume
            {{- with $plane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $plane.ports.http }}
              protocol: TCP
            {{- if ne (int $plane.ports.grpc) (int $plane.ports.http) }}
            - name: grpc
              containerPort: {{ $plane.ports.grpc }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: {{ $plane.ports.telemetry }}
              protocol: TCP
            {{- if $plane.hostListener.enabled }}
            - name: host
              containerPort: {{ $plane.hostListener.port }}
              protocol: TCP
            {{- end }}
          {{- include "permguard.probes" (dict "root" $) | nindent 10 }}
          resources:
            {{- toYaml $plane.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/permguard
              readOnly: true
            - name: state
              mountPath: /var/lib/permguard
            # The root filesystem is read-only, so anything that wants a temporary file needs this.
            - name: tmp
              mountPath: /tmp
            {{- if $plane.tls.secretName }}
            - name: public-tls
              mountPath: /etc/permguard-tls
              readOnly: true
            {{- end }}
            {{- if $plane.hostListener.enabled }}
            - name: host-tls
              mountPath: /etc/permguard-host-tls
              readOnly: true
            {{- end }}
            {{- with $plane.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "permguard.fullname" $ }}-{{ $component }}
        - name: tmp
          emptyDir: {}
        {{- if not $perReplica }}
        - name: state
        {{- if include "permguard.persists" (dict "root" $ "plane" $plane) }}
          persistentVolumeClaim:
            claimName: {{ include "permguard.fullname" $ }}-{{ $component }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- /*
        Whatever else this deployment needs mounted — and in practice that means TLS material.
        The configuration talks about certificates and authorities read from files, and the chart
        used to offer no way to put a file there: an operator wanting mutual TLS had to fork the
        chart or run a post-renderer to add a Secret volume. Two passthrough lists cost nothing and
        remove that, and they stay generic on purpose — a `tls.existingSecret` shortcut would have
        to guess key names, mount paths and which of several files a given deployment uses.
        */ -}}
        {{- if $plane.tls.secretName }}
        - name: public-tls
          secret:
            secretName: {{ $plane.tls.secretName }}
        {{- end }}
        {{- if $plane.hostListener.enabled }}
        - name: host-tls
          secret:
            secretName: {{ $plane.hostListener.tls.secretName }}
        {{- end }}
        {{- with $plane.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $plane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $plane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $plane.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if $plane.affinity }}
        {{- toYaml $plane.affinity | nindent 8 }}
        {{- else }}
        # Spread replicas across nodes when the cluster can, rather than requiring it: a
        # single-node cluster should still be able to run this chart.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "permguard.selectorLabels" (dict "root" $ "component" $component) | nindent 20 }}
        {{- end }}
  {{- if $perReplica }}
  # One claim per replica, named after the pod that owns it and kept when that pod is rescheduled.
  # This is the whole reason for the StatefulSet: a journal has one producer and one writer, so a
  # replica that came back to somebody else's volume — or to an empty one — would either fork that
  # producer or lose its audit continuity. Multiple temporal replicas remain refused because one
  # volume each solves writer identity, not synchronous history visibility.
  #
  # Deliberately not deleted with the release: a journal is an audit trail, and a chart uninstall is
  # not an instruction to destroy one.
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          {{- include "permguard.componentLabels" (dict "root" $ "component" $component) | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $.Values.persistence.accessModes | nindent 10 }}
        {{- with $.Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.persistence.size }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- if .Values.allInOne.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "permguard.fullname" . }}-all-in-one
  labels:
    {{- include "permguard.componentLabels" (dict "root" . "component" "all-in-one") | nindent 4 }}
spec:
  replicas: {{ .Values.allInOne.replicaCount }}
  selector:
    matchLabels:
      {{- include "permguard.selectorLabels" (dict "root" . "component" "all-in-one") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "permguard.componentLabels" (dict "root" . "component" "all-in-one") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "permguard.metricsAnnotations" (dict "root" . "telemetryPort" .Values.allInOne.ports.telemetry) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "permguard.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- if include "permguard.persists" (dict "root" . "plane" .Values.allInOne) }}
      # The orchestrator's claim (WP-1.4), moved forward before every Pod's server opens the volume.
      initContainers:
        - name: claim
          image: {{ include "permguard.image" (dict "root" . "repository" .Values.allInOne.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["volume", "claim", "--volume", "/var/lib/permguard/volume", "--next", "--create"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.allInOne.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/permguard
      {{- end }}
      containers:
        - name: all-in-one
          image: {{ include "permguard.image" (dict "root" . "repository" .Values.allInOne.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["/etc/permguard/config.yml"]
          env:
            # The Host's volume is a directory inside the mount, as for the standalone planes.
            - name: PERMGUARD_WORKING_DIR
              value: /var/lib/permguard/volume
            - name: PERMGUARD_RUNTIME_PLANES
              value: "control,data"
            {{- with .Values.allInOne.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: control-http
              containerPort: {{ .Values.allInOne.ports.controlHttp }}
            - name: data-http
              containerPort: {{ .Values.allInOne.ports.dataHttp }}
            - name: telemetry
              containerPort: {{ .Values.allInOne.ports.telemetry }}
            {{- if .Values.allInOne.hostListener.enabled }}
            - name: host
              containerPort: {{ .Values.allInOne.hostListener.port }}
            {{- end }}
          {{- include "permguard.probes" (dict "root" .) | nindent 10 }}
          resources:
            {{- toYaml .Values.allInOne.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/permguard
              readOnly: true
            - name: state
              mountPath: /var/lib/permguard
            - name: tmp
              mountPath: /tmp
            {{- if .Values.allInOne.tls.secretName }}
            - name: public-tls
              mountPath: /etc/permguard-tls
              readOnly: true
            {{- end }}
            {{- if .Values.allInOne.hostListener.enabled }}
            - name: host-tls
              mountPath: /etc/permguard-host-tls
              readOnly: true
            {{- end }}
            {{- with .Values.allInOne.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "permguard.fullname" . }}-all-in-one
        - name: tmp
          emptyDir: {}
        - name: state
        {{- if include "permguard.persists" (dict "root" . "plane" .Values.allInOne) }}
          persistentVolumeClaim:
            claimName: {{ include "permguard.fullname" . }}-all-in-one
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if .Values.allInOne.tls.secretName }}
        - name: public-tls
          secret:
            secretName: {{ .Values.allInOne.tls.secretName }}
        {{- end }}
        {{- if .Values.allInOne.hostListener.enabled }}
        - name: host-tls
          secret:
            secretName: {{ .Values.allInOne.hostListener.tls.secretName }}
        {{- end }}
        {{- with .Values.allInOne.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
