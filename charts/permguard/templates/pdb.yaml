{{- range $component, $plane := dict "control-plane" .Values.controlPlane "data-plane" .Values.dataPlane }}
{{- if and $plane.enabled $plane.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "permguard.fullname" $ }}-{{ $component }}
  labels:
    {{- include "permguard.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  {{- /*
  Exactly one budget, and the values file can only say one — which is not the same as being
  told off for saying two.
  #
  It used to be two optional keys with a `fail` when both were set, and a values file that chose
  `maxUnavailable` had to write `minAvailable: null` to take the chart default's back. `helm
  template` honours that null and drops the key; `helm lint` does not, so the very same files
  rendered correctly and linted as a mistake nobody had made. A check that disagrees with the
  render is worse than no check: an operator reads `fail` and goes looking.
  #
  So the choice is a name and a number. There is no way to write both, nothing to null out, and
  nothing left to check beyond "is that a budget Kubernetes has".
  */ -}}
  {{- $budget := $plane.podDisruptionBudget }}
  {{- $kind := $budget.budget | default "" }}
  {{- if not (has $kind (list "minAvailable" "maxUnavailable")) }}
  {{- fail (printf "%s.podDisruptionBudget.budget is %q: write minAvailable or maxUnavailable" $component $kind) }}
  {{- end }}
  {{- if kindIs "invalid" $budget.value }}
  {{- fail (printf "%s.podDisruptionBudget.budget is %s and sets no value" $component $kind) }}
  {{- end }}
  {{ $kind }}: {{ $budget.value }}
  selector:
    matchLabels:
      {{- include "permguard.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
---
{{- end }}
{{- end }}
