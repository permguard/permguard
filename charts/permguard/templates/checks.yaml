{{- /*
Shapes this chart refuses to deploy.

The all-in-one runtime IS a control plane and a data plane in one process: running it beside either
standalone plane is not a bigger deployment, it is two deployments fighting over one identity — two
key rings both claiming to be the issuer, two catalogs diverging on one volume layout, and a caller
with no way to know which control plane answered. Whichever shape is wanted, it is one or the other,
and a values file that asks for both is a mistake this chart reports at template time — not one a
cluster discovers in production.

This file renders nothing; it exists to be able to say no.
*/ -}}
{{- if and .Values.allInOne.enabled (or .Values.controlPlane.enabled .Values.dataPlane.enabled) }}
{{- fail (printf "allInOne.enabled=true cannot be combined with controlPlane.enabled=%v / dataPlane.enabled=%v: the all-in-one IS both planes in one process. Deploy either the all-in-one (--set allInOne.enabled=true --set controlPlane.enabled=false --set dataPlane.enabled=false) or the standalone planes, never both." .Values.controlPlane.enabled .Values.dataPlane.enabled) }}
{{- end }}
{{- if not (or .Values.allInOne.enabled .Values.controlPlane.enabled .Values.dataPlane.enabled) }}
{{- fail "nothing is enabled: this values file deploys no plane at all. Enable the two standalone planes (the default), one of them, or the all-in-one — an install that installs nothing is a mistake, not a choice." }}
{{- end }}

{{- /*
Replicas of something that holds authority.

A control plane's catalog, its refs and its key ring are guarded by mutexes local to a process.
`permguard-std`'s catalog says it outright — "this store has one maintaining process, and a
deployment that wants replicas points them at a catalog backed by something that arbitrates" — and
no volume layout changes that:

  * one shared PersistentVolumeClaim (what this chart creates) means two processes writing one
    catalog: lost updates, collisions rotating keys, corruption no restart repairs;
  * `emptyDir` means two processes with two *different* catalogs behind one Service, so a zone
    created through one pod is missing when the next request lands on the other.

The second is the quieter mistake, and it is why this refuses replicas rather than refusing shared
storage. Until a control plane can elect a leader or keep its catalog in something that arbitrates,
it is one replica — and an all-in-one IS a control plane.

A data plane holds no authority: it mirrors a ledger and answers from it, and each replica of a
group keeps its own volume (`templates/data-plane-groups.yaml`), so its groups may be replicated.
*/ -}}
{{- $authority := "a control plane's catalog, refs and key ring have one maintaining process: replicas either fight over one volume or diverge behind one Service. Keep it at 1 until the state lives in something that arbitrates." }}
{{- range $component, $plane := dict "controlPlane" .Values.controlPlane "allInOne" .Values.allInOne }}
{{- if $plane.enabled }}
{{- if gt (int $plane.replicaCount) 1 }}
{{- fail (printf "%s.replicaCount=%v: %s" $component $plane.replicaCount $authority) }}
{{- end }}
{{- if and $plane.autoscaling $plane.autoscaling.enabled (gt (int $plane.autoscaling.maxReplicas) 1) }}
{{- fail (printf "%s.autoscaling scales to %v replicas: %s" $component $plane.autoscaling.maxReplicas $authority) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
`perReplica` without anything to keep per replica is a values file that says something it does not
mean (data plane groups keep a volume per replica whenever they keep one, so it is the control
plane's switch), and the workload it produces — a StatefulSet whose pods share nothing — is not what the person
who set it was asking for.
*/ -}}
{{- if .Values.persistence.perReplica }}
{{- $keeps := false }}
{{- range $component, $plane := dict "control-plane" .Values.controlPlane "all-in-one" .Values.allInOne }}
{{- if and $plane.enabled (include "permguard.persists" (dict "root" $ "plane" $plane)) }}
{{- $keeps = true }}
{{- end }}
{{- end }}
{{- if not $keeps }}
{{- fail "persistence.perReplica=true and no enabled component keeps a volume: there is nothing to give each replica. Enable persistence — globally, or on the component that needs it — or drop perReplica" }}
{{- end }}
{{- end }}

{{- /*
The producer names a deployment can no longer set.

The decision and event streams are named by the Host's `host_id` and the run of its stream (WP-6.1,
WP-6.2), and the server refuses to start where `decisions.log.pdp_id` or `events.producer_id` is
still set, in a file or in the environment. Refused here too, so a values file naming one fails at
install rather than at the pod's first start.
*/ -}}
{{- range $plane := (include "permguard.configUnits" $ | fromJson).units }}
{{- $component := $plane.label }}
{{- if $plane.enabled }}
{{- $config := $plane.extraConfig | default dict }}
{{- if or (dig "dataPlane" "decisions" "log" "pdp_id" "" $config) (dig "decisions" "log" "pdp_id" "" $config) }}
{{- fail (printf "%s.extraConfig sets the decision log's pdp_id, which is retired: decision records are named by the Host's host_id and the run of its stream. Remove it." $component) }}
{{- end }}
{{- if or (dig "dataPlane" "events" "producer_id" "" $config) (dig "events" "producer_id" "" $config) }}
{{- fail (printf "%s.extraConfig sets the event producer_id, which is retired: event records are named by the Host's host_id and the run of its stream. Remove it." $component) }}
{{- end }}
{{- range $env := ($plane.extraEnv | default list) }}
{{- if has $env.name (list "PERMGUARD_DECISIONS_LOG_PDP_ID" "PERMGUARD_EVENTS_PRODUCER_ID") }}
{{- fail (printf "%s.extraEnv sets %s, which is retired: the streams are named by the Host's host_id and run. Remove it." $component $env.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
A decision log on storage that does not survive a restart.

The log is signed by a ring the data plane keeps beside its spool. On an ephemeral volume both are
gone at the next restart: the pod mints a new ring, the control plane holds the old producer's
published keys, and every batch it ships is refused — the audit stream ends where the pod did. It is
the failure that looks like nothing at all until somebody reads the trail.

The chart cannot check that a ring, a commitment secret and a pseudonymisation key were supplied —
they arrive as secrets it never sees — but it can refuse the one combination that is wrong however
they arrive.
*/ -}}
{{- range $plane := (include "permguard.configUnits" $ | fromJson).units }}
{{- if ne $plane.kind "controlPlane" }}
{{- $component := $plane.label }}
{{- if $plane.enabled }}
{{- $log := dig "dataPlane" "decisions" "log" "enabled" "" ($plane.extraConfig | default dict) }}
{{- if and $log (ne (toString $log) "false") }}
{{- if not $plane.persists }}
{{- fail (printf "%s enables the decision log with ephemeral state: the signing ring and the spool live on the volume, and a restart mints a new ring whose batches the control plane will refuse. Set %s.persistence.enabled=true." $component $component) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
The temporal interface on storage that does not survive a restart.

Sharper than the decision log's version of this check, and for a reason worth stating. A decision
spool on an ephemeral volume loses evidence. An event journal on one loses *the history the plane's
own policies decide against* — so after a restart the same request gets a different answer, with
nothing in the request, the ledger or the logs to explain why. The journal is not a buffer that can
be re-derived; it is an input.

The chart cannot check that a signing ring was supplied, but it can refuse the one combination that
is wrong however the rest arrives.
*/ -}}
{{- range $plane := (include "permguard.configUnits" $ | fromJson).units }}
{{- if ne $plane.kind "controlPlane" }}
{{- $component := $plane.label }}
{{- if $plane.enabled }}
{{- $events := dig "dataPlane" "events" "enabled" (dig "events" "enabled" "" ($plane.extraConfig | default dict)) ($plane.extraConfig | default dict) }}
{{- if and $events (ne (toString $events) "false") }}
{{- if not $plane.persists }}
{{- fail (printf "%s enables the temporal interface with ephemeral state: the event journal is the history its own policies decide against, and a restart would silently change what they answer. Set %s.persistence.enabled=true." $component $component) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
A shared consistency mode with nothing to read from.

`shared-eventual` and `shared-bounded` decide against history other planes recorded. A plane in one
of those modes with no subscriptions ranges over an empty imported history — `shared-bounded` fails
every decision closed, and `shared-eventual` quietly answers as though the other planes had never
recorded anything. Both are configuration mistakes that look like a working deployment.
*/ -}}
{{- range $plane := (include "permguard.configUnits" $ | fromJson).units }}
{{- if ne $plane.kind "controlPlane" }}
{{- $component := $plane.label }}
{{- if $plane.enabled }}
{{- $pull := dig "dataPlane" "events" "pull" (dig "events" "pull" dict ($plane.extraConfig | default dict)) ($plane.extraConfig | default dict) }}
{{- $mode := toString (dig "mode" "local" ($pull | default dict)) }}
{{- if and (ne $mode "local") (not (dig "ledgers" list ($pull | default dict))) }}
{{- fail (printf "%s sets events.pull.mode=%q and subscribes to no ledgers: a shared mode decides against history other planes recorded, and this one has been told to read none of it. Name the ledgers under events.pull.ledgers, or use `local`." $component $mode) }}
{{- end }}
{{- if dig "producer_keys" list ($pull | default dict) }}
{{- fail (printf "%s sets events.pull.producer_keys, which is retired: a shared mode decides on the history the Host imports over events.import, verified under the membership's pinned rings. Remove it." $component) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
An event store naming producer key files, which are retired.

Events arrive over the Host's `events.ship` (WP-6.2), and the event store trusts only the signing
ring of a data plane in the same process for what its legacy journals still ship. The server refuses
`controlPlane.events.producer_keys` at start; refused here too, at install.
*/ -}}
{{- range $component, $plane := dict "controlPlane" .Values.controlPlane "allInOne" .Values.allInOne }}
{{- if $plane.enabled }}
{{- $extra := $plane.extraConfig | default dict }}
{{- $events := dig "controlPlane" "events" dict $extra | default dict }}
{{- if dig "producer_keys" list $events }}
{{- fail (printf "%s sets controlPlane.events.producer_keys, which is retired: events arrive over the Host's events.ship. Remove it." $component) }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
An event interface turned on, and the contract behind it not accepted.

`events.enabled` is a statement about disks: this plane keeps, or receives, a durable event history.
`experimental.dogwood.enabled` is a different statement: this deployment accepts a contract whose
wire and replication shapes are not yet stable. The interfaces need both, and a plane that has said
one and not the other refuses to start.

Refused here rather than discovered as a CrashLoopBackOff. A chart that renders a manifest whose
process cannot start has told an operator nothing they can act on; a `helm template` that fails names
the setting.
*/ -}}
{{- range $plane := (include "permguard.configUnits" $ | fromJson).units }}
{{- $component := $plane.label }}
{{- if $plane.enabled }}
{{- $extra := $plane.extraConfig | default dict }}
{{- $dogwood := dig "experimental" "dogwood" "enabled" "" $extra }}
{{- $accepted := and $dogwood (ne (toString $dogwood) "false") }}
{{- range $section := list "controlPlane" "dataPlane" }}
{{- $enabled := dig $section "events" "enabled" "" $extra }}
{{- if and $enabled (ne (toString $enabled) "false") (not $accepted) }}
{{- fail (printf "%s sets %s.events.enabled and not experimental.dogwood.enabled. The event interfaces carry a contract whose shape is not yet stable and are served only where a deployment has accepted that, so this plane would refuse to start. Set experimental.dogwood.enabled=\"true\", or turn the events block off." $component $section) }}
{{- end }}
{{- end }}
{{- $bare := dig "events" "enabled" "" $extra }}
{{- if and $bare (ne (toString $bare) "false") (not $accepted) }}
{{- fail (printf "%s sets events.enabled and not experimental.dogwood.enabled. The event interfaces carry a contract whose shape is not yet stable and are served only where a deployment has accepted that, so this plane would refuse to start. Set experimental.dogwood.enabled=\"true\", or turn the events block off." $component) }}
{{- end }}
{{- end }}
{{- end }}


{{- /*
A public listener secured by nothing (WP-2.11).

Outside `developmentMode` a Plane public listener beyond loopback serves TLS, or the deployment says
an ingress or a mesh sidecar terminates TLS in front of it; the process refuses anything else from
the `production` profile up. Said here, at render, rather than as a pod that never becomes ready.
*/ -}}
{{- if not .Values.developmentMode }}
{{- range $component, $plane := dict "controlPlane" .Values.controlPlane "dataPlane" .Values.dataPlane "allInOne" .Values.allInOne }}
{{- if $plane.enabled }}
{{- if and $plane.tls.secretName $plane.tls.terminatedUpstream }}
{{- fail (printf "%s.tls names a Secret to serve TLS with and says TLS is terminated upstream: state one of them." $component) }}
{{- end }}
{{- if not (or $plane.tls.secretName $plane.tls.terminatedUpstream) }}
{{- fail (printf "%s serves its public listener on every interface and %s.tls states neither a Secret (%s.tls.secretName, a kubernetes.io/tls Secret) nor that an ingress or a mesh sidecar terminates TLS in front of it (%s.tls.terminatedUpstream=true): outside developmentMode the process refuses a public listener in the clear." $component $component $component $component) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
The data plane's groups (TD-1).

A group is one membership selector and one operating policy, and the chart refuses the values that
would make two groups serve the same resources, a group reach wider than its membership, a stream it
must keep live on a volume that does not survive a restart, or a claim that may hold unshipped
evidence be deleted by Kubernetes rather than by a verified operation.
*/ -}}
{{- if .Values.dataPlane.enabled }}
{{- $resolved := include "permguard.dataPlaneGroups" . | fromJson }}
{{- if and .Values.dataPlane.groups $resolved.legacy }}
{{- fail (printf "dataPlane.groups is set and so is dataPlane.%s: the single-group keys describe the one group an empty `groups` renders, and beside `groups` they would be two sources of truth. Move them into the group they belong to." (first $resolved.legacy)) }}
{{- end }}
{{- $fullname := include "permguard.fullname" . }}
{{- $seen := dict }}
{{- $parsed := list }}
{{- range $g := $resolved.groups }}
{{- if not (regexMatch "^[a-z]([-a-z0-9]*[a-z0-9])?$" $g.name) }}
{{- fail (printf "dataPlane.groups: %q is not a group name: lowercase letters, digits and `-`, starting with a letter and ending with a letter or a digit." $g.name) }}
{{- end }}
{{- if hasKey $seen $g.name }}
{{- fail (printf "dataPlane.groups: duplicate group name %q: a name labels one group's workload, Service, membership and policy, and two groups sharing it would select each other's replicas." $g.name) }}
{{- end }}
{{- $_ := set $seen $g.name true }}
{{- /* A StatefulSet's name, with the revision hash Kubernetes appends to a pod label, fits 63. */ -}}
{{- if gt (len $g.base) 52 }}
{{- fail (printf "dataPlane.groups[%s]: the workload name %q is too long (%d characters, at most 52): shorten the group name or the release name." $g.name $g.base (len $g.base)) }}
{{- end }}
{{- $selector := include "permguard.selector" $g.selector | fromJson }}
{{- if not $selector.valid }}
{{- fail (printf "dataPlane.groups[%s]: %q is not a selector: `plane/data`, `plane/data/zone/<id>` or `plane/data/zone/<id>/ledger/<id>`, optionally ending in `/*`, each id 1 to 128 of `A-Z a-z 0-9 - _ . :`." $g.name $g.selector) }}
{{- end }}
{{- if not $selector.data }}
{{- fail (printf "dataPlane.groups[%s]: the selector %q reaches outside the data plane: a data plane group's membership is under `plane/data`." $g.name $g.selector) }}
{{- end }}
{{- $parsed = append $parsed (dict "name" $g.name "selector" $selector) }}
{{- /* Its tasks: known types, each within the membership. */ -}}
{{- range $task := $g.tasks }}
{{- $type := toString $task.type }}
{{- if not (has $type (list "policy.mirror" "decisions.ship" "events.ship" "events.import" "audit.checkpoints" "zone.secrets")) }}
{{- fail (printf "dataPlane.groups[%s].tasks: %q is not a membership task: policy.mirror, decisions.ship, events.ship, events.import, audit.checkpoints or zone.secrets." $g.name $type) }}
{{- end }}
{{- if and (not (has $type (list "policy.mirror" "decisions.ship" "events.ship"))) (not $task.resourceTypes) }}
{{- fail (printf "dataPlane.groups[%s].tasks: %s states its resourceTypes: the chart has no default for it." $g.name $type) }}
{{- end }}
{{- with $task.selector }}
{{- $narrow := include "permguard.selector" . | fromJson }}
{{- $within := and $narrow.valid (include "permguard.selectorContains" (dict "selector" $selector "resource" $narrow.prefix)) (or (not $narrow.descendants) $selector.descendants) }}
{{- if not $within }}
{{- fail (printf "dataPlane.groups[%s].tasks: the %s selector %q is wider than its membership %q: a task selector is contained by the membership selector." $g.name $type . $g.selector) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Evidence: a known mode, one the profile allows, and one source. */ -}}
{{- if eq $g.evidence "best-effort" }}
{{- fail (printf "dataPlane.groups[%s]: evidence.mode is best-effort, which this build does not serve: its loss record is not defined yet (WP-6.1), and the server refuses it. Use required, or disabled under development." $g.name) }}
{{- end }}
{{- if not (has $g.evidence (list "required" "disabled")) }}
{{- fail (printf "dataPlane.groups[%s]: evidence.mode is %q: required or disabled." $g.name $g.evidence) }}
{{- end }}
{{- if and (ne $g.assurance.profile "development") (ne $g.evidence "required") }}
{{- fail (printf "dataPlane.groups[%s]: a `%s` group answers only with recorded decisions, and its evidence mode is `%s`: `production` permits `best-effort` per ledger with a recorded risk acceptance, never for a whole group, and `regulated` permits `required` only." $g.name $g.assurance.profile $g.evidence) }}
{{- end }}
{{- $stated := dig "dataPlane" "decisions" "log" dict $g.extraConfig }}
{{- $enabled := ternary "false" "true" (eq $g.evidence "disabled") }}
{{- if or (and (hasKey $stated "enabled") (ne (toString $stated.enabled) $enabled)) (and (hasKey $stated "mode") (ne (toString $stated.mode) $g.evidence)) (and (hasKey $stated "on_full") (ne (toString $stated.on_full) "closed")) }}
{{- fail (printf "dataPlane.groups[%s]: the decision log is stated in extraConfig and by evidence.mode=%s, two sources of the same setting: the chart renders the log from the mode, so remove it from extraConfig." $g.name $g.evidence) }}
{{- end }}
{{- /* Storage: what must survive a restart keeps a volume, and only a verified operation deletes one. */ -}}
{{- if and (not $g.persistence.enabled) (or (ne $g.evidence "disabled") $g.temporal) }}
{{- fail (printf "dataPlane.groups[%s]: %s without persistent storage: a decision spool or an event journal on a volume that does not survive a restart loses evidence or changes what policies decide. Keep persistence.enabled, or record no evidence (evidence.mode=disabled, development only) and keep no history." $g.name (ternary "keeps temporal history" (printf "records evidence (%s)" $g.evidence) $g.temporal)) }}
{{- end }}
{{- if $g.persistence.enabled }}
{{- range $when := list "whenScaled" "whenDeleted" }}
{{- if ne (get $g.persistence $when) "Retain" }}
{{- fail (printf "dataPlane.groups[%s]: persistence.retention.%s is %q (or retainOnScaleDown is false): a claim may hold evidence a replica did not ship, and its deletion is a separate verified operation, never a side effect of scaling or uninstalling. Keep Retain." $g.name $when (get $g.persistence $when)) }}
{{- end }}
{{- end }}
{{- range $mode := $g.persistence.accessModes }}
{{- if has (toString $mode) (list "ReadWriteMany" "ReadOnlyMany") }}
{{- fail (printf "dataPlane.groups[%s]: persistence.accessModes names %s: one volume has one writer, the replica that owns it. Use ReadWriteOncePod or ReadWriteOnce." $g.name $mode) }}
{{- end }}
{{- end }}
{{- if and $g.autoscaling.enabled (gt (int $g.autoscaling.maxReplicas) 1) }}
{{- /*
An autoscaler removes replicas on load, and a replica that keeps a volume may leave evidence it did
not ship: it needs drain recovery (the drain controller), a stabilization long enough for a drain
and its recovery Job, and storage whose takeover is qualified (TD-2).
*/ -}}
{{- $dc := $.Values.dataPlane.drainController }}
{{- if not $dc.enabled }}
{{- fail (printf "dataPlane.groups[%s]: autoscaling a group that keeps a volume needs drain recovery: enable dataPlane.drainController, or a replica scaled away could leave evidence nobody ships. Otherwise set a fixed replicas count." $g.name) }}
{{- end }}
{{- /* The controller's period, from its schedule: every minute, or every N minutes. */ -}}
{{- $period := 0 }}
{{- if eq (toString $dc.schedule) "* * * * *" }}
{{- $period = 60 }}
{{- else if regexMatch "^\\*/[0-9]+ \\* \\* \\* \\*$" (toString $dc.schedule) }}
{{- $period = mul (int (regexFind "[0-9]+" (toString $dc.schedule))) 60 }}
{{- else }}
{{- fail (printf "dataPlane.groups[%s]: autoscaling a group that keeps a volume needs the drain controller's period, and its schedule %q is neither `* * * * *` nor `*/N * * * *`." $g.name $dc.schedule) }}
{{- end }}
{{- $budget := add (int $g.shutdown.timeoutSeconds) (int $dc.jobDeadlineSeconds) (int $period) }}
{{- if lt (int $g.autoscaling.scaleDownStabilizationSeconds) (int $budget) }}
{{- fail (printf "dataPlane.groups[%s]: autoscaling.scaleDownStabilizationSeconds is %d, less than a drain, the controller's period and its recovery Job (%d seconds): the autoscaler would remove the next replica before the last one's evidence is recovered." $g.name (int $g.autoscaling.scaleDownStabilizationSeconds) (int $budget)) }}
{{- end }}
{{- $t := $g.persistence.takeover }}
{{- if not (and $t.qualified $t.driver $t.storageClass $t.evidence) }}
{{- fail (printf "dataPlane.groups[%s]: autoscaling a group that keeps a volume needs its storage takeover qualified: persistence.takeover.qualified with the driver, the storageClass and the evidence of a qualification run that the storage revokes the old writer before attaching the successor. A lease or an expired heartbeat alone is not fencing." $g.name) }}
{{- end }}
{{- if ne $t.storageClass $g.persistence.storageClass }}
{{- fail (printf "dataPlane.groups[%s]: persistence.takeover.storageClass is %q and the group's claims use %q: the qualification is of the storage class the claims are made from." $g.name $t.storageClass $g.persistence.storageClass) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Temporal history: replicated only under a declared shared consistency. */ -}}
{{- $many := or (gt (int $g.replicas) 1) (and $g.autoscaling.enabled (gt (int $g.autoscaling.maxReplicas) 1)) }}
{{- if and $g.temporal $many (not (has $g.pullMode (list "shared-eventual" "shared-bounded"))) }}
{{- fail (printf "dataPlane.groups[%s] keeps temporal history and runs more than one replica without a declared shared consistency: each replica owns its journal, so without events.pull.mode shared-eventual or shared-bounded (and its ledgers) two replicas answer the same question from different histories. Declare the consistency, which discovery publishes, or run one replica." $g.name) }}
{{- end }}
{{- /* One shutdown budget, with time left to seal and release the volume after the drain. */ -}}
{{- if or (lt (int $g.shutdown.timeoutSeconds) 2) (gt (add (int $g.shutdown.drainTimeoutSeconds) 1) (int $g.shutdown.timeoutSeconds)) }}
{{- fail (printf "dataPlane.groups[%s]: shutdown.drainTimeoutSeconds (%d) leaves less than one second of shutdown.timeoutSeconds (%d): the drain runs inside the budget and the process still has to seal and release its volume." $g.name (int $g.shutdown.drainTimeoutSeconds) (int $g.shutdown.timeoutSeconds)) }}
{{- end }}
{{- end }}
{{- /* Two groups never serve the same resources: neither selector contains the other's start. */ -}}
{{- range $i, $a := $parsed }}
{{- range $j, $b := $parsed }}
{{- if lt $i $j }}
{{- if or (include "permguard.selectorContains" (dict "selector" $a.selector "resource" $b.selector.prefix)) (include "permguard.selectorContains" (dict "selector" $b.selector "resource" $a.selector.prefix)) }}
{{- fail (printf "dataPlane.groups: the selectors of %s and %s overlap: two groups would serve, route and be granted the same resources. Make them disjoint." $a.name $b.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
Values that contradict a Host's assurance profile (TD-1).

The profile is checked at Bootstrap; refusing here says it at install, naming the value. Custody is
read as the server reads it: the environment over the file, a ring's own custody over the Host's,
and the profile's default when nothing is stated (`development` under `development`, `file`
above). Dual control is in force by the `regulated` profile itself and has no value to refuse.
*/ -}}
{{- range $unit := (include "permguard.configUnits" $ | fromJson).units }}
{{- $label := $unit.label }}
{{- $profile := $unit.assurance.profile }}
{{- if not (has $profile (list "development" "production" "regulated")) }}
{{- fail (printf "%s: %q is not an assurance profile: development, production or regulated." $label $profile) }}
{{- end }}
{{- $env := dict }}
{{- range $e := $unit.extraEnv }}
{{- $_ := set $env (toString $e.name) (toString $e.value) }}
{{- end }}
{{- /* What the configuration renders: the extraConfig, with the assurance values over it. */ -}}
{{- $config := mergeOverwrite (deepCopy $unit.extraConfig) (include "permguard.assuranceConfig" $unit.assurance | fromYaml) }}
{{- $keys := dig "operations" "keys" dict $config }}
{{- $default := ternary "development" "file" (eq $profile "development") }}
{{- $host := get $env "PERMGUARD_KEYS_CUSTODY" | default (toString (dig "custody" "" $keys)) | default $default }}
{{- $rings := dict
      "host.identity" (get $env "PERMGUARD_KEYS_IDENTITY_CUSTODY" | default (toString (dig "rings" "host.identity" "custody" "" $keys)) | default $host)
      "host.operations" (get $env "PERMGUARD_KEYS_OPERATIONS_CUSTODY" | default (toString (dig "rings" "host.operations" "custody" "" $keys)) | default $host)
}}
{{- $custodies := list $host (get $rings "host.identity") (get $rings "host.operations") }}
{{- if and (ne $profile "development") (has "development" $custodies) }}
{{- fail (printf "%s: the `development` custody keeps private keys in plaintext files, which the `%s` profile refuses: use `file` (envelope-encrypted) or, better, `pkcs11` or `kms`." $label $profile) }}
{{- end }}
{{- /* Two sources of the same custody: the assurance values and the configuration. */ -}}
{{- $stated := dig "operations" "keys" dict $unit.extraConfig }}
{{- $values := $unit.assurance.custody | default dict }}
{{- range $pair := list (list "provider" (dig "custody" "" $stated)) (list "identity" (dig "rings" "host.identity" "custody" "" $stated)) (list "operations" (dig "rings" "host.operations" "custody" "" $stated)) }}
{{- $fromValues := toString (get $values (index $pair 0)) }}
{{- $fromConfig := toString (index $pair 1) }}
{{- if and $fromValues $fromConfig (ne $fromValues $fromConfig) }}
{{- fail (printf "%s: assurance.custody.%s is `%s` and extraConfig says `%s`, two sources of the same custody: state it once, in assurance.custody." $label (index $pair 0) $fromValues $fromConfig) }}
{{- end }}
{{- end }}
{{- /* What each custody needs stated, at every profile, as Bootstrap checks it. */ -}}
{{- if has "pkcs11" $custodies }}
{{- if not (and (get $env "PERMGUARD_KEYS_PKCS11_MODULE" | default (dig "pkcs11" "module" "" $keys)) (get $env "PERMGUARD_KEYS_PKCS11_TOKEN_LABEL" | default (dig "pkcs11" "token_label" "" $keys)) (get $env "PERMGUARD_KEYS_PKCS11_PIN_REF" | default (dig "pkcs11" "pin_ref" "" $keys))) }}
{{- fail (printf "%s: the pkcs11 custody states pkcs11.module, pkcs11.tokenLabel and pkcs11.pinRef, the token it holds its keys in." $label) }}
{{- end }}
{{- end }}
{{- if has "kms" $custodies }}
{{- $address := toString (get $env "PERMGUARD_KEYS_KMS_ADDRESS" | default (dig "kms" "address" "" $keys)) }}
{{- if not (and $address (get $env "PERMGUARD_KEYS_KMS_TOKEN_REF" | default (dig "kms" "token_ref" "" $keys))) }}
{{- fail (printf "%s: the kms custody states kms.address and kms.tokenRef, the KMS that holds its keys." $label) }}
{{- end }}
{{- if not (or (hasPrefix "https://" $address) (and $.Values.developmentMode (hasPrefix "http://" $address))) }}
{{- fail (printf "%s: kms.address is `https://`: a token and wrapped keys never cross plain HTTP outside development." $label) }}
{{- end }}
{{- end }}
{{- if eq $profile "regulated" }}
{{- if $.Values.developmentMode }}
{{- fail (printf "%s: the `regulated` profile is not served in developmentMode, which is somebody's laptop." $label) }}
{{- end }}
{{- range $ring := list "host.identity" "host.operations" }}
{{- if not (has (get $rings $ring) (list "pkcs11" "kms")) }}
{{- fail (printf "%s: the `regulated` profile keeps `%s` in HSM or KMS custody (pkcs11 or kms), and its custody is `%s`: state assurance.custody (provider, or the ring's own identity/operations) with its references." $label $ring (get $rings $ring)) }}
{{- end }}
{{- end }}
{{- if and $unit.tls $unit.tls.terminatedUpstream }}
{{- fail (printf "%s: the `regulated` profile serves TLS end to end, and its public listener is terminated upstream." $label) }}
{{- end }}
{{- $twelve := regexMatch "\"min_version\":(\"[vV]?1[._]?2\"|1\\.2|12)[,}]" (toJson $config) }}
{{- range $name, $value := $env }}
{{- if and (hasSuffix "_TLS_MIN_VERSION" $name) (regexMatch "^[vV]?1[._]?2$" $value) }}
{{- $twelve = true }}
{{- end }}
{{- end }}
{{- if $twelve }}
{{- fail (printf "%s: a TLS minimum of 1.2 is stated, and the `regulated` profile is TLS 1.3 only." $label) }}
{{- end }}
{{- range $runtime, $settings := (dig "experimental" dict $config) }}
{{- $on := dig "enabled" "" ($settings | default dict) }}
{{- if and $on (ne (toString $on) "false") }}
{{- fail (printf "%s: the experimental runtime %s is opted into, and the `regulated` profile never serves experimental runtimes." $label $runtime) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}


{{- /*
The Host listener (TD-2): mutual TLS from a Secret, and one source for it.
*/ -}}
{{- range $label, $plane := dict "controlPlane" .Values.controlPlane "dataPlane" .Values.dataPlane "allInOne" .Values.allInOne }}
{{- if and $plane.enabled $plane.hostListener $plane.hostListener.enabled (not $plane.hostListener.tls.secretName) }}
{{- fail (printf "%s.hostListener is enabled and names no tls.secretName: the Host listener serves mutual TLS only, from a kubernetes.io/tls Secret with ca.crt." $label) }}
{{- end }}
{{- end }}
{{- range $unit := (include "permguard.configUnits" $ | fromJson).units }}
{{- $listener := (ternary $.Values.controlPlane.hostListener (ternary $.Values.allInOne.hostListener $.Values.dataPlane.hostListener (eq $unit.kind "allInOne")) (eq $unit.kind "controlPlane")) }}
{{- if hasKey ($unit.extraConfig | default dict) "telemetry" }}
{{- fail (printf "%s: extraConfig states `telemetry`, the older spelling of the `host` section the chart renders: write it as `host`, or the server sees the section twice." $unit.label) }}
{{- end }}
{{- if and $listener.enabled (hasKey ($unit.extraConfig | default dict) "admin") }}
{{- fail (printf "%s: extraConfig states `admin` and hostListener is enabled, two sources of the Host listener: state it in hostListener." $unit.label) }}
{{- end }}
{{- end }}

{{- /*
The drain controller (TD-2): what it reaches and what it needs.
*/ -}}
{{- if and .Values.dataPlane.enabled .Values.dataPlane.drainController.enabled }}
{{- $dc := .Values.dataPlane.drainController }}
{{- if not .Values.dataPlane.hostListener.enabled }}
{{- fail "dataPlane.drainController needs dataPlane.hostListener: a replica without its Host listener holds no membership and issues no drain receipt, so no claim of it could ever be reclaimed." }}
{{- end }}
{{- if not $dc.tls.secretName }}
{{- fail "dataPlane.drainController.tls.secretName names no Secret: the controller presents an operator's client certificate to the coordinator's Host listener, and verifies it against the Secret's ca.crt." }}
{{- end }}
{{- if and (not $dc.coordinator) (not (and .Values.controlPlane.enabled .Values.controlPlane.hostListener.enabled)) }}
{{- fail "dataPlane.drainController names no coordinator and this release's control plane serves no Host listener: set dataPlane.drainController.coordinator to the coordinator's Host listener, or enable controlPlane.hostListener." }}
{{- end }}
{{- if and $dc.coordinator (not (hasPrefix "https://" $dc.coordinator)) }}
{{- fail (printf "dataPlane.drainController.coordinator is %q: the coordinator's Host listener is reached over https only." $dc.coordinator) }}
{{- end }}
{{- if or (lt (int $dc.jobDeadlineSeconds) 30) (not $dc.schedule) }}
{{- fail "dataPlane.drainController needs a schedule and a jobDeadlineSeconds of at least 30: the drain Job's deadline is what a forced timeout is." }}
{{- end }}
{{- range $g := (include "permguard.dataPlaneGroups" $ | fromJson).groups }}
{{- if and $g.persistence.enabled (lt (int $dc.jobDeadlineSeconds) (add (int $g.shutdown.timeoutSeconds) 60)) }}
{{- fail (printf "dataPlane.groups[%s]: dataPlane.drainController.jobDeadlineSeconds (%d) is shorter than the group's shutdown budget plus a minute to start (%d): every drain Job would end as a forced timeout and no claim could ever be reclaimed." $g.name (int $dc.jobDeadlineSeconds) (add (int $g.shutdown.timeoutSeconds) 60)) }}
{{- end }}
{{- if and $g.persistence.enabled (gt (len $g.base) 44) }}
{{- fail (printf "dataPlane.groups[%s]: with the drain controller the workload name %q is at most 44 characters, for its CronJob's: shorten the group name or the release name." $g.name $g.base) }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
Image verification at deploy (TD-4).

On, the digest verified is the digest that runs: every enabled component names its image by
digest, and the verifier itself is named by digest. Its token comes from a Secret. A `regulated`
workload runs only verified images.
*/ -}}
{{- $iv := .Values.imageVerification }}
{{- range $unit := (include "permguard.configUnits" $ | fromJson).units }}
{{- if and (eq $unit.assurance.profile "regulated") (not $iv.enabled) }}
{{- fail (printf "%s: the `regulated` profile runs only images verified before start: set imageVerification.enabled, with imageVerification.verifier.image, imageVerification.tokenSecret and each component's digest." $unit.label) }}
{{- end }}
{{- end }}
{{- if $iv.enabled }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" ($iv.verifier.image | default "")) }}
{{- fail (printf "imageVerification.verifier.image is %q: name the verifier by digest, `<registry>/<name>@sha256:<hex>`, or what verifies the images is itself unverified." ($iv.verifier.image | default "")) }}
{{- end }}
{{- if not $iv.tokenSecret.name }}
{{- fail "imageVerification.tokenSecret.name is empty: the attestation API is read with a GitHub token, from a Secret." }}
{{- end }}
{{- if not (and $iv.repository $iv.signerWorkflow) }}
{{- fail "imageVerification names no repository or signerWorkflow: the provenance is checked against both." }}
{{- end }}
{{- $components := dict }}
{{- if .Values.controlPlane.enabled }}{{- $_ := set $components "controlPlane" .Values.controlPlane.digest }}{{- end }}
{{- if .Values.dataPlane.enabled }}{{- $_ := set $components "dataPlane" .Values.dataPlane.digest }}{{- end }}
{{- if .Values.allInOne.enabled }}{{- $_ := set $components "allInOne" .Values.allInOne.digest }}{{- end }}
{{- if and .Values.dataPlane.enabled .Values.dataPlane.drainController.enabled }}{{- $_ := set $components "dataPlane.drainController" .Values.dataPlane.drainController.digest }}{{- end }}
{{- range $component, $digest := $components }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" ($digest | default "")) }}
{{- fail (printf "%s.digest is %q: with imageVerification on, every image is named by its digest, `sha256:<hex>` — a tag the kubelet resolves later is not what was verified." $component ($digest | default "")) }}
{{- end }}
{{- end }}
{{- end }}
