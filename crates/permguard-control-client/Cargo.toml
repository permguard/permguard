[package]
name = "permguard-control-client"
description = "The client of a Permguard control plane: endpoints and trust material, both transports, the zone catalog and the NOTP verbs, and the verified local mirror — pull only. Consumed by the CLI and by the data plane, so the two speak the wire identically."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

# The client half of the control plane's gRPC contract, generated from the
# plane's own `proto/`.
build = "build.rs"

[dependencies]
permguard-notp.workspace = true
permguard-objects.workspace = true
base64.workspace = true
http.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
prost.workspace = true
prost-types.workspace = true
tonic-prost.workspace = true

[dev-dependencies]
# The fake plane the wire tests stand up: a tonic server on an ephemeral port.
async-stream.workspace = true
futures-core.workspace = true
rcgen.workspace = true
ring.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
