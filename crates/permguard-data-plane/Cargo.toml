[package]
name = "permguard-data-plane"
description = "The Permguard data plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag. A crate
# here is a compilation unit of that product, not something to depend on from outside it — and a name
# taken on crates.io is taken permanently.
publish = false

# The policy languages an embedding application selects, none by default
# (`11-refactoring/1-dependencies.md`, Feature and profile model): each links one engine package
# and nothing of the others. The standalone Data Plane selects all three itself.
[features]
cedar = ["permguard-languages/cedar"]
dogwood = ["permguard-languages/dogwood"]
rego = ["permguard-languages/rego"]

[dependencies]
anyhow.workspace = true
# The verified local mirror: its store, its checkpoint and the pull that proves before it moves.
# No network client: the mirror is filled over the sessions of the tasks the Host serves.
permguard-mirror.workspace = true
# The round over the Host's `policy.mirror` tasks, which this plane runs on its cadence.
permguard-sync.workspace = true
permguard-core.workspace = true
# What a decision record is: the canonical bytes, the chain and the durable spool.
permguard-decisions.workspace = true
# The durable event journal and the record contract the temporal interface writes.
permguard-events.workspace = true
permguard-stream.workspace = true
# The `policy.mirror` task messages a mirror round carries over its session (WP-7.2a).
permguard-notp.workspace = true
# The randomness the shipping backoff's jitter comes from: a deterministic jitter is no jitter
# once every plane in a fleet runs the same build.
ring.workspace = true
regex.workspace = true
tracing.workspace = true
# The handles this plane declares and gets from the Host (P1).
permguard-host.workspace = true
serde_json.workspace = true
# The evaluating half: this package decides. Which languages, the features above say.
permguard-languages = { workspace = true, features = ["evaluate"] }
permguard-objects.workspace = true
# `rc`: a request shares its partition inputs across its evaluations behind an `Arc`, and the
# decision record serializes them.
serde = { workspace = true, features = ["rc"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# The tests decide in every language, whatever features the build under test selected.
permguard-languages = { workspace = true, features = ["cedar", "dogwood", "rego", "evaluate"] }
permguard-host = { workspace = true, features = ["test-support"] }
# Decoding a signed response's parts, as a PEP would (WP-6.6b).
base64.workspace = true
# Capturing what a decision logs, to prove identifiers stay out of it (P10, H-13).
tracing-subscriber.workspace = true
# Transport parity, fault injection and the boundary registry, shared by every plane.
permguard-conformance.workspace = true
# A Control Plane served over HTTP, which a mirror round pulls from.
permguard-control-plane-server.workspace = true
axum.workspace = true
# The actor the served Control Plane reads, as its listener sets it.
permguard-transport.workspace = true
# The release-pipeline example is read from disk, manifest included, so the test
# cannot drift from the files the lab's README tells a reader to apply.
serde_norway.workspace = true
permguard-client.workspace = true
# `start_paused` lets the mirror service's wait be tested without waiting (WP-7.2c).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
permguard-std.workspace = true
