development_mode: true
autogenerate: true
working_dir: /var/lib/permguard/data-plane

log:
  level: debug
  format: json

public:
  tls:
    cert: tls/server.pem
    key: tls/server.key

telemetry:
  addr: 0.0.0.0:7658
  tls:
    cert: tls/server.pem
    key: tls/server.key

dataPlane:
  public:
    http:
      enabled: true
      addr: 0.0.0.0:7656
      tls:
        cert: tls/server.pem
        key: tls/server.key
    grpc:
      enabled: true
      addr: 0.0.0.0:7656
      tls:
        cert: tls/server.pem
        key: tls/server.key

  # Mirroring over TLS, in a container. Off until the authority is here: each plane has its own
  # Docker volume, so the control plane's tls/ca.pem is not readable from this one. Mount or copy it
  # to the path below and turn this on — nothing else changes.
  mirrors:
    enabled: "false"
    interval: "15s"
    timeout: "1m"
    parallelism: "4"
    servers:
      - url: "https://control-plane:7556"
        tls:
          ca_file: tls/control-plane-ca.pem
          # The generated certificate names `localhost`, and this plane dials the compose service
          # name: check the certificate against the name it actually carries, rather than turning
          # verification off.
          server_name: localhost

  # The decision path, sized for the lab's container limits.
  decisions:
    cache:
      partitions: "32"
      bytes: "128M"
    max_evaluations: "128"

    # Every decision, recorded where it can be kept and proven. The record is durable on this
    # volume before it is anybody else's problem: an answer is not given until its record is on this
    # disk, and a control plane that is down costs spool, not availability.
    #
    # That durability is the dominant cost of a decision — measured at roughly ten times the
    # evaluation itself, which is what `bench/decide.js` reports — and it is the price of an audit
    # trail that survives the process. What the decision path does *not* wait for is the record
    # reaching the control plane; that is the spool's job, off the critical path.
    log:
      enabled: "true"
      pdp_id: data-plane-docker-tls          # half of every stream identity: two replicas must never share one
      server:
        url: "https://control-plane:7556"
        tls:
          ca_file: tls/control-plane-ca.pem
          server_name: localhost
      spool:
        directory: "data/decisions/spool"
        bytes: "64M"              # decision records only; the terminal record is reserved apart
        age: "24h"
      batch: { bytes: "256k", interval: "1s" }
      on_full: "open"             # keep answering; the stream ends with a signed discontinuity
      sample: { permits: "1.0" }  # denies and errors are never sampled, whatever this says
      # The secret input commitments are taken under. A different key from the pseudonymisation
      # one: they protect different things, and rotating one to crypto-shred pseudonyms must not
      # invalidate every commitment with it.
      commitment:
        key_ref: decision-commitment
        key_version: "v1"
      include:
        subject_properties: []    # an allow-list, never "all": name a field to record it
        resource_properties: []
        context: []

limits:
  # Through Docker's port forwarding every connection from the host arrives as the compose
  # network's gateway address — one address for all clients, which is exactly the NAT case the
  # per-address bound documents: exempt the private range the network lives in, or the bound
  # counts the gateway as one very greedy client. The pool limit still bounds the total.
  peer_exempt:
    - 172.16.0.0/12

operations:
  keys:
    enabled: true
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    provider: directory
  audit:
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"
