[package]
name = "permguard-core"
description = "The contracts every Permguard crate agrees on: storage, secrets, signing keys, audit, services, and the server host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag. A crate
# here is a compilation unit of that product, not something to depend on from outside it — and a name
# taken on crates.io is taken permanently.
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_norway.workspace = true
# Part of the `Secret` contract rather than a convenience: erasing key material on drop is a promise
# the type makes, so it cannot live in whichever crate happens to construct one.
zeroize.workspace = true

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
