[package]
name = "permguard-offline"
description = "Offline volume administration the server and the command line share: the configuration as serve reads it, key rings, custody, provisioning and the migrations of a volume. No listener, no transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag.
publish = false

[features]
# Each remote custody is an adapter a build carries only when it asks; without one, a
# configuration that names that custody is refused by name.
#
# A hardware token's custody, through PKCS#11.
pkcs11 = ["dep:cryptoki"]
# A KMS's custody, a Vault Transit engine: the one network client of this package.
kms = [
    "dep:base64",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio",
    "dep:tokio-rustls",
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
permguard-core.workspace = true
permguard-host.workspace = true
permguard-decisions = { workspace = true, features = ["storage"] }
permguard-events = { workspace = true, features = ["storage"] }
# The implementations a configuration may name offline: the catalog and the secret stores.
permguard-std = { workspace = true, features = ["catalog", "secrets"] }
cryptoki = { workspace = true, optional = true }
tracing.workspace = true
# The custody of a KMS or a transit engine: one bounded HTTPS client, no listener (`kms`).
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
ring.workspace = true
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net"], optional = true }
tokio-rustls = { workspace = true, optional = true }
zeroize.workspace = true
