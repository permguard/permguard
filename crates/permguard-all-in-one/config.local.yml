development_mode: true
autogenerate: true
working_dir: .volume/all-in-one

log:
  level: debug
  format: terminal

telemetry:
  addr: 127.0.0.1:7558

runtime:
  planes:
    - control
    - data

controlPlane:
  public:
    http:
      enabled: true
      addr: 127.0.0.1:7556
    grpc:
      enabled: true
      addr: 127.0.0.1:7556

  # Reclaiming what nothing references. A laptop cadence, so the loop is watchable; `grace` is at
  # the floor this server accepts — below it, a sweep could delete the uploads of a push in flight.
  storage:
    gc:
      enabled: "true"
      interval: "5m"
      grace: "15m"

  # Where the decisions its data planes answer are kept. Records arrive signed and chained, are
  # stored verbatim so they stay verifiable exactly as they were signed, and are indexed into a
  # physical partition per zone and ledger — a tenant reads a directory that contains only its own.
  decisions:
    enabled: "true"
    directory: "data/decisions/store"
    retention: "7d"

dataPlane:
  public:
    http:
      enabled: true
      addr: 127.0.0.1:7656
    grpc:
      enabled: true
      addr: 127.0.0.1:7656

  # Mirroring, in one process. The control plane in this very binary is where the ledgers are, and
  # this data plane keeps its own verified copy of them on the same volume — over the loopback, the
  # same NOTP transfer a remote plane uses. It is not a shortcut: it is what makes `permguard check`
  # answer straight after `task run:all`, exercising the real path (mirror, load gate, compile) on a
  # laptop. A deployment that feeds its plane another way turns this off.
  mirrors:
    enabled: "true"
    interval: "15s"        # a cadence somebody watching a terminal can see; the default is 30s
    timeout: "1m"
    parallelism: "4"
    servers:
      # This process's own control plane. The URL alone: every zone and every ledger it lists.
      - url: "http://127.0.0.1:7556"

  # The decision path, sized for a laptop: a handful of ledgers, a small heap.
  decisions:
    cache:
      partitions: "16"
      bytes: "64M"
    max_evaluations: "64"

    # Every decision, recorded where it can be kept and proven. The record is durable on this
    # volume before it is anybody else's problem: the decision path never waits on the log, and a
    # control plane that is down costs spool, not availability.
    log:
      enabled: "true"
      pdp_id: all-in-one-local          # half of every stream identity: two replicas must never share one
      server:
        url: "http://127.0.0.1:7556"
      spool:
        directory: "data/decisions/spool"
        bytes: "64M"              # decision records only; the terminal record is reserved apart
        age: "24h"
      batch: { bytes: "256k", interval: "1s" }
      on_full: "open"             # keep answering; the stream ends with a signed discontinuity
      sample: { permits: "1.0" }  # denies and errors are never sampled, whatever this says
      # The secret input commitments are taken under. A different key from the pseudonymisation
      # one: they protect different things, and rotating one to crypto-shred pseudonyms must not
      # invalidate every commitment with it.
      commitment:
        key_ref: decision-commitment
        key_version: "v1"
      include:
        subject_properties: []    # an allow-list, never "all": name a field to record it
        resource_properties: []
        context: []

operations:
  keys:
    enabled: true
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    provider: directory
  audit:
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"
