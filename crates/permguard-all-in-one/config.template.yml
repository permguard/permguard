# Permguard all-in-one configuration template.
development_mode: false
autogenerate: false

# The assurance profile (WP-2.8): `development` ⊂ `production` ⊂ `regulated`, every control of
# the lower profile in force in the higher one. Absent means `production`, the floor for a Host
# serving real decisions. `added_controls` switches on single controls of a higher profile; a
# control of the own profile can never be switched off. Relaxations are never declared: they are
# what the values in force amount to (a TLS minimum of 1.2 is `tls.1_2_compat`, an enabled key
# ring is `custody.plaintext` until the custody providers), refused at start when the profile does
# not permit them, and published by discovery and `GET /host/v1/status`.
# assurance:
#   profile: production
#   added_controls: [tls.1_3_only]

# What this Host asks of the members it coordinates (WP-4.2). A task may require controls of the
# assurance table; `appraisal.controls` names, for each, the least evidence that satisfies it:
# `declared` (the member's profile, a compatibility claim only), `operator-approved` (an operator's
# accountable approval, with reason and expiry) or `attested` (a fresh result from a verifier the
# composition registers; none ships, so `attested` is refused until one is). A control it does not
# name makes a task requiring it unapprovable. A binding lasts at most `max_binding` (30 days).
# membership:
#   appraisal:
#     controls:
#       custody.encrypted: declared
#       operations.dual_control: operator-approved
#     max_binding: "30d"

# The one root of everything this process keeps: the catalog (data/), the trail, the keys, the
# generated secrets. Move this and everything moves with it — it is the volume to mount and back up.
working_dir: /var/lib/permguard

# The volume under working_dir, as the startup probe and the qualification registry read it.
# Its keys are checked when the file is read (a misspelled one is refused); its values are
# validated and enforced once the Host composition lands (WP-2.1).
# The filesystem and its version are detected, never configured. A tuple not listed under
# `qualified` is refused under `production` unless `compatibility_mode` is on, which is then
# published, and is always refused under `regulated`.
# storage:
#   volume:
#     storage_class: fast-ssd          # the storage class the volume comes from
#     driver: ebs.csi.aws.com          # the driver or provider that attaches it
#   qualified:
#     - storage_class: fast-ssd
#       driver: ebs.csi.aws.com
#       filesystem: ext4
#       version: "6.8"                # a release, or a prefix of releases ending at . or -
#       evidence: QUAL-2026-01         # where the crash and takeover tests are recorded
#   compatibility_mode: false
#   floors:
#     free_bytes: 64M                  # the default
#     free_inodes: "1000"              # the default

log:
  level: info
  format: json

# Stopping. `timeout` is the one total budget, set to the orchestrator's grace period
# (Kubernetes `terminationGracePeriodSeconds`, 30 s by default); `drain_timeout` is the part of it
# in which intake stops and in-flight work finishes, at least one second shorter, the rest sealing
# the trail and releasing the volume. A drain that does not complete exits 75 and is never reported clean.
# shutdown:
#   timeout: "30s"
#   drain_timeout: "25s"

# The Host's clock guard. A backward step of the wall clock larger than this is a clock anomaly:
# new leases and time-sensitive signatures (NOTP head statements) refuse, and the Host reports
# `degraded: time`, until the wall clock passes the highest time it had seen.
# time:
#   max_clock_skew: "30s"

# Contracts this build carries whose wire and replication shapes have not yet proven stable.
# A block rather than scattered flags, so what is provisional is visible in one place.
experimental:
  dogwood:
    # Serve ledgers that name the `dogwood` runtime, and the interfaces built on it.
    #
    # Written out rather than left to the default, so what a deployment has accepted is readable
    # from the file rather than inferred from silence.
    #
    # The language is compiled in either way — a language is a build, not a deployment action — so
    # what this gates is whether a ledger naming it will be SERVED. A manifest that names it on a
    # plane which has not turned this on is refused at load, by name, rather than served and found
    # to behave differently after an upgrade.
    #
    # It is also the second half of the gate on the event interfaces: the temporal PDP interface
    # and the control plane's event store need this AND their own `events.enabled`, and a plane
    # that has said one of the two and not the other refuses to start rather than running with an
    # interface nobody can reach.
    enabled: "false"

# Server Host operations surface: process discovery, health, readiness, version, metrics — and
# the operations ring published as a JWKS at /server-host/keys (a redirect to a Host listener
# that serves plain TLS; behind a client CA the ring stays here). This surface is what every
# Permguard deployment exposes identically, so it defaults to 0.0.0.0:5443 even when this
# section is absent; `addr: off` is the explicit opt-out for a process that must expose nothing.
host:
  addr: 0.0.0.0:5443
  # What the process-level well-known and the Host jwks_uri publish, when where this surface is
  # reached is not where it binds — a Service, an Ingress, a load balancer.
  # advertised_url: "https://ops.example.com"
  # Who a caller is (WP-2.4). A certificate whose SAN URI a rule names, or whose subject public
  # key a rule pins, maps to that principal; CN and DN are labels and map nothing; a bearer token
  # from a pinned OIDC issuer maps to `oidc:<issuer>#<claim>`. A credential no rule maps is
  # unauthenticated. Two rules that collapse to one principal stop the start. Grants are issued
  # offline with `permguard host grants`, the first administrator with `host grants bootstrap`.
  # principals:
  #   - san_uri: "spiffe://acme/operators/alice"
  #   - spki: "sha256:<64 hex of the subject public key info>"
  #   - oidc:
  #       issuer: "https://login.example.com"
  #       audience: "permguard"
  #       algorithms: [RS256, ES256, EdDSA]   # the default; the token's header is compared, never obeyed
  #       claim: sub                           # the default
  #       jwks_file: "./login.example.com.jwks.json"   # beside this file; re-read when it changes, never fetched
  #       max_stale: "24h"                     # a key set not re-read for this long makes authentication unavailable
  # What anybody may do without a credential: nothing, in production. Declared here, never
  # journaled; the development configurations open the catalog, pushes and evaluations this way.
  # authz:
  #   public:
  #     - operations: [decision.evaluate]
  #       selector: "plane/data/zone/<zone-id>/ledger/<ledger-id>"
  # Distributed tracing over OTLP/gRPC. Off by default; when on, spans leave from a
  # dedicated background thread with a bounded queue — a collector that is down means
  # dropped spans and a warning, never a slower or failing request.
  # otel:
  #   enabled: "true"
  #   endpoint: "http://127.0.0.1:4317"   # the OTLP/gRPC collector (e.g. Tempo, otel-collector)
  #   sample_rate: "1.0"                  # fraction of traces kept, 0.0..=1.0

# The Host listener (WP-2.5): `/host/v1` and `permguard.host.v1` on one port, over mutual TLS.
# Grants are issued and revoked here, the key rings read, the lifecycle and the effective
# configuration reported; every route decides with the Host's grants (`host.principals` names
# who a caller is). TLS is required, and a client CA with it unless the bind is a loopback
# address under `development_mode: true`; `allow` names, of everybody the client CA signed, who
# may reach the listener at all. Without this section grants are administered offline, with
# `permguard host grants`. The telemetry listener's `/server-host/keys` redirects to
# `/host/v1/keys/host.operations` here when the listener serves plain TLS; behind a client CA the
# ring stays on the telemetry listener, a verifier holding no operator certificate.
# admin:
#   addr: 0.0.0.0:5444
#   advertised_url: "https://ops.example.com:5444"   # where it is reached from outside, optional
#   tls:
#     cert: tls/server.pem
#     key: tls/server.key
#     client_ca: tls/ca.pem
#     crl: tls/ca.crl
#   allow:
#     - cn:operator

runtime:
  planes:
    - control
    - data
  # Every selected plane gates readiness unless it is listed here: an optional plane that
  # fails or waits for a remote is listed as such by `GET /health`, and the rest serves.
  # optional_planes:
  #   - control

controlPlane:
  # The plane's signing ring: what the control plane serves is attested with these keys —
  # NOTP head statements today. Its own ring, never the operations ring that seals the audit
  # trail; published as JWKS at /control-plane/keys and named by /.well-known/server-configuration.
  # Lifecycle (publish_ahead, rotate_every, retain) follows operations.keys.
  # keys:
  #   enabled: "true"          # absent: follows operations.keys.enabled
  #   directory: keys/control  # on the volume, unless said otherwise
  public:
    http:
      enabled: true
      addr: 0.0.0.0:6443
      # From the `production` profile a public listener beyond loopback serves TLS, or the
      # deployment says an ingress or a mesh sidecar terminates TLS in front of it (WP-2.11).
      # HTTP and gRPC share this address, so they state the same block.
      tls:
        cert: tls/control-server.pem
        key: tls/control-server.key
        # client_ca: tls/clients.pem
        # crl: tls/clients.crl
        # allow:                          # who, of everybody client_ca signed, this endpoint answers
        #   - cn:the-billing-service      # empty/absent: the handshake is the whole decision
        #   - sha256:<fingerprint>
        # min_version: "1.3"
        # Behind an ingress or a sidecar that terminates TLS, replace cert and key with this line,
        # in this block and in the gRPC one below alike: published as `upstream_tls`, it is the
        # relaxation `tls.terminated_upstream`, refused by `regulated`.
        # terminated_upstream: true
    grpc:
      enabled: true
      addr: 0.0.0.0:6443
      tls:
        cert: tls/control-server.pem
        key: tls/control-server.key

  # ── Keeping the store from growing forever ───────────────────────────────────────────────────
  # A content-addressed store only ever adds. A push uploads its objects and *then* commits, so a
  # push that never commits — a lost connection, a conflict nobody retried — leaves objects nothing
  # will ever reach; so does a history that moved past a policy version. Nothing else here deletes
  # an object, so without this the disk of a long-lived deployment climbs in one direction.
  #
  # The rule: keep what any ref reaches, remove the rest **once it is older than the grace period**.
  #
  # `grace` is the safety property, not a tuning knob. During a push the uploaded objects are
  # legitimately unreachable until the commit lands; a sweep that ignored their age would delete the
  # work of every push in flight, and the client would find out from a commit refused for an object
  # it knows it sent. The server refuses anything below 15m for that reason.
  # storage:
  #   gc:
  #     enabled: "true"      # the default; "false" keeps everything, forever
  #     interval: "6h"       # how often the store is swept — about how promptly space returns
  #     grace: "24h"         # how old an unreachable object must be before it may go

  # # Where the decisions this deployment's data planes answer are kept. Off by default: a control
  # # plane that receives nothing should not create a store, and a deployment that has not decided
  # # its retention should not be handed one by accident.
  # #
  # # Records arrive signed and chained and are stored VERBATIM — the producer chain is taken over
  # # the bytes the producer signed, so a store that re-serialised them would break every digest
  # # after the first. They are indexed into a physical partition per (zone, ledger): a tenant reads
  # # a directory that contains only its own records, because a bug in a filter leaks a neighbour's
  # # data and a partition cannot.
  # decisions:
  #   enabled: "true"
  #   directory: "data/decisions/store"  # under the working directory; put it on a volume that survives
  #   retention: "90d"           # how long records are kept. This is also the bound on how far
  #                              # behind a reader may fall: past it, a consumer is told
  #                              # `offset_expired` and where the remaining records begin, rather
  #                              # than resuming from the wrong place and reporting a clean run.
  #   producer_keys:              # remote producers: each JWKS bound to the ONE pdp it signs for.
  #     - path: trust/data-plane-decisions.jwks
  #       pdp: data-plane-eu-1    # exact, never `*`: the binding is what stops one plane
  #                               # signing evidence as another. Absent entries mean only the
  #                               # ring sharing this process (the all-in-one) is accepted.

dataPlane:
  # The plane's signing ring: it will sign the decision responses this plane returns. Part of
  # the model, like the control plane's ring — its own keys, never the operations ring that
  # seals the audit trail. Published as JWKS at /data-plane/keys and named by
  # /.well-known/server-configuration. Lifecycle follows operations.keys.
  # keys:
  #   enabled: "true"          # absent: follows operations.keys.enabled
  #   directory: keys/data     # on the volume, unless said otherwise
  public:
    http:
      enabled: true
      addr: 0.0.0.0:7443
      # From the `production` profile a public listener beyond loopback serves TLS, or the
      # deployment says an ingress or a mesh sidecar terminates TLS in front of it (WP-2.11).
      # HTTP and gRPC share this address, so they state the same block.
      tls:
        cert: tls/data-server.pem
        key: tls/data-server.key
        # client_ca: tls/clients.pem
        # crl: tls/clients.crl
        # allow:                          # who, of everybody client_ca signed, this endpoint answers
        #   - cn:the-billing-service      # empty/absent: the handshake is the whole decision
        #   - sha256:<fingerprint>
        # min_version: "1.3"
        # Behind an ingress or a sidecar that terminates TLS, replace cert and key with this line,
        # in this block and in the gRPC one below alike: published as `upstream_tls`, it is the
        # relaxation `tls.terminated_upstream`, refused by `regulated`.
        # terminated_upstream: true
    grpc:
      enabled: true
      addr: 0.0.0.0:7443
      tls:
        cert: tls/data-server.pem
        key: tls/data-server.key

  # ── What this plane mirrors ──────────────────────────────────────────────────────────────────
  # Sync belongs to the data plane: it is the plane that answers decisions that needs the policies,
  # and a control plane has nothing to mirror. Each followed ledger becomes its own directory under
  # <working_dir>/mirrors/<zone-id>/<ledger-id>, and they are all kept current at once.
  #
  # A plane fed by other means — a sidecar running `permguard pull`, a baked image, a mounted
  # volume — leaves this out entirely and serves whatever its volume holds.
  #
  # The server URL is exact: it is who you trust, whose certificate you check, whose ring signs what
  # you accept. Zones and ledgers are patterns, matched against what the server actually lists, so a
  # ledger created tomorrow is followed without touching this file. A pattern describes a whole name:
  # `main` follows the ledger `main`, never `main-staging`. Naming NEITHER zones NOR ledgers means
  # everything that server lists — the URL alone is "mirror it all".
  # mirrors:
  #   enabled: "true"
  #   interval: "30s"        # how often a round STARTS; a tick that finds the previous one working is skipped
  #   timeout: "2m"          # per ledger: one that exceeds it is abandoned for this round, not forever
  #   parallelism: "4"       # how many ledgers are mirrored at once
  #   jitter: "0.1"          # each round waits interval ± (interval × jitter)/2, drawn again
  #                          # every round — so replicas do not wake together, and do not re-align
  #   stale_after: "0s"      # how old the last verified sync may grow before this plane alarms;
  #                          # "0s" or absent: no bound. Still served — the alarm is the point.
  #   expire_after: "0s"     # how old it may grow before this plane refuses to answer from the
  #                          # mirror (503). A revocation that matters makes "indefinitely" wrong;
  #                          # a flaky link makes "minutes" wrong — this is the deployment's number.
  #   servers:
  #     - url: "http://control-plane:6443"    # everything this server lists: no zones, no ledgers
  #     - url: "https://control.acme.com"     # narrowed, and reached over TLS
  #       zones: ["acme-.*"]                  # absent means every zone the server lists
  #       ledgers: ["main-ledger", "prod"]    # absent means every ledger of a matching zone
  #       required: false                     # followed, but readiness never waits for it; absent means it does
  #       tls:
  #         ca_file: tls/control-plane-ca.pem   # the authority its certificate is checked against;
  #                                             # absent means the platform trust store
  #     - url: "grpcs://control.internal:6443"  # the same NOTP transfer, over gRPC
  #       zones: ["eu", "us"]                   # several patterns are alternatives
  #       tls:
  #         ca_file: tls/control-plane-ca.pem
  #         cert: tls/control-plane-client.pem  # our own certificate, where the server asks for one
  #         key: tls/control-plane-client.key   # mutual TLS: material or not, there is no `mtls` flag
  #         server_name: control-plane          # check the certificate against the name it carries,
  #                                             # when this plane dials it by another address
  #
  # There is deliberately no "skip verification" here: a plane that accepts any certificate is a
  # plane whose policies come from whoever answers the port, and nobody is watching this one.

  # ── What the decision path may spend ─────────────────────────────────────────────────────────
  # A check is answered out of memory: the ledger's policies are read from the volume once,
  # compiled into the engine's own program (and, where a partition declares a schema, checked
  # against it), and kept. That is what makes a decision take microseconds instead of a disk seek.
  #
  # Two bounds decide how much is kept — whichever is reached first, the least recently used
  # compiled partition is dropped and rebuilt the next time somebody asks for it. Raise them for a
  # plane that serves many ledgers or large policy sets; the defaults fit a small container.
  #
  # The commit is part of the cache key, so a synchronization that advances a ledger needs no flush
  # and a replaced commit is never served.
  # decisions:
  #   cache:
  #     partitions: "64"       # compiled partitions held at once (one ledger contributes one per partition)
  #     bytes: "256M"          # what they may weigh; accepts k/M/G
  #   max_evaluations: "256"   # the most evaluations one boxcarred request may carry

  #   # Every decision, recorded where it can be kept, proven and consumed. Off by default: a
  #   # decision log is a security control and a data-protection surface at once, and neither is
  #   # switched on for a deployment that did not ask for it.
  #   log:
  #     enabled: "true"
  #
  #     # Where a version 1 spool left by an earlier release is shipped until it is empty: since
  #     # WP-6.1 new records go over the membership's `decisions.ship` task, never here. Described
  #     # exactly like a mirror source: a server this plane authenticates before it speaks to it.
  #     server:
  #       url: "grpcs://control.acme.com:6443"     # exact: this is who you trust
  #       tls:
  #         ca_file: tls/control-plane-ca.pem      # absent: the platform trust store
  #         cert: tls/decision-log-client.pem      # its own identity, deliberately not the mirror's:
  #         key: tls/decision-log-client.key       # *may ship decision logs* and *may read policy*
  #                                                # are two authorizations, and a deployment should
  #                                                # be able to grant one without the other
  #         server_name: control-plane             # when the address is not the name
  #
  #     # The bounds of what the Host's stream holds unacknowledged by the required subscriptions:
  #     # past either, decisions are refused `unavailable`, so a coordinator outage costs disk up
  #     # to a bound, never an unrecorded answer.
  #     spool:
  #       directory: "data/decisions/spool"       # a legacy version 1 spool, and the zone key witness
  #       bytes: "512M"                # unacknowledged record bytes
  #       age: "24h"                   # how old the oldest unacknowledged batch may be
  #
  #     # Latency against efficiency: whichever comes first.
  #     batch: { bytes: "256k", interval: "1s" }
  #
  #     # What the log promises before an answer (WP-6.1):
  #     #   required  every answered decision has a durable record; one that cannot be recorded is
  #     #             refused `unavailable` (the default when the log is on)
  #     #   disabled  no record is promised
  #     mode: "required"
  #
  #     # What is written. Denies and errors are never sampled, whatever this says: a log that drops
  #     # refusals is not an audit trail.
  #     sample: { permits: "1.0" }
  #
  #     # Caller-supplied attributes may carry personal data, so they are off by default and named
  #     # one at a time. An allow-list, never a deny-list: a field added to a request tomorrow must
  #     # not start being recorded by itself. Their keyed commitments are always recorded, which
  #     # proves what the decision saw without keeping it.
  #     # The secret input commitments are taken under. Required when the log is on, and a
  #     # *different* key from the pseudonymisation one: they protect different things, and
  #     # rotating one to crypto-shred pseudonyms must not invalidate every commitment with it.
  #     # A commitment keyed by anything public — a hostname, this plane's own name — is a bare
  #     # digest, and a bare digest of `department=HR` is a dictionary away from `HR`.
  #     commitment:
  #       key_ref: decision-commitment      # in the secret store this deployment composes
  #       key_version: "v1"                 # recorded in every marker, so rotation is legible
  #     include:
  #       subject_properties: ["department"]
  #       resource_properties: []
  #       context: ["ip", "time"]

  # ── The temporal interface, and the history it decides against ───────────────────────────────
  # `permguard.api.pdp.temporal.v1alpha1`: an occurrence is recorded into a durable history and
  # decided against it. Off by default — a plane that keeps a durable history should be a plane
  # somebody chose to run — and gated a second time by `experimental.dogwood.enabled` below,
  # because the runtime that uses it is `v1alpha1`.
  #
  # There is deliberately no `on_full` here, unlike the decision log. A decision record dropped is
  # evidence lost; an event record dropped changes what *future* authorizations mean, because the
  # journal is also the history the policies read. So a journal that cannot accept fails the
  # submission closed, and there is nothing for a deployment to choose.
  # events:
  #   enabled: "true"
  #   # the stream is named by the Host's `host_id` and run: no producer id is configured
  #   directory: data/events         # under the working directory
  #
  #   stream:
  #     max_bytes: "10G"             # EVENT RECORDS ONLY; the reserve is kept outside this bound
  #     segment_bytes: "32M"         # when a segment is closed and a new one started
  #     max_record_bytes: "1M"       # the largest single record this journal accepts
  #     group_commit_max_delay: "5ms"  # a latency budget, never a durability one: a receipt is
  #                                    # still withheld until the record is on disk. What this buys
  #                                    # is that ten submissions arriving together cost one flush.
  #
  #   warm:                          # what warm temporal histories may hold, in bytes (TL-5):
  #     bytes: "256M"                # the Host's, across every zone
  #     zone_bytes: "64M"            # one zone's; defaults to a quarter of the Host's
  #     partition_bytes: "64M"       # one compiled partition's; the coldest history goes first,
  #                                  # and an evicted one is replayed from the journal
  #
  #   replay:                        # the plan of one cold history's replay; past any limit the
  #                                  # partition answers E `evaluation_deadline_exceeded`
  #     max_records: "100000"        # the most records one replay reads
  #     max_bytes: "64M"             # the most bytes one replay feeds an engine
  #     timeout: "2s"                # how long one submission's replay may run
  #     concurrency: "4"             # cold replays at once; another is turned away at once
  #     prewarm: "0"                 # recently used histories of each ledger replayed after
  #                                  # load, in the background; 0 is off
  #
  #   retention:
  #     minimum: "48h"               # a FLOOR, not the answer: the requirement is this plus what
  #                                  # the loaded policies' longest `max_window` asks for, and a
  #                                  # configuration shorter than that is refused at startup rather
  #                                  # than quietly emptying the windows a policy looks in
  #     allowed_lateness: "5m"       # how late an occurrence may arrive and still be recorded
  #     clock_skew: "30s"            # how far a caller's clock may run ahead of this one
  #
  #   # Where records are shipped. Absent, the decision log's destination is used — one deployment
  #   # ships both to one control plane, and naming it twice is two settings to keep in step.
  #   destination:
  #     url: "grpcs://control.acme.com:6443"
  #     transport: grpc              # absent: the URL's own scheme decides
  #     tls:
  #       ca_file: tls/control-plane-ca.pem
  #
  #   # Whether this plane also READS history other planes recorded.
  #   #
  #   # `local` is the default and it is not a lesser mode: it means a decision ranges over what
  #   # this plane recorded, which is exactly reproducible. A shared mode ranges over what had
  #   # *arrived*, which is a different answer to the same request — so it is an explicit choice,
  #   # and the mode and watermark travel in every response and every decision record.
  #   #
  #   #   local            only this plane's events
  #   #   shared-eventual  also whatever imported history has arrived, at the local watermark
  #   #   shared-bounded   as above, and decision events fail closed when it is older than
  #   #                    `max_staleness` — the mode for "decide only on history I can vouch for"
  #   pull:
  #     mode: local
  #     interval: "2s"               # accepted and inert since the Host imports (WP-6.2c2b2)
  #     max_staleness: "10s"         # required in practice by shared-bounded
  #     ledgers:
  #       - zone: acme
  #         ledger: agent-governance
  #         event_types: [permguard.dogwood.event.v1]   # accepted and inert: the whole ledger is imported

# public:
#   disclose_build: "true"     # "false": /version stops naming the version and commit
#   error_detail: "minimal"    # how much an error says about the inside: "full" or "minimal".
#                              # Unset, development_mode decides — minimal everywhere real.

# What one surface — and one client — may spend. Every value has a bounded default; this block exists
# to move them, not to enable them.
# limits:
#   connections: "1024"             # sockets one surface holds at once
#   connections_per_peer: "256"     # sockets one address may hold; "0" disables the per-address bound
#   peer_exempt:                    # addresses exempt from the per-address bound (never from the pool)
#     - 10.0.0.0/8                  #   e.g. the load balancer, the health checker
#   concurrent_requests: "256"      # requests in flight at once; beyond it, 503 rather than a queue
#   request_timeout: "30s"          # how long one request may take
#   handshake_timeout: "10s"        # how long a client has to finish a TLS handshake
#   header_timeout: "10s"           # how long a client has to send a complete request head
#   body_bytes: "1M"                # bytes one request body may carry
#   connection_lifetime: "0s"       # how long one connection may exist; "0s" leaves it unbounded
#   write_stall_timeout: "30s"      # a response making no progress: the client stopped reading

# The NOTP transfer bounds of the git-like store this plane serves. Every value has a safe
# default; sizes accept k/M/G suffixes. The batch limit must exceed the largest legal object
# (5M) plus framing, and any gRPC message limit in front must be configured above it.
# notp:
#   compression: "deflate"      # wire compression of batches: "deflate" (default) or "none"
#   max_batch_bytes: "8M"       # upper bound of one upload/fetch batch, advertised per negotiate
#   max_batch_objects: "1000"   # most objects one batch may carry
#   max_push_objects: "10000"   # most objects one push delta may declare (preflight + at commit)
#   max_push_bytes: "64M"       # most bytes one push delta may declare
#   ledger_quota_bytes: "1G"    # storage quota of one ledger's objects, reserved at negotiate
#   transfer_ttl: "15m"         # how long a transfer session stays open; at most 1h

operations:
  keys:
    enabled: true
    publish_ahead: 1h
    rotate_every: 30d
    retain: 365d
  secrets:
    provider: directory        # one file per secret under <working_dir>/operations/secrets —
                               # what a mounted Kubernetes Secret looks like. The keys named
                               # below (audit-pseudonym, decision-commitment, …) must exist
                               # there before a production plane will start.
  audit:
    sink: file
    retention: 90d
    # refusals: "false"      # "true": denied operations (name taken, not found, invalid name) are
    #                        # recorded on the trail as <operation>.refused — for a compliance
    #                        # regime that wants denied attempts on the record. Internal faults
    #                        # never reach the trail: they are ours, and live in the log.
    #                        #
    #                        # Leave it off on an unauthenticated surface: the refusal rate is the
    #                        # attacker's to choose, and each refusal is a synchronous write into
    #                        # the evidentiary record. Turn it on only behind authenticated callers
    #                        # (tls.allow) or an ingress that limits the rate. Anonymous refusals
    #                        # belong in the metrics, which cannot be inflated into gigabytes.
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"
