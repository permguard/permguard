[package]
name = "permguard-all-in-one"
description = "Permguard all-in-one runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag. A crate
# here is a compilation unit of that product, not something to depend on from outside it — and a name
# taken on crates.io is taken permanently.
publish = false

[[bin]]
name = "permguard-all-in-one"
path = "src/main.rs"

[dependencies]
permguard-authority-plane-server = { workspace = true, features = ["bin"] }
permguard-control-plane-server = { workspace = true, features = ["bin"] }
permguard-core.workspace = true
# The server kit with what a Permguard binary owns: its command line, its process's signals,
# the Authority Plane's client, the OTLP exporter and the remote custodies.
permguard-server = { workspace = true, features = ["cli", "signals", "authority-refresh", "otel", "kms"] }
# The postgresql-s3 backend's adapter (iteration 03, WP-28.1): served when the Data Plane is not.
permguard-s3 = { workspace = true, features = ["backend"] }
permguard-data-plane-server = { workspace = true, features = ["bin"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }

# The allocator that returns idle memory to the system after a burst (BUG-0056).
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
# Transport parity (owner decision of 2026-11-15): every plane's documents read through the client
# library's facade, over REST and over gRPC.
permguard-client = { workspace = true, features = ["full"] }
zeroize.workspace = true
# The baseline volume's recovery (WP-7.7): the example requests and answers read as JSON, and the
# evaluation path the Data Plane serves them at.
permguard-languages = { workspace = true, features = ["cedar", "dogwood", "rego"] }
serde_json.workspace = true
# The secret canaries (TS-5): the recovery key's fingerprint, the secret type, and the base64 forms
# a canary is searched in.
base64.workspace = true
permguard-core.workspace = true
permguard-host = { workspace = true, features = ["test-support"] }
