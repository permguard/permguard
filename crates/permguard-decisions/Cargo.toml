[package]
name = "permguard-decisions"
description = "What a decision record is: RFC 8785 canonical JSON, record digests, the producer hash chain, signed batch envelopes with Merkle roots. The durable spool and the Host stream registration are features. Shared by the data plane that writes them, the control plane that keeps them and the CLI that verifies them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

[dependencies]
# The record is JSON on the wire and JSON at rest: one representation, and the
# canonicalisation below is defined over it.
serde.workspace = true
serde_json.workspace = true
# The same hashing the object model uses, so a verifier links one library.
sha2.workspace = true
hmac.workspace = true
# JWS is base64url all the way down, and Ed25519 verification comes from the
# one cryptographic backend this workspace already links.
base64.workspace = true
ring.workspace = true
# Canonical JSON and the Merkle tree a batch is committed with.
permguard-canonical.workspace = true
permguard-core.workspace = true
# The JWS framing a batch is signed with and the key selection it is verified with.
permguard-objects.workspace = true
# The storage library: every temporary, rename, flush and torn-tail cut goes through it (WP-1.11),
# and the typed signer a Plane holds. A runtime's, never the model's.
permguard-host = { workspace = true, optional = true }
# The Host stream engine, for the two halves that are a runtime and not the model: the spool reads
# the stream's signers, and the registration names the engine's descriptor and codec.
permguard-stream = { workspace = true, optional = true }
# The decision point whose answer a record's is built from; with no feature of its own, so no
# language, no engine and no thread.
permguard-evaluator = { workspace = true, optional = true }

[features]
# The normative model, record, chain, envelope, commitment and ceiling, is always built and needs
# none of these: a verifier links it alone.
#
# The durable local record a producer keeps, and the legacy archive read at a migration.
storage = ["dep:permguard-host", "dep:permguard-stream"]
# The record's answer from an evaluator's: the one mapping a Data Plane records with.
evaluator = ["dep:permguard-evaluator"]
# The decision log as the Host's stream engine registers it: its name, descriptor and codec.
stream = ["dep:permguard-host", "dep:permguard-stream"]

[dev-dependencies]
# A real key ring, so signing and verification are exercised end to end rather
# than against a stub that agrees with itself.
permguard-std = { workspace = true, features = ["keys"] }
# The tests exercise the storage and the registration with the model.
permguard-decisions = { path = ".", features = ["storage", "stream", "evaluator"] }
proptest.workspace = true
