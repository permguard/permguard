[package]
name = "permguard-host"
description = "The Host's own modules, starting with the storage library every subsystem writes its files through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

[features]
# Named crash points in every storage protocol: a process started with `PERMGUARD_CRASH_AT=<point>`
# aborts there, at the pass `PERMGUARD_CRASH_HIT` names. Tests only; a release build never carries
# the check.
crash-points = []
# A test Authority Plane minting signed tokens and lists (`authz::testing`), for the tests of
# every crate that authorizes a token. Tests only.
test-support = []

[dependencies]
permguard-core.workspace = true
# The canonical CBOR of the bootstrap commitment (`authz`).
permguard-objects.workspace = true
# The compact JWS of an access token and of a status list (`authz`); the Host API's documents and
# the replay journal's frames (`api`).
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
# What the Host records as it starts and serves.
tracing.workspace = true
# The OS CSPRNG, for the volume identity (`storage::volume`); the access tokens' and status lists'
# signatures (`authz`).
ring.workspace = true
sha2.workspace = true
# The secret handle's HMAC, computed inside the Host, and the key wiped when it is dropped
# (`composition`).
hmac.workspace = true
zeroize.workspace = true

# Directory-relative, no-follow opens and directory flushes (`storage::dir`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[[test]]
name = "crash_points"
required-features = ["crash-points"]

[dev-dependencies]
# The audit handle and the Host API mutations are async (`composition` and `api` tests).
tokio = { workspace = true, features = ["macros", "rt"] }

# TS-9: what token verification adds to a decision, against its budget.
[[bench]]
name = "token_verify"
path = "benches/token_verify.rs"
harness = false
