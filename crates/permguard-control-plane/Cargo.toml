[package]
name = "permguard-control-plane"
description = "The Permguard control plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag. A crate
# here is a compilation unit of that product, not something to depend on from outside it — and a name
# taken on crates.io is taken permanently.
publish = false

[dependencies]
# The cursor keys derived from the store's root, erased on drop (WP-3.3).
zeroize.workspace = true
anyhow.workspace = true
base64.workspace = true
permguard-core.workspace = true
# What a decision record is: the canonical bytes, the chain, the signed envelope.
permguard-decisions = { workspace = true, features = ["stream"] }
# The bounded stream-window contract both evidence stores are read through.
# The event record, chain and signed batch contract this store keeps.
permguard-events = { workspace = true, features = ["stream"] }
permguard-host.workspace = true
# The stores of the second backend that live with the Control Plane: its cursor roots.
permguard-postgres.workspace = true
permguard-stream.workspace = true
# The randomness a fresh offset-signing key is minted from.
ring.workspace = true
# Every language, validating: ingest checks what a push carries and evaluates nothing.
permguard-languages = { workspace = true, features = ["cedar", "dogwood", "rego"] }
permguard-notp.workspace = true
permguard-objects.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[features]
# The storage library's named crash points, for the crash test of a push (WP-7.12).
crash-points = ["permguard-host/crash-points"]
# The conformance suites of the store contracts, for the tests of every backend. Tests only.
test-support = []

[[test]]
name = "archive_crash"
required-features = ["crash-points"]

[[test]]
name = "catalog_crash"
required-features = ["crash-points"]

[[test]]
name = "cursor_crash"
required-features = ["crash-points"]

[[test]]
name = "push_crash"
required-features = ["crash-points"]

[dev-dependencies]
permguard-host = { workspace = true, features = ["test-support"] }
permguard-postgres = { workspace = true, features = ["test-support"] }
# The stores of the second backend, for the push and pull scenarios run on it.
permguard-s3 = { workspace = true, features = ["test-support", "control-plane"] }
# Decoding an offset token, to prove that editing one is refused.
base64.workspace = true
# The producer half, so the shipping contract is exercised end to end rather
# than against a stub that agrees with itself.
permguard-client = { workspace = true, features = ["http", "grpc", "catalog", "notp"] }
# Transport parity, fault injection and the boundary registry, shared by every plane.
permguard-conformance.workspace = true
permguard-data-plane = { workspace = true, features = ["sync", "decision-evidence", "event-evidence"] }
ring.workspace = true
# The file catalog and the key manager the tests compose stores and Host handles with.
permguard-std = { workspace = true, features = ["catalog", "keys"] }
