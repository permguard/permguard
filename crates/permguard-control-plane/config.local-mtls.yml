# Mutual TLS on the Control Plane role port. HTTP and gRPC share one listener and therefore one
# client-authentication policy; the transport does not invent a second port for the same role.
development_mode: true
autogenerate: true
working_dir: .volume/control-plane-mtls

log:
  level: debug
  format: terminal

public:
  tls:
    cert: tls/server.pem
    key: tls/server.key

# Contracts this build carries whose wire and replication shapes have not yet proven stable.
# A block rather than scattered flags, so what is provisional is visible in one place.
experimental:
  dogwood:
    # Serve ledgers that name the `dogwood` runtime, and the interfaces built on it.
    #
    # Written out rather than left to the default, so what a deployment has accepted is readable
    # from the file rather than inferred from silence.
    #
    # The language is compiled in either way — a language is a build, not a deployment action — so
    # what this gates is whether a ledger naming it will be SERVED. A manifest that names it on a
    # plane which has not turned this on is refused at load, by name, rather than served and found
    # to behave differently after an upgrade.
    #
    # It is also the second half of the gate on the event interfaces: the temporal PDP interface
    # and the control plane's event store need this AND their own `events.enabled`, and a plane
    # that has said one of the two and not the other refuses to start rather than running with an
    # interface nobody can reach.
    enabled: "false"

host:
  addr: 127.0.0.1:5443
  # Server authentication only. A scraper is not a Permguard client, and a metrics endpoint that
  # demands a certificate is a metrics endpoint nothing scrapes.
  tls:
    cert: tls/server.pem
    key: tls/server.key

controlPlane:
  public:
    http:
      enabled: true
      addr: 127.0.0.1:6443
      tls:
        cert: tls/server.pem
        key: tls/server.key
        client_ca: tls/ca.pem
        crl: tls/ca.crl
        allow:
          - cn:local-operator
    grpc:
      enabled: true
      addr: 127.0.0.1:6443
      tls:
        cert: tls/server.pem
        key: tls/server.key
        client_ca: tls/ca.pem
        crl: tls/ca.crl
        # Of everybody tls/ca.pem signs, this endpoint answers exactly one: the client certificate
        # the runtime generated beside it. Authentication is the handshake; this is authorisation.
        allow:
          - cn:local-operator

  # Reclaiming what nothing references. A laptop cadence, so the loop is watchable; `grace` is at
  # the floor this server accepts — below it, a sweep could delete the uploads of a push in flight.
  storage:
    gc:
      enabled: "true"
      interval: "5m"
      grace: "15m"

  # Where the decisions its data planes answer are kept. Records arrive signed and chained, are
  # stored verbatim so they stay verifiable exactly as they were signed, and are indexed into a
  # physical partition per zone and ledger — a tenant reads a directory that contains only its own.
  decisions:
    enabled: "true"
    directory: "data/decisions/store"
    retention: "7d"

  # ── The event store ──────────────────────────────────────────────────────────────────────────
  # The receiving end of a data plane's `events` block, and the only supported remote source for
  # reading events back: a data plane's journal is a shipping buffer, so a read there would answer
  # differently depending on which plane it reached.
  #
  # Off by default, like the decision store: a plane that receives nothing should not create one,
  # and a deployment that has not decided its retention should not be given one by accident.
  # events:
  #   enabled: "true"
  #   directory: data/events/store   # under the working directory
  #   retention: "90d"               # how long a tenant's events are kept before sealed segments
  #                                  # are dropped. Whole segments only — a row removed from the
  #                                  # middle would leave a chain with a hole in it, while a
  #                                  # segment that has left is a gap a reader is told about.
  #                                  # Envelopes and the archived verification keys that prove
  #                                  # retained records are never dropped with them.
  #   producer_keys:                 # required: key material plus producer/tenant authority
  #     - path: trust/data-plane-events.jwks
  #       producer: data-plane-eu-1
  #       zone: "*"                  # `*` is allowed for zone/ledger, never for producer
  #       ledger: "*"

operations:
  keys:
    enabled: true
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    provider: directory
  audit:
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"
