# Mutual TLS, as far as it goes: TLS on HTTP, mutual TLS on gRPC.
#
# The split is deliberate and it is not a limitation of the listener. HTTP here is what a browser, a
# curl and a probe reach, and demanding a client certificate from those turns every operator into a
# certificate holder. gRPC is what a Permguard SDK reaches — a service talking to a service, which is
# exactly the caller a client certificate can identify.
#
# Because the two protocols now carry different TLS policies, they need different addresses: an
# address serves one policy.
development_mode: true
autogenerate: true
working_dir: .volume/control-plane-mtls

log:
  level: debug
  format: terminal

public:
  tls:
    cert: tls/server.pem
    key: tls/server.key

telemetry:
  addr: 127.0.0.1:7558
  # Server authentication only. A scraper is not a Permguard client, and a metrics endpoint that
  # demands a certificate is a metrics endpoint nothing scrapes.
  tls:
    cert: tls/server.pem
    key: tls/server.key

controlPlane:
  public:
    http:
      enabled: true
      addr: 127.0.0.1:7556
      tls:
        cert: tls/server.pem
        key: tls/server.key
    grpc:
      enabled: true
      addr: 127.0.0.1:7557
      tls:
        cert: tls/server.pem
        key: tls/server.key
        client_ca: tls/ca.pem
        crl: tls/ca.crl
        # Of everybody tls/ca.pem signs, this endpoint answers exactly one: the client certificate
        # the runtime generated beside it. Authentication is the handshake; this is authorisation.
        allow:
          - cn:local-operator

  # Reclaiming what nothing references. A laptop cadence, so the loop is watchable; `grace` is at
  # the floor this server accepts — below it, a sweep could delete the uploads of a push in flight.
  storage:
    gc:
      enabled: "true"
      interval: "5m"
      grace: "15m"

  # Where the decisions its data planes answer are kept. Records arrive signed and chained, are
  # stored verbatim so they stay verifiable exactly as they were signed, and are indexed into a
  # physical partition per zone and ledger — a tenant reads a directory that contains only its own.
  decisions:
    enabled: "true"
    directory: "data/decisions/store"
    retention: "7d"

operations:
  keys:
    enabled: true
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    provider: directory
  audit:
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"
