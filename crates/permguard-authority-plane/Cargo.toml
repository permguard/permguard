[package]
name = "permguard-authority-plane"
description = "The Permguard authority plane: service accounts, access keys and the tokens every Plane verifies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag. A crate
# here is a compilation unit of that product, not something to depend on from outside it — and a name
# taken on crates.io is taken permanently.
publish = false

# The gRPC contract this plane serves, compiled from the checked-in `contracts/proto/`.
build = "build.rs"

[dependencies]
anyhow.workspace = true
# Secret keys kept as Argon2id hashes, never in the clear.
argon2.workspace = true
axum.workspace = true
base64.workspace = true
permguard-core.workspace = true
permguard-host.workspace = true
# The canonical CBOR of the accounts journal and the token registry.
permguard-objects.workspace = true
permguard-server.workspace = true
# The actor a request carries, read where a route authorizes.
permguard-transport.workspace = true
prost.workspace = true
# The OS CSPRNG: access keys, secret keys, salts, token ids and list entries.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
permguard-host = { workspace = true, features = ["test-support"] }
http.workspace = true
http-body-util.workspace = true
tower.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
