# The Authority Plane on its own, with TLS on every surface: what a token issuer runs anywhere
# but the loopback, since an access key or a token sent in clear off the loopback is refused.
development_mode: true
autogenerate: true

# A developer's machine: every relaxation this file amounts to is permitted and published
# (WP-2.8). A deployment serving real decisions states nothing here, which means `production`.
assurance:
  profile: development

working_dir: .volume/authority-plane-tls

log:
  level: debug
  format: terminal

public:
  tls:
    cert: tls/server.pem
    key: tls/server.key

# Contracts this build carries whose wire and replication shapes have not yet proven stable.
# A block rather than scattered flags, so what is provisional is visible in one place.
experimental:
  dogwood:
    # The Authority Plane serves no ledger, so nothing here is served either way; it is written
    # out, as in every shipped configuration, so what a deployment has accepted is readable from
    # the file rather than inferred from silence.
    enabled: "false"

host:
  addr: 127.0.0.1:5443
  tls:
    cert: tls/server.pem
    key: tls/server.key

runtime:
  planes:
    - authority

# The issuer every token names (`2-security/8`): this listener's URL, as every Server of the
# cluster reaches it and states it in its own `authority.url`, checked against this listener's
# certificate authority. The Server verifies the tokens its closed routes take under the keys and
# status lists handed over in-process.
authority:
  url: "https://127.0.0.1:8443"

# The Authority Plane: service accounts, their access keys and scopes, and the token endpoint.
# Its first start makes `admin`, its access key and secret key in planes/authority/admin.key on
# the volume, readable by the volume's owner alone: move them somewhere safe and delete the file.
authorityPlane:
  public:
    http:
      enabled: true
      addr: 127.0.0.1:8443
      tls:
        cert: tls/server.pem
        key: tls/server.key
    grpc:
      enabled: true
      addr: 127.0.0.1:8443
      tls:
        cert: tls/server.pem
        key: tls/server.key

operations:
  keys:
    enabled: true
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    provider: directory
    # The root the per-zone keys derive from: decision input tags and pseudonyms (WP-3.3).
    coordinator_root_ref: zone-root
  audit:
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"
