[package]
name = "permguard-language-rego"
description = "Rego for Permguard, through Microsoft's regorus interpreter: validation, policy extraction, alias markers, schemas and evaluation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The engine's identity, read out of the workspace `Cargo.lock`: one script for every engine package.
build = "../permguard-language-core/build/locked.rs"

# Not a library: this workspace is one product, released as binaries and images from one tag.
publish = false

# The evaluating half, off unless asked for: a build that only validates, as the Control Plane's
# ingest does, compiles no evaluator. It implements the contract of `permguard-language-core`, and
# needs the kernel that runs it for nothing.
[features]
evaluate = []

[dependencies]
permguard-core.workspace = true
permguard-language-core.workspace = true
# Pinned in the workspace manifest, with the reasons; its features are this package's `ENGINE_FEATURES`.
regorus.workspace = true
# The Rego partition schema: JSON Schema, compiled once at load. Already in this
# workspace's graph — regorus carries it — so it is a direct dependency of the
# crate that actually validates with it rather than a transitive accident. Part of the runtime,
# so the build script digests it with the engine.
jsonschema = { version = "0.59", default-features = false }
serde_json.workspace = true
serde_norway.workspace = true

# The build script digests the engine's locked dependency closure.
[build-dependencies]
sha2.workspace = true
