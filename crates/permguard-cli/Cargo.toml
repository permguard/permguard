[package]
name = "permguard-cli"
description = "The Permguard command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A library and a binary: `permguard` is the library plus its arguments and its output, and Permguard
# Admin embeds the library from the same repository and tag. Not published: this workspace is one
# product, released as binaries and images from one tag, and a name taken on crates.io is taken
# permanently.
publish = false


[[bin]]
name = "permguard"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
permguard-core.workspace = true
# The offline `authority admin-key`: the Authority Plane's accounts on a stopped server's volume.
permguard-authority-plane.workspace = true
# The grant store of a volume, worked on offline by `host grants` (WP-2.4).
permguard-host.workspace = true
# The object trees the Control Plane declares, which `restore` scans as `volume verify` does (WP-7.9).
permguard-control-plane.workspace = true
# The record, the chain and the signature — so `--verify` checks what the
# planes compute, with the same code rather than a second implementation.
permguard-decisions = { workspace = true, features = ["stream"] }
# The event record and its chain, for `permguard events --verify`.
permguard-events = { workspace = true, features = ["stream"] }
permguard-client = { workspace = true, features = ["full"] }
permguard-notp.workspace = true
permguard-objects.workspace = true
# Offline volume administration, the same code the server runs: no server, no listener.
permguard-offline = { workspace = true, features = ["cli", "kms"] }
# The evaluating half: this package decides.
permguard-languages = { workspace = true, features = ["cedar", "dogwood", "rego", "evaluate"] }
permguard-stream.workspace = true
# Reads a PEM public key or certificate, and names the client's token cache (TC-6, TC-7).
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
# A secret key, wiped from memory once dropped.
zeroize.workspace = true
toml = "1.1"

[target.'cfg(unix)'.dependencies]
# A password typed at a terminal is read with echo off (WP-8.1).
rustix = { workspace = true, features = ["termios"] }

[features]
# The `pkcs11` custody of the offline `host` commands: the server's, behind the same feature.
pkcs11 = ["permguard-server/pkcs11"]

[dev-dependencies]
# The tests stand real listeners and a real Host API to drive the command line against.
permguard-server = { workspace = true, features = ["cli", "signals", "authority-refresh", "otel", "kms"] }
permguard-transport.workspace = true
# The server stubs of the contracts, for the tests that stand a fake server on them.
permguard-contracts = { workspace = true, features = ["control-server", "data-server", "host-server", "authority-server"] }
permguard-host = { workspace = true, features = ["test-support"] }
# The Authority Plane's module, composed by the Authority Plane test as a binary composes it.
permguard-authority-plane-server = { workspace = true, features = ["bin"] }
# The storage and audit sink of the Server context the Authority Plane test composes.
permguard-std = { workspace = true, features = ["audit", "storage"] }
# The fake plane of the transports test: REST and gRPC on one TLS port (TC-1).
axum.workspace = true
tokio.workspace = true
tonic.workspace = true
base64.workspace = true
rcgen.workspace = true
