metadata:
  kind: policy
  name: legacy-workspace
runtimes:
  cedar:
    language: { name: cedar, constraint: ">=4.0.0" }
    engine:   { name: permguard, constraint: ">=0.1.0 <0.2.0" }
partitions:
  cedar: { runtime: cedar, schema: false }
profiles:
  default: { type: permguard.api.pdp.native.v1, partitions: [cedar] }
