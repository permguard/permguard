[package]
name = "permguard-conformance"
description = "The conformance harness: transport parity, fault injection and the untrusted-boundary registry, for tests only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A test harness, never a dependency of a shipped crate: only `[dev-dependencies]` name it.
publish = false

# The Host API stub of `contracts/proto/`, compiled so it stays valid protobuf; nothing serves it.
build = "build.rs"

[dependencies]
axum.workspace = true
permguard-control-client.workspace = true
permguard-core.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt"] }
tonic.workspace = true
tonic-prost.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
permguard-decisions.workspace = true
permguard-events.workspace = true
permguard-host.workspace = true
permguard-notp.workspace = true
permguard-objects.workspace = true
