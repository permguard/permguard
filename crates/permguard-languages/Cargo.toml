[package]
name = "permguard-languages"
description = "The catalogue of built-in policy languages a build carries — Cedar, Rego and Dogwood, each a feature — and every rule asked of all of them: lookups, manifest gates, startup checks, descriptors and the supervised worker. Compiled in, never loaded."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

# The languages a build carries: each feature links one engine package, and a build without it does
# not link that engine at all. All three by default, which is what every binary of this workspace
# ships; a narrower build is a deliberate choice of the application that embeds the catalogue.
[features]
default = ["cedar", "dogwood", "rego"]
cedar = ["dep:permguard-language-cedar"]
dogwood = ["dep:permguard-language-dogwood"]
rego = ["dep:permguard-language-rego"]
# The evaluating half of every carried language, the routing, the evaluation path and the
# supervised worker: what a decision point needs and a build that only validates does not.
evaluate = [
    "dep:permguard-pdp-core",
    "permguard-language-cedar?/evaluate",
    "permguard-language-rego?/evaluate",
]

[dependencies]
permguard-core.workspace = true
# The model a language plugs into: manifest runtimes for the load gate, and the
# manifest's own validation. One direction only — the model knows no language.
permguard-objects.workspace = true
# What a language is, and the shared evaluation path, without any language in it.
permguard-language-core.workspace = true
permguard-language-cedar = { workspace = true, optional = true }
permguard-language-dogwood = { workspace = true, optional = true }
permguard-language-rego = { workspace = true, optional = true }
permguard-pdp-core = { workspace = true, optional = true }
# The supervised worker's frame digests and the descriptor cache.
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
# The authored manifest file.
serde_norway.workspace = true

# `setrlimit` and the protocol descriptor for the supervised worker (`worker.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The suites drive the engines' own crates beside the catalogue — the corpora, the parity checks,
# the independent lock reader — and the events and stream crates their vectors are built with.
[dev-dependencies]
cedar-policy.workspace = true
dogwood-language.workspace = true
permguard-events.workspace = true
permguard-stream.workspace = true
regorus.workspace = true

# The suites are written for the full catalogue, evaluating: every one of them names a language of
# each kind.
[[test]]
name = "algebra_vectors"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "cedar_corpus"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "descriptor_vectors"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "dogwood_parity"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "engine_features"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "footprint"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "gate_evidence"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "language_vectors"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "opa_corpus"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

[[test]]
name = "warm_footprint"
required-features = ["cedar", "dogwood", "evaluate", "rego"]

# Its own worker: started with the worker argument it serves frames, started plainly it supervises
# itself — which the test harness, parsing every argument as a filter, cannot allow.
[[test]]
name = "worker"
harness = false
required-features = ["cedar", "dogwood", "evaluate", "rego"]

# Rego in its supervised worker, against the real runtime catalogue: the same two lives.
[[test]]
name = "rego_supervised"
harness = false
required-features = ["cedar", "dogwood", "evaluate", "rego"]
