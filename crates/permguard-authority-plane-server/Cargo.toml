[package]
name = "permguard-authority-plane-server"
description = "The Permguard authority plane served: its HTTP and gRPC routes, its module and its binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag.
publish = false

# The gRPC contract this plane serves, compiled from the checked-in `contracts/proto/`.

# The Authority Plane on its own: the binary the `authority-plane` image runs (`2-security/8`
# Where it runs). The all-in-one and control-plane binaries register this package's module beside
# their Planes.
[[bin]]
name = "permguard-authority-plane"
path = "src/main.rs"
# The binary documents nothing of its own, and its name is the domain library's.
doc = false
required-features = ["bin"]

[features]
default = ["bin"]
# The Plane's own binary: the kit with what a Permguard program owns, its command line, its
# process's signals, the Authority Plane's client, the OTLP exporter and the remote custodies. On
# by default, so the binary builds as it always did; a composition that registers this Plane's
# module in a server of its own names the package with `default-features = false` and links the
# kit alone.
bin = [
    "permguard-server/cli",
    "permguard-server/signals",
    "permguard-server/authority-refresh",
    "permguard-server/otel",
    "permguard-server/kms",
]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
permguard-authority-plane.workspace = true
permguard-core.workspace = true
permguard-host.workspace = true
# The server kit: this Plane's module is registered with it. What the binary owns beside the kit
# is the `bin` feature's.
permguard-server.workspace = true
# The actor a request carries, read where a route authorizes.
permguard-transport.workspace = true
# The contracts this package speaks, generated once for the workspace.
permguard-contracts = { workspace = true, features = ["authority-server"] }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
permguard-host = { workspace = true, features = ["test-support"] }
http.workspace = true
http-body-util.workspace = true
tower.workspace = true
