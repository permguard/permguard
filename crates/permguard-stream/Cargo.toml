[package]
name = "permguard-stream"
description = "The bounded stream-window contract both evidence stores are read through: an authenticated, filter-bound offset, and the page it returns."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

[features]
# The storage library's named crash points, for the crash test of sealed batches (WP-5.2).
crash-points = ["permguard-host/crash-points"]

[dependencies]
permguard-core.workspace = true
# The storage library: every temporary, rename, flush and torn-tail cut goes through it (WP-1.11).
permguard-host.workspace = true
# CBOR, COSE and digests of the engine's run statements, frames and STATE (WP-5.1).
permguard-objects.workspace = true
# The random source of run ids, as the Host's identity and volume use it.
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
# A fork found at ingest that its membership could not be suspended for is logged (WP-5.3).
tracing.workspace = true

[[test]]
name = "stream_crash"
required-features = ["crash-points"]

[dev-dependencies]
proptest.workspace = true
