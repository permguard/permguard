[package]
name = "permguard-client"
description = "The client of a Permguard control plane: endpoints and trust material, both transports, the zone catalog and the NOTP verbs, and the verified local mirror — pull only. Consumed by the CLI and by the data plane, so the two speak the wire identically."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

publish = false

# Nothing by default: a consumer selects the surfaces it calls and the transports it calls them
# over (`11-refactoring/1-dependencies.md`). A surface is a facade with one answer over either
# transport; a transport that is not compiled in refuses the URLs that name it, by name.
[features]
# Transports. `grpc` brings tonic and the generated client stubs, `http` the REST client.
http = []
grpc = [
    "dep:tonic",
    "dep:prost",
    "dep:prost-types",
    "dep:tonic-prost",
    "dep:permguard-contracts",
    "dep:tokio",
]
# Surfaces.
catalog = []
notp = []
decisions = []
events = ["decisions"]
pdp = []
temporal = []
host = ["permguard-contracts?/host-client"]
authority = ["permguard-contracts?/authority-client"]
documents = ["permguard-contracts?/authority-client"]
# Every surface over both transports: what the command line and Permguard Admin link.
full = [
    "http",
    "grpc",
    "catalog",
    "notp",
    "decisions",
    "events",
    "pdp",
    "temporal",
    "host",
    "authority",
    "documents",
]

[dependencies]
# A secret key, wiped from memory once dropped.
zeroize.workspace = true
permguard-core.workspace = true
# The one definition of what a decision request is. A client that read a payload
# its own way would refuse what the server accepts, or send less than the caller
# wrote — which is the contract differing by transport.
# The batch a shipper sends: one definition, so producer and receiver render it identically.
permguard-events.workspace = true
permguard-host.workspace = true
# The verified local mirror the pull verbs fill.
permguard-mirror.workspace = true
# The request model, its attestation and the temporal wire types: the language contracts, which
# link no engine, so a client compiles no policy language to send a request.
permguard-language-core.workspace = true
permguard-notp.workspace = true
permguard-objects.workspace = true
base64.workspace = true
http.workspace = true
# Signs a client assertion (TC-7).
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"], optional = true }
# The contracts the gRPC transport speaks, generated once for the workspace: the Control and Data
# Plane's always, since the transport checks discovery against them; the Host's and the Authority
# Plane's with their surfaces.
permguard-contracts = { workspace = true, features = ["control-client", "data-client"], optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

[dev-dependencies]
# The server stubs of the contracts, for the tests that stand a fake server on them.
permguard-contracts = { workspace = true, features = ["control-server", "data-server", "host-server", "authority-server"] }
# The tests call every surface over both transports.
permguard-client = { path = ".", features = ["full"] }
permguard-host = { workspace = true, features = ["test-support"] }
# The fake plane the wire tests stand up: a tonic server on an ephemeral port.
async-stream.workspace = true
futures-core.workspace = true
rcgen.workspace = true

