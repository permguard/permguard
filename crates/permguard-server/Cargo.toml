[package]
name = "permguard-server"
description = "The Permguard server host, its service registry, and the command line that drives them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Not a library: this workspace is one product, released as binaries and images from one tag. A crate
# here is a compilation unit of that product, not something to depend on from outside it — and a name
# taken on crates.io is taken permanently.
publish = false
autobenches = false

[dependencies]
# The Host API answers binary members as base64url over REST and as bytes over gRPC (WP-2.2).
base64.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
permguard-core.workspace = true
# The volume's ownership: the claim `serve` takes first, and the `volume claim` command.
permguard-host.workspace = true
# The stream foundation: the composition registers every stream its planes declare,
# so a directory collision is a startup refusal rather than a runtime surprise.
permguard-stream.workspace = true
permguard-std = { workspace = true, features = ["audit", "catalog", "keys", "metrics", "pseudonym", "secrets", "storage", "provision"] }
permguard-telemetry.workspace = true
permguard-transport.workspace = true
# The Host listener's gRPC half, `permguard.host.v1`, compiled by `build.rs` from `contracts/proto`.
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
# The PeerChannel's frames, both ways, as streams (WP-2.3).
futures-core.workspace = true
# The initiator's one connection, handed to the gRPC client as it is (WP-2.3).
hyper-util.workspace = true
# `service_fn`, the connector that hands that connection over once.
tower = { workspace = true, features = ["util"] }
rustls.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
# Discovery documents are types, not hand-written strings: a plane that adds a field to
# its own document composes a value rather than slicing a closing brace off some text.
serde_json.workspace = true
serde_norway.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Distributed tracing: spans leave over OTLP when `telemetry.otel` turns it on.
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
# `start_paused` lets the shutdown-budget test exhaust a thirty second budget instantly.
tokio = { workspace = true, features = ["test-util"] }
# The cross-transport vectors of the Host API: the parity harness and the generated gRPC client.
permguard-conformance.workspace = true
http-body-util.workspace = true
# Two Hosts' listeners and their peers' client certificates, over loopback mutual TLS (WP-2.3).
rcgen.workspace = true

[[bench]]
name = "server_host"
path = "benches/server_host.rs"
harness = false
