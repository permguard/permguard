[package]
name = "permguard-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: the fuzz crate builds with nightly sanitizers and is not a member of the
# repository workspace, which would otherwise claim it.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
permguard-core = { path = "../crates/permguard-core" }
permguard-decisions = { path = "../crates/permguard-decisions" }
permguard-notp = { path = "../crates/permguard-notp" }
permguard-objects = { path = "../crates/permguard-objects" }
permguard-host = { path = "../crates/permguard-host" }
permguard-events = { path = "../crates/permguard-events" }
permguard-stream = { path = "../crates/permguard-stream" }
serde_json = "1"

[[bin]]
name = "cbor_decode"
path = "fuzz_targets/cbor_decode.rs"
test = false
doc = false
bench = false

