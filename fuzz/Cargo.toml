[package]
name = "permguard-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
permguard-decisions = { path = "../crates/permguard-decisions" }
permguard-notp = { path = "../crates/permguard-notp" }
permguard-objects = { path = "../crates/permguard-objects" }
permguard-events = { path = "../crates/permguard-events" }
permguard-stream = { path = "../crates/permguard-stream" }
serde_json = "1"

