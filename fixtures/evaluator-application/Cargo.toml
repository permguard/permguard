# An application that embeds the evaluator alone, as one outside this repository would: its own
# workspace, the evaluator with no default feature, a feature per language it selects and one per
# evidence model it keeps records with. `scripts/check-evaluator-fixture.sh` resolves, builds and
# tests it once per named profile, so nothing the repository's workspace unifies can hide what a
# profile links.
[package]
name = "permguard-evaluator-fixture"
description = "A reference application embedding the Permguard evaluator alone, built outside the workspace once per named profile."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: the repository's would otherwise claim it, and unify its features.
[workspace]

[features]
# A language each, none by default.
cedar = ["permguard-evaluator/cedar"]
rego = ["permguard-evaluator/rego"]
dogwood = ["permguard-evaluator/dogwood"]
# The evidence models, each alone: the record, its chain and its signed batch, and no Host.
decisions = ["dep:permguard-decisions"]
events = ["dep:permguard-events"]

[dependencies]
permguard-evaluator = { path = "../../crates/permguard-evaluator", default-features = false }
# The decision record, with the answer an evaluator's is recorded as.
permguard-decisions = { path = "../../crates/permguard-decisions", default-features = false, features = ["evaluator"], optional = true }
# The event record.
permguard-events = { path = "../../crates/permguard-events", default-features = false, optional = true }
serde_json = "1"

[dev-dependencies]
# A ring the application holds itself: the contract a signer implements, and Ed25519.
permguard-core = { path = "../../crates/permguard-core" }
ring = "0.17"
base64 = "0.23"
