#
# The identity proof of the Compose lab (WP-8.1): a Keycloak with two realms, `ops` and `partners`,
# beside the all-in-one, which takes both as identity providers and signs local users in with a
# password. Added by `IDENTITY=1 scripts/compose-lab.sh all-in-one`, never on its own.
#
# The realms are lab fixtures: their users and passwords exist only in this throwaway Keycloak.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: [all-in-one]
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: lab-admin-password
    volumes: ["./lab/keycloak:/opt/keycloak/data/import:ro"]
    # The image has no curl: readiness asked over bash's own socket.
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 3s
      timeout: 3s
      retries: 100

  all-in-one:
    command: ["serve", "permguard-all-in-one", "/opt/permguard/lab/all-in-one-identity.yml"]
    # Its listeners take the operator's certificate and the providers' tokens alike.
    environment:
      LAB_HOST: all-in-one
      LAB_CLIENT_AUTH: optional
    # Its Server Host surface serves TLS: discovery asked over it.
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "-o", "/dev/null", "https://localhost:5443/.well-known/server-configuration"]
    depends_on:
      keycloak: { condition: service_healthy }
