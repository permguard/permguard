# .goreleaser-pro.yaml
#
# What the licensed runner adds on top of `.goreleaser.yaml`: SBOMs for every
# archive, a cosign signature over the checksums file, macOS signing and notarization when the
# secrets are present, and the Homebrew cask. Container provenance is published by the workflow's
# GitHub Artifact Attestations step: using Cosign here as well stores `sha256-*.sig` beside every
# image, and both GHCR and Docker Hub misleadingly present those signature artifacts as pullable
# image versions.

version: 2
pro: true

includes:
  - from_file:
      path: ./.goreleaser.yaml

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      # The Apple binaries, which are the only ones notarisation applies to.
      ids:
        - permguard_cli_darwin
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

# This is the Permguard CLI, so it owns the unqualified cask name. Versioned alternatives let a
# caller pin the release line without exposing the implementation language in the package name.
homebrew_casks:
  - name: cli
    binaries: ["permguard"]
    # A cask installs on macOS, so it carries the Apple build.
    ids: ["permguard_cli_darwin"]
    repository:
      owner: "{{ .Env.ORG }}"
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    alternative_names:
      - cli@{{ .Version }}
      - cli@{{ .Major }}
    homepage: "https://docs.permguard.com/"
    description: "Permguard CLI"
    commit_author:
      name: Permguard Team
      email: opensource@permguard.com
    license: "Apache-2.0"
    url:
      template: "https://github.com/permguard/permguard/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      verified: "github.com/permguard/permguard/"
    skip_upload: false
