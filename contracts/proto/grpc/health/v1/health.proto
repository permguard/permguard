// The gRPC Health Checking Protocol's `Check`, as every gRPC surface of a Permguard Plane answers
// it: the wire names the protocol fixes, so a load balancer or an orchestrator probes a Plane over
// gRPC as over HTTP's `/healthz` and `/readyz`. `Watch` is not served: a probe asks again.

syntax = "proto3";

package grpc.health.v1;

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  // Empty for the surface as a whole, or a Plane's name: `control`, `data`, `authority`.
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}
