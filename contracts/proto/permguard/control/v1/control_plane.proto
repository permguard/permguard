syntax = "proto3";

package permguard.control.v1;

service ControlPlane {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  // The plane's discovery document — the same JSON the HTTP surface answers
  // at /.well-known/server-configuration, so a gRPC-only client discovers
  // the plane without ever speaking HTTP.
  rpc GetServerConfiguration(GetServerConfigurationRequest) returns (GetServerConfigurationResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string plane = 1;
  string product = 2;
  string version = 3;
  string commit = 4;
}

message GetServerConfigurationRequest {}

message GetServerConfigurationResponse {
  // The discovery document, as JSON — byte-identical to the HTTP answer.
  string document_json = 1;
}

message GetHealthRequest {}

message GetHealthResponse {
  bool live = 1;
  bool ready = 2;
  // The lifecycle (P2), additive beside the two booleans: this plane's phase — bootstrap, load,
  // initialize, ready, serving, draining, stopped or failed — what it serves without, and every
  // component the process hosts, a plane not yet Ready listed with its phase rather than omitted.
  string state = 3;
  repeated Degraded degraded = 4;
  repeated Component components = 5;
}

// One capability that is served and cannot currently do its work.
message Degraded {
  string capability = 1;
  string reason = 2;
}

// One component of the process: the Host, a plane, or a background service, with its state and
// whether it gates readiness. The instants are RFC 3339 at second precision, absent when the
// component has none to report.
message Component {
  string component = 1;
  // `host`, `plane` or `service`.
  string kind = 2;
  // A phase for the Host and a plane; `disabled`, `running`, `backoff`, `draining` or `failed`
  // for a service.
  string state = 3;
  bool required = 4;
  optional string stalled_since = 5;
  optional string last_success = 6;
  optional string next_attempt = 7;
  optional string reason = 8;
}


// ---------------------------------------------------------------------------------------------
// Zones and ledgers: the same catalog the HTTP routes serve, one wire format apart.
//
// Wherever a call refers to an existing zone or ledger it takes a `selector`: the GUID, or the
// name — the server tells them apart by shape, and names shaped like GUIDs cannot be created.
// ---------------------------------------------------------------------------------------------

service ZoneCatalog {
  rpc CreateZone(CreateZoneRequest) returns (ZoneResponse);
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse);
  rpc GetZone(GetZoneRequest) returns (ZoneResponse);
  rpc RenameZone(RenameZoneRequest) returns (ZoneResponse);
  rpc DeleteZone(DeleteZoneRequest) returns (ZoneResponse);

  rpc CreateLedger(CreateLedgerRequest) returns (LedgerResponse);
  rpc ListLedgers(ListLedgersRequest) returns (ListLedgersResponse);
  rpc GetLedger(GetLedgerRequest) returns (LedgerResponse);
  rpc RenameLedger(RenameLedgerRequest) returns (LedgerResponse);
  rpc DeleteLedger(DeleteLedgerRequest) returns (LedgerResponse);
  // An archived ledger stays readable, pulled and mirrored, and refuses a push (WP-7.3b).
  rpc ArchiveLedger(ArchiveLedgerRequest) returns (LedgerResponse);
  rpc RestoreLedger(RestoreLedgerRequest) returns (LedgerResponse);
  // The signed archive of one ledger, or of every ledger of a zone, under `catalog.read`
  // (WP-7.10): one message, refused `unavailable` past the transport's ceiling.
  rpc ExportLedger(ExportLedgerRequest) returns (ExportResponse);
  rpc ExportZone(ExportZoneRequest) returns (ExportResponse);
  // An archive another Host exported, into an existing zone, under `catalog.write` and
  // `policy.push` (WP-7.10): `archive` keeps it as foreign evidence, never served; `re-home`
  // creates new ledgers with their provenance, serving once an operator pushes a head.
  rpc Import(ImportRequest) returns (ImportResponse);
}

message Zone {
  string id = 1;
  string name = 2;
  uint64 created_at = 3;
  uint64 updated_at = 4;
  // 1 at creation, one more at each change: what a change's `expected_revision` names (WP-7.3a).
  uint64 revision = 5;
}

message Ledger {
  string id = 1;
  string zone_id = 2;
  string name = 3;
  uint64 created_at = 4;
  uint64 updated_at = 5;
  // The ledger's default ref — a reference into its git-like store.
  string default_ref = 6;
  // On GetLedger only: the members this Host coordinates whose `policy.mirror` task covers the
  // ledger, with what it observed of them; assignment and observations, not a guarantee that a
  // member serves now (WP-4.4).
  repeated ServingMember serving_members = 7;
  // As Zone's (WP-7.3a).
  uint64 revision = 8;
  // `active` or `archived`, always present (WP-7.3b).
  string state = 9;
  // A re-homed ledger's provenance, set at its creation and never changed; absent on a ledger
  // created here (WP-7.10).
  LedgerProvenance provenance = 10;
}

// The export a re-homed ledger was imported from (WP-7.10): its genesis names the source, never
// the source's authority.
message LedgerProvenance {
  string manifest_digest = 1;
  string source_host_id = 2;
  string source_zone_id = 3;
  string source_ledger_id = 4;
  uint64 exported_at = 5;
}

// One member assigned to serve a ledger (WP-4.4).
message ServingMember {
  string host_id = 1;
  string membership_id = 2;
  string task_id = 3;
  // What the member declared, never rendered as verified.
  string declared_assurance = 4;
  // The coordinator's appraisal; absent when the manifest signs no binding.
  ServingAssurance assurance_binding_status = 5;
  // `live` while a session's lease runs, `none` otherwise.
  string lease_state = 6;
  optional string last_session_at = 7;
  // The member's last report, member-reported; absent before the first.
  ServingProgress progress = 8;
}

// An assurance binding's status, without its evidence (WP-4.4).
message ServingAssurance {
  // `accepted` or `revoked`.
  string verdict = 1;
  // Whether it admits tasks now.
  bool current = 2;
  string policy_revision = 3;
  repeated ServingClaim claims = 4;
  string expires_at = 5;
}

// One accepted claim: the control, the class of evidence, and who vouches (WP-4.4).
message ServingClaim {
  string control = 1;
  string class = 2;
  string by = 3;
}

// A member's last report of one ledger (WP-4.4).
message ServingProgress {
  uint64 report_seq = 1;
  // When the member says it reported.
  string reported_at = 2;
  // When the coordinator received it.
  string received_at = 3;
  optional string state = 4;
  optional string checkpoint_digest = 5;
  bool stale = 6;
}

// Every change names the `request_id` a retry repeats, and a change of a record the
// `expected_revision` it read the record at, 0 being none (WP-7.3a).
message CreateZoneRequest { string name = 1; string request_id = 2; }
// A page of the listing: 0-based `page`, at most `size` per page. Both absent
// means everything — the shape a synchronizing mirror wants, and what every
// caller sent before pagination existed. The fields carry presence so that
// page 0, the first page, is told apart from no page at all; a `size` of 0 is
// no size. A caller built against the earlier contract, which sent 0 for "not
// asked", still gets everything: it sends no field at all.
message ListZonesRequest {
  optional uint32 page = 1;
  optional uint32 size = 2;
}
message GetZoneRequest { string zone = 1; }
message RenameZoneRequest {
  string zone = 1;
  string name = 2;
  string request_id = 3;
  uint64 expected_revision = 4;
}
message DeleteZoneRequest { string zone = 1; string request_id = 2; uint64 expected_revision = 3; }

message ZoneResponse { Zone zone = 1; }
message ListZonesResponse { repeated Zone zones = 1; }

message CreateLedgerRequest { string zone = 1; string name = 2; string request_id = 3; }
message ListLedgersRequest {
  string zone = 1;
  // Same paging contract as ListZonesRequest.
  optional uint32 page = 2;
  optional uint32 size = 3;
}
message GetLedgerRequest { string zone = 1; string ledger = 2; }
message RenameLedgerRequest {
  string zone = 1;
  string ledger = 2;
  string name = 3;
  string request_id = 4;
  uint64 expected_revision = 5;
}
message DeleteLedgerRequest {
  string zone = 1;
  string ledger = 2;
  string request_id = 3;
  uint64 expected_revision = 4;
}

message ArchiveLedgerRequest {
  string zone = 1;
  string ledger = 2;
  string request_id = 3;
  uint64 expected_revision = 4;
}

message RestoreLedgerRequest {
  string zone = 1;
  string ledger = 2;
  string request_id = 3;
  uint64 expected_revision = 4;
}

message ExportLedgerRequest {
  string zone = 1;
  string ledger = 2;
}

message ExportZoneRequest { string zone = 1; }

// One ledger an export holds.
message ExportedLedger {
  string id = 1;
  string name = 2;
  uint64 refs = 3;
  uint64 objects = 4;
  uint64 statements = 5;
}

// An export: the archive, a canonical CBOR map {1 manifest, 2 bundle} whose manifest is the
// COSE_Sign1 `permguard.ledger.export.v1` under the Host's `host.operations`, and what it binds.
message ExportResponse {
  bytes archive = 1;
  string zone_id = 2;
  string bundle_digest = 3;
  uint64 bundle_bytes = 4;
  // Seconds since the Unix epoch.
  uint64 exported_at = 5;
  repeated ExportedLedger ledgers = 6;
}

message ImportRequest {
  string zone = 1;
  string request_id = 2;
  // `archive` or `re-home`.
  string mode = 3;
  // The archive's name, or the one ledger's of a one-ledger archive re-homed; empty for none.
  string name = 4;
  bytes archive = 5;
  // The source Host's keys bundle: its manifest and items, as the Host API answers them.
  bytes bundle_manifest = 6;
  repeated bytes bundle_items = 7;
  // The source Host's identity pin.
  string pin = 8;
}

// An archive kept as foreign evidence.
message ArchiveRecord {
  string id = 1;
  string name = 2;
  uint64 imported_at = 3;
  string manifest_digest = 4;
  string source_host_id = 5;
  string source_zone_id = 6;
  string source_zone_name = 7;
  repeated ExportedLedger ledgers = 8;
}

message ImportResponse {
  string mode = 1;
  string manifest_digest = 2;
  string source_host_id = 3;
  string source_zone_id = 4;
  // For an `archive` import.
  ArchiveRecord archive = 5;
  // For a `re-home` import: the ledgers created.
  repeated Ledger ledgers = 6;
}

message LedgerResponse { Ledger ledger = 1; }
message ListLedgersResponse { repeated Ledger ledgers = 1; }
