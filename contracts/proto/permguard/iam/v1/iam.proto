// Identity and access, `permguard.iam.v1` (iteration 02, WP-11.1): the directory a Host that runs a
// Control Plane holds, the IAM Host, served under `/iam/v1` over REST. A Host that runs only a Data
// Plane serves none of these services. The messages are the Host API's, `permguard.host.v1`: the
// operations moved, their shapes did not.

syntax = "proto3";

package permguard.iam.v1;

import "permguard/host/v1/host.proto";

// REST group: grants.
service GrantService {
  // `GET /iam/v1/grants`.
  rpc ListGrants(permguard.host.v1.ListGrantsRequest) returns (permguard.host.v1.ListGrantsResponse);
  // `POST /iam/v1/grants`.
  rpc CreateGrant(permguard.host.v1.CreateGrantRequest) returns (permguard.host.v1.CreateGrantResponse);
  // `POST /iam/v1/grants/{id}/revoke/plan`.
  rpc PlanGrantRevoke(permguard.host.v1.PlanGrantRevokeRequest) returns (permguard.host.v1.PlanGrantRevokeResponse);
  // `POST /iam/v1/grants/{id}/revoke/run`.
  rpc RunGrantRevoke(permguard.host.v1.RunGrantRevokeRequest) returns (permguard.host.v1.RunGrantRevokeResponse);
}

// REST group: roles and members (WP-8.1).
service RoleService {
  // `GET /iam/v1/roles`.
  rpc ListRoles(permguard.host.v1.ListRolesRequest) returns (permguard.host.v1.ListRolesResponse);
  // `GET /iam/v1/roles/{name}`.
  rpc GetRole(permguard.host.v1.GetRoleRequest) returns (permguard.host.v1.GetRoleResponse);
  // `POST /iam/v1/roles`.
  rpc CreateRole(permguard.host.v1.CreateRoleRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `PATCH /iam/v1/roles/{name}`.
  rpc UpdateRole(permguard.host.v1.UpdateRoleRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/roles/{name}/delete`.
  rpc DeleteRole(permguard.host.v1.DeleteRoleRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/roles/{name}/members`.
  rpc AddMember(permguard.host.v1.MemberRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/roles/{name}/members/remove`.
  rpc RemoveMember(permguard.host.v1.MemberRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `GET /iam/v1/principals/{principal}/roles`.
  rpc RolesOf(permguard.host.v1.RolesOfRequest) returns (permguard.host.v1.RolesOfResponse);
}

// REST group: local users (WP-8.1).
service UserService {
  // `GET /iam/v1/users`.
  rpc ListUsers(permguard.host.v1.ListUsersRequest) returns (permguard.host.v1.ListUsersResponse);
  // `GET /iam/v1/users/{name}`.
  rpc GetUser(permguard.host.v1.GetUserRequest) returns (permguard.host.v1.GetUserResponse);
  // `POST /iam/v1/users`.
  rpc CreateUser(permguard.host.v1.CreateUserRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `PATCH /iam/v1/users/{name}`.
  rpc UpdateUser(permguard.host.v1.UpdateUserRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/users/{name}/password`.
  rpc SetPassword(permguard.host.v1.SetPasswordRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/users/{name}/disable` and `…/enable`.
  rpc SetUserStatus(permguard.host.v1.SetUserStatusRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/users/{name}/factor/reset`.
  rpc ResetFactor(permguard.host.v1.UserPlainRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/users/{name}/unlock`.
  rpc UnlockUser(permguard.host.v1.UnlockUserRequest) returns (permguard.host.v1.UnlockUserResponse);
  // `POST /iam/v1/users/{name}/links` and `…/links/remove`.
  rpc LinkUser(permguard.host.v1.LinkUserRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/users/{name}/delete`.
  rpc DeleteUser(permguard.host.v1.UserPlainRequest) returns (permguard.host.v1.DirectoryChangeResponse);
}

// REST group: identity providers (WP-8.1).
service ProviderService {
  // `GET /iam/v1/providers`.
  rpc ListProviders(permguard.host.v1.ListProvidersRequest) returns (permguard.host.v1.ListProvidersResponse);
  // `POST /iam/v1/providers/{name}/refresh`.
  rpc RefreshProvider(permguard.host.v1.RefreshProviderRequest) returns (permguard.host.v1.Provider);
}

// REST group: recovery (WP-8.2).
service RecoveryService {
  // `GET /iam/v1/recovery`.
  rpc GetRecovery(permguard.host.v1.GetRecoveryRequest) returns (permguard.host.v1.GetRecoveryResponse);
  // `POST /iam/v1/recovery/acknowledge`.
  rpc AcknowledgeRecovery(permguard.host.v1.AcknowledgeRecoveryRequest)
      returns (permguard.host.v1.AcknowledgeRecoveryResponse);
}

// REST group: service accounts and their credentials (iteration 02, WP-11.2).
service ServiceAccountService {
  // `GET /iam/v1/service-accounts`.
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  // `GET /iam/v1/service-accounts/{name}`.
  rpc GetServiceAccount(GetServiceAccountRequest) returns (GetServiceAccountResponse);
  // `POST /iam/v1/service-accounts`.
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `PATCH /iam/v1/service-accounts/{name}`.
  rpc UpdateServiceAccount(UpdateServiceAccountRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/service-accounts/{name}/suspend` and `…/resume`.
  rpc SetServiceAccountStatus(SetServiceAccountStatusRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `POST /iam/v1/service-accounts/{name}/delete`.
  rpc DeleteServiceAccount(ServiceAccountPlainRequest) returns (permguard.host.v1.DirectoryChangeResponse);
  // `GET /iam/v1/service-accounts/{name}/credentials`.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // `POST /iam/v1/service-accounts/{name}/credentials`.
  rpc CreateCredential(CreateCredentialRequest) returns (CreateCredentialResponse);
  // `POST /iam/v1/service-accounts/{name}/credentials/{id}/revoke`.
  rpc RevokeCredential(RevokeCredentialRequest) returns (permguard.host.v1.DirectoryChangeResponse);
}

message ServiceAccountSummary {
  string name = 1;
  string owner = 2;
  string description = 3;
  // `active` or `suspended`.
  string status = 4;
  // Its live credentials.
  uint64 credentials = 5;
  repeated string roles = 6;
  uint64 revision = 7;
}
message ListServiceAccountsRequest {}
message ListServiceAccountsResponse {
  uint64 revision = 1;
  repeated ServiceAccountSummary service_accounts = 2;
}
message GetServiceAccountRequest {
  string name = 1;
}
message Credential {
  string id = 1;
  // `client_secret`, `private_key_jwt` or `tls_client_auth`.
  string kind = 2;
  optional string key_id = 3;
  optional string algorithm = 4;
  optional string binding = 5;
  string created_at = 6;
  string created_by = 7;
  optional string expires_at = 8;
  // `active`, `expired` or `revoked`.
  string status = 9;
  optional string revoked_at = 10;
}
message GetServiceAccountResponse {
  ServiceAccountSummary service_account = 1;
  repeated permguard.host.v1.Grant grants = 2;
  repeated Credential credentials = 3;
  uint64 directory_revision = 4;
}
message CreateServiceAccountRequest {
  string request_id = 1;
  optional uint64 expected_revision = 2;
  string name = 3;
  string owner = 4;
  string description = 5;
}
message UpdateServiceAccountRequest {
  string name = 1;
  string request_id = 2;
  optional uint64 expected_revision = 3;
  optional string owner = 4;
  optional string description = 5;
}
message SetServiceAccountStatusRequest {
  string name = 1;
  string request_id = 2;
  optional uint64 expected_revision = 3;
  bool active = 4;
}
message ServiceAccountPlainRequest {
  string name = 1;
  string request_id = 2;
  optional uint64 expected_revision = 3;
}
message ListCredentialsRequest {
  string name = 1;
}
message ListCredentialsResponse {
  repeated Credential credentials = 1;
}
message CreateCredentialRequest {
  string name = 1;
  string request_id = 2;
  optional uint64 expected_revision = 3;
  string kind = 4;
  // A `private_key_jwt`'s public JWK, its members as text.
  map<string, string> public_key = 5;
  // A `tls_client_auth`'s `spki:sha256:<hex>` or SAN URI.
  optional string certificate = 6;
  optional string expires_at = 7;
}
message CreateCredentialResponse {
  permguard.host.v1.Receipt receipt = 1;
  uint64 revision = 2;
  Credential credential = 3;
  // A `client_secret`, answered once.
  optional string client_secret = 4;
}
message RevokeCredentialRequest {
  string name = 1;
  string id = 2;
  string request_id = 3;
  optional uint64 expected_revision = 4;
}

// REST group: tokens and their status lists (iteration 02, WP-11.5).
service TokenService {
  // `GET /iam/v1/status-lists/{id}`.
  rpc GetStatusList(GetStatusListRequest) returns (GetStatusListResponse);
  // `GET /iam/v1/tokens`.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  // `POST /iam/v1/tokens/{jti}/revoke`.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
}

message GetStatusListRequest {
  string id = 1;
}
message GetStatusListResponse {
  // The compact `statuslist+jwt`, as the REST answer's body.
  string token = 1;
}
message ListTokensRequest {}
message TokenSummary {
  string jti = 1;
  string subject = 2;
  string client_id = 3;
  // `application` or `administration`.
  string family = 4;
  repeated string audience = 5;
  string scope = 6;
  string issued_at = 7;
  string expires_at = 8;
  // `valid`, `invalid` or `suspended`.
  string status = 9;
  string status_list = 10;
  uint64 index = 11;
}
message ListTokensResponse {
  repeated TokenSummary tokens = 1;
}
message RevokeTokenRequest {
  string jti = 1;
  string request_id = 2;
}
message RevokeTokenResponse {
  permguard.host.v1.Receipt receipt = 1;
  // Whether it wrote anything: a token already invalid writes nothing.
  bool changed = 2;
}
