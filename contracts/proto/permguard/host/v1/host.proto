  // The receipt the run presents, COSE_Sign1 `permguard.operation.plan.v1` (WP-3.9).
  bytes receipt = 5;
  // How many principals other than the planner must approve it before it runs.
  uint64 approvals_required = 6;
}
// `POST /host/v1/grants/{id}/revoke/run`.
message RunGrantRevokeRequest {
