}

// One grant, as the API shows it.
message Grant {
  string grant_id = 1;
  string principal = 2;
  repeated string operations = 3;
  string selector = 4;
  repeated string resource_types = 5;
  map<string, string> constraints = 6;
  uint64 revision = 7;
  // `active`, `revoked` or `expired`.
  string status = 8;
  string issued_by = 9;
  // RFC 3339.
  string issued_at = 10;
  // RFC 3339, when the grant expires.
  optional string expires_at = 11;
}

// The common envelope's receipt: `{operation_id, revision, audit}`.
message Receipt {
  string operation_id = 1;
  uint64 revision = 2;
  AuditReference audit = 3;
}

// Where the audit trail recorded a mutation; `seq` and `digest` arrive with the sealed trail.
message AuditReference {
  string trail = 1;
  optional uint64 seq = 2;
  optional string digest = 3;
}
