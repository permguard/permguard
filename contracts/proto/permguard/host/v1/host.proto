}
message RotateKeyRingResponse {
  Receipt receipt = 1;
  // The successor prepublished.
  string kid = 2;
}
// `POST /host/v1/keys/{ring}/revoke/plan` (WP-3.1), under `keys.admin`.
message PlanKeyRevokeRequest {
  string ring = 1;
  string request_id = 2;
  string kid = 3;
  string reason = 4;
  // RFC 3339.
  optional string compromised_at = 5;
  optional uint64 expected_epoch = 6;
}
message PlanKeyRevokeResponse {
  string plan_id = 1;
  string plan_digest = 2;
  // RFC 3339: when the plan can no longer be run.
  string expires = 3;
  // The ring epoch the plan was made against.
  uint64 revision = 4;
  // The receipt the run presents, COSE_Sign1 `permguard.operation.plan.v1` (WP-3.9).
  bytes receipt = 5;
  // How many principals other than the planner must approve it before it runs.
  uint64 approvals_required = 6;
}
// `POST /host/v1/keys/{ring}/revoke/run` (WP-3.1), under `keys.admin`.
message RunKeyRevokeRequest {
  reserved 3, 4;
  string ring = 1;
  string request_id = 2;
  // The receipt the plan step answered (WP-3.9).
  bytes receipt = 5;
}
message RunKeyRevokeResponse {
  Receipt receipt = 1;
  string kid = 2;
}
message GetKeyBundleRequest {
  // The resource the bundle covers, in the Host API's grammar: `host`, `plane/<p>`, ...
  string resource = 1;
  // The manifest a first page answered, base64url, which fixes the frontier; empty on the first
  // page (WP-3.4).
  string frontier = 2;
  // Where the page starts, as the page before answered it; requires `frontier`.
  string cursor = 3;
  // How many items the page carries: 1 to 500, 100 when absent.
  optional uint32 limit = 4;
}
message GetKeyBundleResponse {
  reserved 2;
  string resource = 1;
  // The signed manifest, COSE_Sign1 `permguard.keys.bundle.v1`, the same bytes on every page of
  // one frontier: a later page names it, base64url, as `frontier`.
  bytes manifest = 3;
  // The bundle digest, hex.
  string bundle_digest = 4;
  // How many items the whole bundle holds.
  uint64 total = 5;
  // This page's items, canonical CBOR each, in the bundle's digest order: identity, key,
  // binding, revocation, and the peer and peers items of the members this Host coordinates
  // (WP-4.1).
  repeated bytes items = 6;
  // The cursor of the next page; absent on the last one.
  optional string next_cursor = 7;
}
message ListSecretsRequest {}
message ListSecretsResponse {}
message RotateSecretRequest {}
message RotateSecretResponse {}
// `GET /host/v1/audit/{class}/records` (WP-3.7), under `audit.read` on `resource`, which is
// authorized before the class or any filter is read.
message ListAuditRecordsRequest {
  // `security`, `operations` or `access`.
  string class = 1;
  // The trail's resource, in the Host API's grammar.
  string resource = 2;
  // The earliest record time, seconds since the epoch, inclusive.
  optional uint64 from = 3;
  // The latest record time, seconds since the epoch, inclusive.
  optional uint64 to = 4;
  // Where the page starts, as the page before answered it; empty on the first page.
  string cursor = 5;
  // How many records the page carries: 1 to 1000, 100 when absent.
  optional uint32 limit = 6;
}
message ListAuditRecordsResponse {
  string class = 1;
  string resource = 2;
  repeated AuditRecord records = 3;
  // What the page cannot show: retention, an access queue's drops, records missing.
  repeated AuditGap gaps = 4;
  // The trail's next sequence when the first page was read: no page passes it.
  uint64 frontier = 5;
  // The cursor of the next page; absent on the last one.
  optional string next_cursor = 6;
  // What retention deleted, when it deleted anything.
  optional AuditAnchor anchor = 7;
}
// One audit record: its canonical bytes beside its digest, and what a reader looks for first.
message AuditRecord {
  uint64 seq = 1;
  // Seconds since the epoch.
  uint64 at = 2;
  string action = 3;
  string outcome = 4;
  // `sha256:<hex>` over `permguard.audit.record.v1\n` and the bytes.
  string digest = 5;
  // The canonical CBOR (`contracts/cbor/audit.json`).
  bytes record = 6;
}
// Something a page cannot show, stated rather than left out.
message AuditGap {
  // `retention`, `dropped` or `missing`.
  string kind = 1;
  optional uint64 from_seq = 2;
  optional uint64 to_seq = 3;
  // How many records an `access` queue dropped.
  optional uint64 count = 4;
  // The last day retention deleted.
  optional string through = 5;
}
// What retention deleted: the first sequence kept and the seal of the last day deleted.
message AuditAnchor {
  uint64 low_watermark = 1;
  string through = 2;
  string checkpoint = 3;
}
// One checkpoint, COSE_Sign1 `permguard.audit.checkpoint.v1`, with the witness's co-signature.
message AuditCheckpoint {
  // `YYYY-MM-DD.cose`, or `YYYY-MM-DD.<seq>.cose` on demand.
  string name = 1;
  bytes envelope = 2;
  optional bytes witness = 3;
}
// `GET /host/v1/audit/{class}/checkpoints` (WP-3.7), under `audit.read` on `resource`.
message ListAuditCheckpointsRequest {
  string class = 1;
  string resource = 2;
  // One UTC day, `YYYY-MM-DD`; empty is every day.
  string period = 3;
}
message ListAuditCheckpointsResponse {
  string class = 1;
  string resource = 2;
  repeated AuditCheckpoint checkpoints = 3;
  // The `host.operations` set and its binding, when the Host composes it.
  optional GetKeyRingResponse keys = 4;
  // How many older checkpoints the answer leaves out, beyond the newest 1000.
  uint64 omitted = 5;
  // What `keys export` prints for `host.operations`, retained keys and revocations included.
  optional string verification_keys = 6;
}
// `GET /host/v1/audit/{class}/export` (WP-3.7), under `audit.read` on `resource`.
message ExportAuditRequest {
  string class = 1;
  string resource = 2;
  // The sequence the export stops before; the trail's next one when absent.
  optional uint64 frontier = 3;
  // Where the page starts; empty on the first page.
  string cursor = 4;
  optional uint32 limit = 5;
}
message ExportAuditResponse {
  string class = 1;
  string resource = 2;
  repeated AuditRecord records = 3;
  repeated AuditGap gaps = 4;
  uint64 frontier = 5;
  optional string next_cursor = 6;
  optional AuditAnchor anchor = 7;
  // On the first page, the checkpoints below the frontier, the newest 1000; empty after it.
  repeated AuditCheckpoint checkpoints = 8;
  // On the first page, the `host.operations` set; absent after it.
  optional GetKeyRingResponse keys = 9;
  // On the first page, how many older checkpoints below the frontier it leaves out.
  uint64 omitted = 10;
  // On the first page, the `keys export` document of `host.operations`; absent after it.
  optional string verification_keys = 11;
}
// `GET /host/v1/streams` (WP-5.7a), under `streams.read` on `host`.
message ListStreamsRequest {}
message ListStreamsResponse {
  repeated StreamDescriptor streams = 1;
}
// One descriptor and role the Host's stream engine serves.
message StreamDescriptor {
  string plane = 1;
  string stream_type = 2;
  uint32 version = 3;
  // `producer` or `consumer`.
  string role = 4;
  // `evidence` or `history`.
  string retention = 5;
  string ring = 6;
  // The membership task that ships the stream, when one does.
  optional string task = 7;
  repeated StreamResource resources = 8;
}
// One resource of a stream: `open`, `forked`, `behind` (a drain left records unshipped) or
// `held` (a consumer).
message StreamResource {
  string resource = 1;
  string state = 2;
}
// Batches travel on the membership's task transport; this binding is not served (WP-5.7, owner
// decision of 2026-10-17).
message ShipStreamBatchRequest {}
message ShipStreamBatchResponse {}
// The query of a stream read (WP-5.7a), under `streams.read` on `resource`, which is authorized
// before anything else is read.
message GetStreamFrontierRequest {
  string plane = 1;
  string stream_type = 2;
  string resource = 3;
}
message GetStreamFrontierResponse {
  string resource = 1;
  repeated StreamProducerRun producer = 2;
  repeated StreamConsumerRun consumer = 3;
}
// One run as the producer holds it.
message StreamProducerRun {
  // Hex.
  string run = 1;
  bool ended = 2;
  uint64 last_seq = 3;
  uint64 sealed = 4;
  // The least acknowledgement of the required subscriptions, when one holds the run.
  optional uint64 acknowledged = 5;
  // The first sequence still held: 1 unless a prefix went.
  uint64 low_watermark = 6;
}
// One run as a consumer holds it.
message StreamConsumerRun {
  // Hex: the producer Host and its run.
  string producer = 1;
  string run = 2;
  uint64 acked = 3;
  uint64 oldest_retained = 4;
}
message ListStreamRecordsRequest {
  string plane = 1;
  string stream_type = 2;
  string resource = 3;
  // A consumer run: its producer Host and run, hex; both empty for the producer's current run.
  string producer = 4;
  string run = 5;
  // The first sequence, 1 when absent.
  optional uint64 from = 6;
  // 1 to 1000, 100 when absent.
  optional uint32 limit = 7;
}
message ListStreamRecordsResponse {
  string resource = 1;
  string run = 2;
  repeated StreamRecord records = 3;
  // Where the next page starts, when the run holds more.
  optional uint64 next = 4;
  // The deleted prefix the read started in, never answered as complete.
  optional StreamGap gap = 5;
}
// One record: its bytes and their digest under the stream's record domain.
message StreamRecord {
  uint64 seq = 1;
  bytes record = 2;
  string digest = 3;
}
// What a read below the first sequence still held reaches.
message StreamGap {
  uint64 low_watermark = 1;
  StreamAnchor anchor = 2;
}
message ListStreamSignersRequest {
  string plane = 1;
  string stream_type = 2;
  string resource = 3;
}
message ListStreamSignersResponse {
  repeated StreamRunSigners runs = 1;
}
// One run's signer spans, for a role.
message StreamRunSigners {
  string role = 1;
  string producer = 2;
  string run = 3;
  repeated StreamSpan spans = 4;
}
message StreamSpan {
  uint64 from_seq = 1;
  string kid = 2;
  // The public key as JSON.
  string jwk = 3;
}
message ListStreamSubscriptionsRequest {
  string plane = 1;
  string stream_type = 2;
  string resource = 3;
}
message ListStreamSubscriptionsResponse {
  repeated StreamSubscription subscriptions = 1;
}
// One subscription of the producer and its acknowledgement per run.
message StreamSubscription {
  string membership = 1;
  string task = 2;
  bool required = 3;
  // `active`, `paused` or `stopped`.
  string state = 4;
  optional string reason = 5;
  repeated StreamRunAck acked = 6;
}
message StreamRunAck {
  string run = 1;
  uint64 acked = 2;
}
message ListStreamGapsRequest {
  string plane = 1;
  string stream_type = 2;
  string resource = 3;
}
message ListStreamGapsResponse {
  repeated StreamGapEntry gaps = 1;
}
// One run whose prefix went.
message StreamGapEntry {
  string role = 1;
  string producer = 2;
  string run = 3;
  uint64 low_watermark = 4;
}
message ListStreamAnchorsRequest {
  string plane = 1;
  string stream_type = 2;
  string resource = 3;
}
message ListStreamAnchorsResponse {
  repeated StreamAnchor anchors = 1;
}
// One run's prefix anchor (`contracts/cbor/stream.json`, `stream_anchor`).
message StreamAnchor {
  string role = 1;
  string producer = 2;
  string run = 3;
  uint64 through = 4;
  uint64 low_watermark = 5;
  string terminal_head = 6;
  // How many deleted batches it covers.
  uint64 covering = 7;
  // The anchor's deterministic CBOR.
  bytes anchor = 8;
}
message GetStatusRequest {}
message GetStatusResponse {
  bool live = 1;
  bool ready = 2;
  // The Host's phase.
  string state = 3;
  repeated HostDegraded degraded = 4;
  repeated HostComponent components = 5;
  Assurance assurance = 6;
  // Whether the listener serves peer Host sessions, and why not (WP-2.3).
  PeerSessions peer_sessions = 7;
  // Every listener of the process, sorted by name, and what it demands of its clients (WP-2.11).
  repeated HostListener listeners = 8;
  // Where the volume stands (TS-5), absent before Bootstrap qualified it.
  optional HostStorage storage = 9;
}

// The volume's qualification (TS-5): `qualification` is `qualified`, `compatibility_mode` or
// `unqualified`; `evidence` the evidence id of a qualified volume. Nothing about the provider.
message HostStorage {
  string qualification = 1;
  optional string evidence = 2;
}

// One listener of the process (WP-2.11): never its address, certificate or peers. `class` is
// `host`, `plane_public` or `telemetry`; `authentication` is `none`, `tls`, `mutual_tls` or
// `upstream_tls`; `tls_min_version` is `1.2` or `1.3`, absent when the process serves no TLS on it.
message HostListener {
  string name = 1;
  string class = 2;
  string authentication = 3;
  bool client_allow = 4;
  optional string tls_min_version = 5;
}

// Whether the PeerChannel serves sessions: `reason` names why not, or the limit it serves
// them under (`tls_1_2_refused`); absent when there is nothing to say.
message PeerSessions {
  bool served = 1;
  optional string reason = 2;
}

// One capability served without its backing.
message HostDegraded {
  string capability = 1;
  string reason = 2;
}

// One component of the process, as the health document reports it; the instants are RFC 3339 and
// absent when the component has none to report.
message HostComponent {
  string component = 1;
  string kind = 2;
  string state = 3;
  bool required = 4;
  optional string stalled_since = 5;
  optional string last_success = 6;
  optional string next_attempt = 7;
  optional string reason = 8;
}

// The assurance profile the volume runs under.
message Assurance {
  string profile = 1;
  // Always `local`: the Host enforces its profile, it does not attest it.
  string enforcement = 2;
  // Controls of a higher profile the deployment switched on.
  repeated string added_controls = 3;
  // Relaxations the values in force amount to, each one the profile permits.
  repeated string relaxations = 4;
}
