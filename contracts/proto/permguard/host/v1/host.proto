}
message ListKeyRingsRequest {}
message ListKeyRingsResponse {
  repeated KeyRingSummary rings = 1;
}

// One ring in the list.
message KeyRingSummary {
  string ring = 1;
  uint32 keys = 2;
  // The key-set digest of the published set, hex.
  string digest = 3;
  // The ring epoch (WP-3.1).
  uint64 epoch = 4;
}
// `GET /host/v1/keys/{ring}`: public, no grant is checked.
message GetKeyRingRequest {
  string ring = 1;
}
message GetKeyRingResponse {
  string ring = 1;
  // The ring epoch (WP-3.1).
  optional uint64 epoch = 2;
  // The key-set digest of the published set, hex: what a peer persists with the epoch.
  string digest = 3;
  // The identity-signed binding of this epoch, COSE_Sign1; absent for `host.identity`.
  optional bytes binding = 4;
  // How long a client may cache the set, in seconds.
  uint32 cache_max_age = 5;
  repeated Jwk keys = 6;
}

// One public key as RFC 7517 defines it; the private half is never expressed.
message Jwk {
  string kid = 1;
  string kty = 2;
  optional string crv = 3;
  string x = 4;
  optional string y = 5;
  string alg = 6;
  string use = 7;
}
// `POST /host/v1/keys/{ring}/rotate` (WP-3.1), under `keys.admin`.
