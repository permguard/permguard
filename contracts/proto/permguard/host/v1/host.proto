// The Host API, `permguard.host.v1`: the six services of the Host API contract, one RPC per
// operation it names.
//
// The contract names its operations and their REST paths, not their message fields, so a message
// gets its fields when the package that serves its operation defines the shape from the
// contract, and stays empty until then: no field number is assigned ahead of the contract. The
// Host listener (WP-2.5) serves `GrantService`, `KeyService.ListKeyRings`, `KeyService.GetKeyRing`
// and `OperationsService.GetStatus` and `GetEffectiveConfig`; `IdentityService.GetIdentity`,
// `ListRingBindings` and `OperationsService.ListConfigRevisions` answer `not_served_yet` with empty
// messages. The REST side of every served operation is `contracts/openapi/host.json`, and the
// mapping between the two is written there.
//
// The service, RPC and message names of the unserved operations are provisional: they are gRPC
// paths the contract does not name yet, chosen from its operations, and the implementing package
// confirms or renames them before anything serves them.
//
// The peer exchange (`hello`, both proofs, enrolment and every task message) is not a set of
// unary RPCs: the contract requires one long-lived framed channel bound to one TLS connection.
// `IdentityService.PeerChannel` reserves that bidirectional stream; its frames are defined with
// the peer protocol. It carries the enrolment and task messages the contract groups under
// membership, because they travel on the same proven connection.

syntax = "proto3";

package permguard.host.v1;


// REST group: identity and sessions.
service IdentityService {
  // `POST /host/v1/sessions/hello`, `…/sessions/prove`, `POST /host/v1/members/enroll`,
  // `POST /host/v1/tasks/{task}/session` and `…/progress`, on one framed channel.
  rpc PeerChannel(stream PeerFrame) returns (stream PeerFrame);
  // `GET /host/v1/identity`.
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  // `POST /host/v1/identity/rotate`.
  rpc RotateIdentity(RotateIdentityRequest) returns (RotateIdentityResponse);
  // `POST /host/v1/identity/reset/plan`.
  rpc PlanIdentityReset(PlanIdentityResetRequest) returns (PlanIdentityResetResponse);
  // `POST /host/v1/identity/reset/run`.
  rpc RunIdentityReset(RunIdentityResetRequest) returns (RunIdentityResetResponse);
  // `GET /host/v1/ring-bindings`.
  rpc ListRingBindings(ListRingBindingsRequest) returns (ListRingBindingsResponse);
}

// REST group: memberships and tasks.
service MembershipService {
  // `POST /host/v1/members/invites`.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // `GET /host/v1/members/invites`.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // `DELETE /host/v1/members/invites/{id}`.
  rpc DeleteInvite(DeleteInviteRequest) returns (DeleteInviteResponse);
  // `GET /host/v1/members`.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // `GET /host/v1/members/{id}`.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  // `POST /host/v1/members/{id}/approve`.
  rpc ApproveMember(ApproveMemberRequest) returns (ApproveMemberResponse);
  // `POST /host/v1/members/{id}/reject`.
  rpc RejectMember(RejectMemberRequest) returns (RejectMemberResponse);
  // `POST /host/v1/members/{id}/suspend`.
  rpc SuspendMember(SuspendMemberRequest) returns (SuspendMemberResponse);
  // `POST /host/v1/members/{id}/resume`.
  rpc ResumeMember(ResumeMemberRequest) returns (ResumeMemberResponse);
  // `POST /host/v1/members/{id}/fence`.
  rpc FenceMember(FenceMemberRequest) returns (FenceMemberResponse);
  // `POST /host/v1/members/{id}/revoke/plan`.
  rpc PlanMemberRevoke(PlanMemberRevokeRequest) returns (PlanMemberRevokeResponse);
  // `POST /host/v1/members/{id}/revoke/run`.
  rpc RunMemberRevoke(RunMemberRevokeRequest) returns (RunMemberRevokeResponse);
  // `GET /host/v1/members/{id}/sessions`.
  rpc ListMemberSessions(ListMemberSessionsRequest) returns (ListMemberSessionsResponse);
}

// REST group: grants.
service GrantService {
  // `GET /host/v1/grants`.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  // `POST /host/v1/grants`.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  // `POST /host/v1/grants/{id}/revoke/plan`.
  rpc PlanGrantRevoke(PlanGrantRevokeRequest) returns (PlanGrantRevokeResponse);
  // `POST /host/v1/grants/{id}/revoke/run`.
  rpc RunGrantRevoke(RunGrantRevokeRequest) returns (RunGrantRevokeResponse);
}

// REST group: keys and secrets.
service KeyService {
  // `GET /host/v1/keys`.
  rpc ListKeyRings(ListKeyRingsRequest) returns (ListKeyRingsResponse);
  // `GET /host/v1/keys/{ring}`.
  rpc GetKeyRing(GetKeyRingRequest) returns (GetKeyRingResponse);
  // `POST /host/v1/keys/{ring}/rotate`.
  rpc RotateKeyRing(RotateKeyRingRequest) returns (RotateKeyRingResponse);
  // `POST /host/v1/keys/{ring}/revoke/plan`.
  rpc PlanKeyRevoke(PlanKeyRevokeRequest) returns (PlanKeyRevokeResponse);
  // `POST /host/v1/keys/{ring}/revoke/run`.
  rpc RunKeyRevoke(RunKeyRevokeRequest) returns (RunKeyRevokeResponse);
  // `GET /host/v1/keys/bundle`.
  rpc GetKeyBundle(GetKeyBundleRequest) returns (GetKeyBundleResponse);
  // `GET /host/v1/secrets`.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // `POST /host/v1/secrets/{ref}/rotate`.
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
}

// REST group: audit and streams.
service EvidenceService {
  // `GET /host/v1/audit/{class}/records`.
  rpc ListAuditRecords(ListAuditRecordsRequest) returns (ListAuditRecordsResponse);
  // `GET /host/v1/audit/{class}/checkpoints`.
  rpc ListAuditCheckpoints(ListAuditCheckpointsRequest) returns (ListAuditCheckpointsResponse);
  // `GET /host/v1/audit/{class}/export`.
  rpc ExportAudit(ExportAuditRequest) returns (ExportAuditResponse);
  // `GET /host/v1/streams`.
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse);
  // `POST /host/v1/streams/{plane}/{type}/batches`.
  rpc ShipStreamBatch(ShipStreamBatchRequest) returns (ShipStreamBatchResponse);
  // `GET /host/v1/streams/{plane}/{type}/frontier`.
  rpc GetStreamFrontier(GetStreamFrontierRequest) returns (GetStreamFrontierResponse);
  // `GET /host/v1/streams/{plane}/{type}/records`.
  rpc ListStreamRecords(ListStreamRecordsRequest) returns (ListStreamRecordsResponse);
  // `GET /host/v1/streams/{plane}/{type}/signers`.
  rpc ListStreamSigners(ListStreamSignersRequest) returns (ListStreamSignersResponse);
  // `GET /host/v1/streams/{plane}/{type}/subscriptions`.
  rpc ListStreamSubscriptions(ListStreamSubscriptionsRequest) returns (ListStreamSubscriptionsResponse);
  // `GET /host/v1/streams/{plane}/{type}/gaps`.
  rpc ListStreamGaps(ListStreamGapsRequest) returns (ListStreamGapsResponse);
  // `GET /host/v1/streams/{plane}/{type}/anchors`.
  rpc ListStreamAnchors(ListStreamAnchorsRequest) returns (ListStreamAnchorsResponse);
}

// REST group: lifecycle and storage.
service OperationsService {
  // `GET /host/v1/status`.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // `POST /host/v1/drain`.
  rpc Drain(DrainRequest) returns (DrainResponse);
  // `POST /host/v1/maintenance`.
  rpc Maintenance(MaintenanceRequest) returns (MaintenanceResponse);
  // `GET /host/v1/config/effective`.
  rpc GetEffectiveConfig(GetEffectiveConfigRequest) returns (GetEffectiveConfigResponse);
  // `GET /host/v1/config/revisions`.
  rpc ListConfigRevisions(ListConfigRevisionsRequest) returns (ListConfigRevisionsResponse);
  // `POST /host/v1/backup/prepare`.
  rpc PrepareBackup(PrepareBackupRequest) returns (PrepareBackupResponse);
  // `POST /host/v1/backup/finalize`.
  rpc FinalizeBackup(FinalizeBackupRequest) returns (FinalizeBackupResponse);
  // `POST /host/v1/backup/abort`.
  rpc AbortBackup(AbortBackupRequest) returns (AbortBackupResponse);
  // `GET /host/v1/backups`.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  // `POST /host/v1/gc/{job}/plan`.
  rpc PlanGc(PlanGcRequest) returns (PlanGcResponse);
  // `POST /host/v1/gc/{job}/run`.
  rpc RunGc(RunGcRequest) returns (RunGcResponse);
  // `GET /host/v1/storage/quota`.
  rpc GetStorageQuota(GetStorageQuotaRequest) returns (GetStorageQuotaResponse);
  // `POST /host/v1/storage/probe`.
  rpc ProbeStorage(ProbeStorageRequest) returns (ProbeStorageResponse);
  // `GET /host/v1/plans`.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  // `POST /host/v1/plans/{id}/approve`.
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse);
}

// A frame of the peer channel; defined with the peer protocol.
message PeerFrame {}

message GetIdentityRequest {}
// `GET /host/v1/identity` (WP-2.2): the signed document of the current epoch and every
// succession record, COSE_Sign1 bytes each; the epoch-1 public key the first fingerprint pins.
message GetIdentityResponse {
  bytes document = 1;
  repeated bytes successions = 2;
  bytes first_public_key = 3;
  repeated string protocol_versions = 4;
}
// `POST /host/v1/identity/rotate` (WP-2.2), under `identity.admin`.
message RotateIdentityRequest {
  string request_id = 1;
  uint64 expected_epoch = 2;
}
message RotateIdentityResponse {
  Receipt receipt = 1;
  // The succession record to the new epoch, COSE_Sign1.
  bytes succession = 2;
}
message PlanIdentityResetRequest {}
message PlanIdentityResetResponse {}
message RunIdentityResetRequest {}
message RunIdentityResetResponse {}
message ListRingBindingsRequest {}
message ListRingBindingsResponse {}
message CreateInviteRequest {}
message CreateInviteResponse {}
message ListInvitesRequest {}
message ListInvitesResponse {}
message DeleteInviteRequest {}
message DeleteInviteResponse {}
message ListMembersRequest {}
message ListMembersResponse {}
message GetMemberRequest {}
message GetMemberResponse {}
message ApproveMemberRequest {}
message ApproveMemberResponse {}
message RejectMemberRequest {}
message RejectMemberResponse {}
message SuspendMemberRequest {}
message SuspendMemberResponse {}
message ResumeMemberRequest {}
message ResumeMemberResponse {}
message FenceMemberRequest {}
message FenceMemberResponse {}
message PlanMemberRevokeRequest {}
message PlanMemberRevokeResponse {}
message RunMemberRevokeRequest {}
message RunMemberRevokeResponse {}
message ListMemberSessionsRequest {}
message ListMemberSessionsResponse {}
// `GET /host/v1/grants?principal&selector`: both filters optional, exact matches.
message ListGrantsRequest {
  string principal = 1;
  string selector = 2;
}
message ListGrantsResponse {
  // The store revision the list was read at.
  uint64 revision = 1;
  repeated Grant grants = 2;
}

// One grant, as the API shows it.
message Grant {
  string grant_id = 1;
  string principal = 2;
  repeated string operations = 3;
  string selector = 4;
  repeated string resource_types = 5;
  map<string, string> constraints = 6;
  uint64 revision = 7;
  // `active`, `revoked` or `expired`.
  string status = 8;
  string issued_by = 9;
  // RFC 3339.
  string issued_at = 10;
  // RFC 3339, when the grant expires.
  optional string expires_at = 11;
}

// The common envelope's receipt: `{operation_id, revision, audit}`.
message Receipt {
  string operation_id = 1;
  uint64 revision = 2;
  AuditReference audit = 3;
}

// Where the audit trail recorded a mutation; `seq` and `digest` arrive with the sealed trail.
message AuditReference {
  string trail = 1;
  optional uint64 seq = 2;
  optional string digest = 3;
}
// `POST /host/v1/grants`.
message CreateGrantRequest {
  string request_id = 1;
  optional uint64 expected_revision = 2;
  string principal = 3;
  repeated string operations = 4;
  string selector = 5;
  repeated string resource_types = 6;
  map<string, string> constraints = 7;
  // RFC 3339.
  optional string expires_at = 8;
}
message CreateGrantResponse {
  Receipt receipt = 1;
  Grant grant = 2;
}
// `POST /host/v1/grants/{id}/revoke/plan`.
message PlanGrantRevokeRequest {
  string grant_id = 1;
  string request_id = 2;
  optional uint64 expected_revision = 3;
}
message PlanGrantRevokeResponse {
  string plan_id = 1;
  string plan_digest = 2;
  // RFC 3339: when the plan can no longer be run.
  string expires = 3;
  // The grant revision the plan was made against.
  uint64 revision = 4;
}
// `POST /host/v1/grants/{id}/revoke/run`.
message RunGrantRevokeRequest {
  string grant_id = 1;
  string request_id = 2;
  string plan_id = 3;
  string plan_digest = 4;
}
message RunGrantRevokeResponse {
  Receipt receipt = 1;
  Grant grant = 2;
}
message ListKeyRingsRequest {}
message ListKeyRingsResponse {
  repeated KeyRingSummary rings = 1;
}

// One ring in the list.
message KeyRingSummary {
  string ring = 1;
  uint32 keys = 2;
  string digest = 3;
}
// `GET /host/v1/keys/{ring}`: public, no grant is checked.
message GetKeyRingRequest {
  string ring = 1;
}
message GetKeyRingResponse {
  string ring = 1;
  // The ring epoch, once the bindings carry one (WP-2.3).
  optional uint64 epoch = 2;
  // SHA-256 over the public set as published, hex.
  string digest = 3;
  // The signed binding of this ring to the Host identity (WP-2.3).
  optional string binding = 4;
  // How long a client may cache the set, in seconds.
  uint32 cache_max_age = 5;
  repeated Jwk keys = 6;
}

// One public key as RFC 7517 defines it; the private half is never expressed.
message Jwk {
  string kid = 1;
  string kty = 2;
  optional string crv = 3;
  string x = 4;
  optional string y = 5;
  string alg = 6;
  string use = 7;
}
message RotateKeyRingRequest {}
message RotateKeyRingResponse {}
message PlanKeyRevokeRequest {}
message PlanKeyRevokeResponse {}
message RunKeyRevokeRequest {}
message RunKeyRevokeResponse {}
message GetKeyBundleRequest {}
message GetKeyBundleResponse {}
message ListSecretsRequest {}
message ListSecretsResponse {}
message RotateSecretRequest {}
message RotateSecretResponse {}
message ListAuditRecordsRequest {}
message ListAuditRecordsResponse {}
message ListAuditCheckpointsRequest {}
message ListAuditCheckpointsResponse {}
message ExportAuditRequest {}
message ExportAuditResponse {}
message ListStreamsRequest {}
message ListStreamsResponse {}
message ShipStreamBatchRequest {}
message ShipStreamBatchResponse {}
message GetStreamFrontierRequest {}
message GetStreamFrontierResponse {}
message ListStreamRecordsRequest {}
message ListStreamRecordsResponse {}
message ListStreamSignersRequest {}
message ListStreamSignersResponse {}
message ListStreamSubscriptionsRequest {}
message ListStreamSubscriptionsResponse {}
message ListStreamGapsRequest {}
message ListStreamGapsResponse {}
message ListStreamAnchorsRequest {}
message ListStreamAnchorsResponse {}
message GetStatusRequest {}
message GetStatusResponse {
  bool live = 1;
  bool ready = 2;
  // The Host's phase.
  string state = 3;
  repeated HostDegraded degraded = 4;
  repeated HostComponent components = 5;
  Assurance assurance = 6;
}

// One capability served without its backing.
message HostDegraded {
  string capability = 1;
  string reason = 2;
}

// One component of the process, as the health document reports it; the instants are RFC 3339 and
// absent when the component has none to report.
message HostComponent {
  string component = 1;
  string kind = 2;
  string state = 3;
  bool required = 4;
  optional string stalled_since = 5;
  optional string last_success = 6;
  optional string next_attempt = 7;
  optional string reason = 8;
}

// The assurance profile the volume runs under.
message Assurance {
  string profile = 1;
  // Always `local`: the Host enforces its profile, it does not attest it.
  string enforcement = 2;
  // Controls of a higher profile the deployment switched on.
  repeated string added_controls = 3;
  // Relaxations the values in force amount to, each one the profile permits.
  repeated string relaxations = 4;
}
message DrainRequest {}
message DrainResponse {}
message MaintenanceRequest {}
message MaintenanceResponse {}
message GetEffectiveConfigRequest {}
message GetEffectiveConfigResponse {
  // `0`: the static configuration this process started with.
  uint64 revision = 1;
  repeated Setting settings = 2;
}

// One effective setting, its value masked when the key names a secret.
message Setting {
  string key = 1;
  // The value in force, the mask for a secret; absent when unset with no default.
  optional string value = 2;
  bool masked = 3;
  // `default` (the image's), `file`, `environment` or `command_line`.
  string origin = 4;
  // `startup` (varies per instance) or `static` (one file for every instance).
  string class = 5;
}
message ListConfigRevisionsRequest {}
message ListConfigRevisionsResponse {
  // Newest first.
  repeated ConfigRevision revisions = 1;
}

// One transition of a dynamic Host journal.
message ConfigRevision {
  // `grants` today.
  string journal = 1;
  uint64 revision = 2;
  string operation = 3;
  string target = 4;
  // RFC 3339.
  string at = 5;
  string by = 6;
}
message PrepareBackupRequest {}
message PrepareBackupResponse {}
message FinalizeBackupRequest {}
message FinalizeBackupResponse {}
message AbortBackupRequest {}
message AbortBackupResponse {}
message ListBackupsRequest {}
message ListBackupsResponse {}
message PlanGcRequest {}
message PlanGcResponse {}
message RunGcRequest {}
message RunGcResponse {}
message GetStorageQuotaRequest {}
message GetStorageQuotaResponse {}
message ProbeStorageRequest {}
message ProbeStorageResponse {}
message ListPlansRequest {}
message ListPlansResponse {}
message ApprovePlanRequest {}
message ApprovePlanResponse {}
