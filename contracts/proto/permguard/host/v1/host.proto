// The Host API, `permguard.host.v1`: the six services of the Host API contract, one RPC per
// operation it names.
//
// The contract names its operations and their REST paths, not their message fields, so a message
// gets its fields when the package that serves its operation defines the shape from the
// contract, and stays empty until then: no field number is assigned ahead of the contract. The
// Host listener (WP-2.5) serves `GrantService`, `KeyService.ListKeyRings`, `KeyService.GetKeyRing`
// and `OperationsService.GetStatus` and `GetEffectiveConfig`; `IdentityService.GetIdentity`,
// `ListRingBindings` and `OperationsService.ListConfigRevisions` answer `not_served_yet` with empty
// messages. The REST side of every served operation is `contracts/openapi/host.json`, and the
// mapping between the two is written there.
//
// The service, RPC and message names of the unserved operations are provisional: they are gRPC
// paths the contract does not name yet, chosen from its operations, and the implementing package
// confirms or renames them before anything serves them.
//
// The peer exchange (`hello`, both proofs, enrolment and every task message) is not a set of
// unary RPCs: the contract requires one long-lived framed channel bound to one TLS connection.
// `IdentityService.PeerChannel` reserves that bidirectional stream; its frames are defined with
// the peer protocol. It carries the enrolment and task messages the contract groups under
// membership, because they travel on the same proven connection.

syntax = "proto3";

package permguard.host.v1;


// REST group: identity and sessions.
service IdentityService {
  // `POST /host/v1/sessions/hello`, `…/sessions/prove`, `POST /host/v1/members/enroll`,
  // `POST /host/v1/tasks/{task}/session` and `…/progress`, on one framed channel.
  rpc PeerChannel(stream PeerFrame) returns (stream PeerFrame);
  // `GET /host/v1/identity`.
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  // `POST /host/v1/identity/rotate`.
  rpc RotateIdentity(RotateIdentityRequest) returns (RotateIdentityResponse);
  // `POST /host/v1/identity/reset/plan`.
  rpc PlanIdentityReset(PlanIdentityResetRequest) returns (PlanIdentityResetResponse);
  // `POST /host/v1/identity/reset/run`.
  rpc RunIdentityReset(RunIdentityResetRequest) returns (RunIdentityResetResponse);
  // `GET /host/v1/ring-bindings`.
  rpc ListRingBindings(ListRingBindingsRequest) returns (ListRingBindingsResponse);
}

// REST group: memberships and tasks.
service MembershipService {
  // `POST /host/v1/members/invites`.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // `GET /host/v1/members/invites`.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // `DELETE /host/v1/members/invites/{id}`.
  rpc DeleteInvite(DeleteInviteRequest) returns (DeleteInviteResponse);
  // `GET /host/v1/members`.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // `GET /host/v1/members/{id}`.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  // `POST /host/v1/members/{id}/approve`.
  rpc ApproveMember(ApproveMemberRequest) returns (ApproveMemberResponse);
  // `POST /host/v1/members/{id}/reject`.
  rpc RejectMember(RejectMemberRequest) returns (RejectMemberResponse);
  // `POST /host/v1/members/{id}/suspend`.
  rpc SuspendMember(SuspendMemberRequest) returns (SuspendMemberResponse);
  // `POST /host/v1/members/{id}/resume`.
  rpc ResumeMember(ResumeMemberRequest) returns (ResumeMemberResponse);
  // `POST /host/v1/members/{id}/fence`.
  rpc FenceMember(FenceMemberRequest) returns (FenceMemberResponse);
  // `POST /host/v1/members/{id}/appraise`: the assurance binding renewed or revoked (WP-4.2).
  rpc AppraiseMember(AppraiseMemberRequest) returns (AppraiseMemberResponse);
  // `POST /host/v1/members/{id}/revoke/plan`.
  rpc PlanMemberRevoke(PlanMemberRevokeRequest) returns (PlanMemberRevokeResponse);
  // `POST /host/v1/members/{id}/revoke/run`.
  rpc RunMemberRevoke(RunMemberRevokeRequest) returns (RunMemberRevokeResponse);
  // `GET /host/v1/members/{id}/sessions`.
  rpc ListMemberSessions(ListMemberSessionsRequest) returns (ListMemberSessionsResponse);
  // `POST /host/v1/memberships/join`: this Host, as a member, enrols with a coordinator (WP-4.1).
  rpc JoinMembership(JoinMembershipRequest) returns (JoinMembershipResponse);
  // `POST /host/v1/memberships/{id}/sync`: this Host, as a member, fetches its manifests (WP-4.1).
  rpc SyncMembership(SyncMembershipRequest) returns (SyncMembershipResponse);
}

// REST group: grants.
service GrantService {
  // `GET /host/v1/grants`.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  // `POST /host/v1/grants`.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  // `POST /host/v1/grants/{id}/revoke/plan`.
  rpc PlanGrantRevoke(PlanGrantRevokeRequest) returns (PlanGrantRevokeResponse);
  // `POST /host/v1/grants/{id}/revoke/run`.
  rpc RunGrantRevoke(RunGrantRevokeRequest) returns (RunGrantRevokeResponse);
}

// REST group: keys and secrets.
service KeyService {
  // `GET /host/v1/keys`.
  rpc ListKeyRings(ListKeyRingsRequest) returns (ListKeyRingsResponse);
  // `GET /host/v1/keys/{ring}`.
  rpc GetKeyRing(GetKeyRingRequest) returns (GetKeyRingResponse);
  // `POST /host/v1/keys/{ring}/rotate`.
  rpc RotateKeyRing(RotateKeyRingRequest) returns (RotateKeyRingResponse);
  // `POST /host/v1/keys/{ring}/revoke/plan`.
  rpc PlanKeyRevoke(PlanKeyRevokeRequest) returns (PlanKeyRevokeResponse);
  // `POST /host/v1/keys/{ring}/revoke/run`.
  rpc RunKeyRevoke(RunKeyRevokeRequest) returns (RunKeyRevokeResponse);
  // `GET /host/v1/keys/bundle`.
  rpc GetKeyBundle(GetKeyBundleRequest) returns (GetKeyBundleResponse);
  // `GET /host/v1/secrets`.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // `POST /host/v1/secrets/{ref}/rotate`.
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
}

// REST group: audit and streams.
service EvidenceService {
  // `GET /host/v1/audit/{class}/records`.
  rpc ListAuditRecords(ListAuditRecordsRequest) returns (ListAuditRecordsResponse);
  // `GET /host/v1/audit/{class}/checkpoints`.
  rpc ListAuditCheckpoints(ListAuditCheckpointsRequest) returns (ListAuditCheckpointsResponse);
  // `GET /host/v1/audit/{class}/export`.
  rpc ExportAudit(ExportAuditRequest) returns (ExportAuditResponse);
  // `GET /host/v1/streams`.
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse);
  // `POST /host/v1/streams/{plane}/{type}/batches`.
  rpc ShipStreamBatch(ShipStreamBatchRequest) returns (ShipStreamBatchResponse);
  // `GET /host/v1/streams/{plane}/{type}/frontier`.
  rpc GetStreamFrontier(GetStreamFrontierRequest) returns (GetStreamFrontierResponse);
  // `GET /host/v1/streams/{plane}/{type}/records`.
  rpc ListStreamRecords(ListStreamRecordsRequest) returns (ListStreamRecordsResponse);
  // `GET /host/v1/streams/{plane}/{type}/signers`.
  rpc ListStreamSigners(ListStreamSignersRequest) returns (ListStreamSignersResponse);
  // `GET /host/v1/streams/{plane}/{type}/subscriptions`.
  rpc ListStreamSubscriptions(ListStreamSubscriptionsRequest) returns (ListStreamSubscriptionsResponse);
  // `GET /host/v1/streams/{plane}/{type}/gaps`.
  rpc ListStreamGaps(ListStreamGapsRequest) returns (ListStreamGapsResponse);
  // `GET /host/v1/streams/{plane}/{type}/anchors`.
  rpc ListStreamAnchors(ListStreamAnchorsRequest) returns (ListStreamAnchorsResponse);
}

// REST group: lifecycle and storage.
service OperationsService {
  // `GET /host/v1/status`.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // `POST /host/v1/drain`.
  rpc Drain(DrainRequest) returns (DrainResponse);
  // `POST /host/v1/maintenance`.
  rpc Maintenance(MaintenanceRequest) returns (MaintenanceResponse);
  // `GET /host/v1/config/effective`.
  rpc GetEffectiveConfig(GetEffectiveConfigRequest) returns (GetEffectiveConfigResponse);
  // `GET /host/v1/config/revisions`.
  rpc ListConfigRevisions(ListConfigRevisionsRequest) returns (ListConfigRevisionsResponse);
  // `POST /host/v1/backup/prepare`.
  rpc PrepareBackup(PrepareBackupRequest) returns (PrepareBackupResponse);
  // `POST /host/v1/backup/finalize`.
  rpc FinalizeBackup(FinalizeBackupRequest) returns (FinalizeBackupResponse);
  // `POST /host/v1/backup/abort`.
  rpc AbortBackup(AbortBackupRequest) returns (AbortBackupResponse);
  // `GET /host/v1/backups`.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  // `POST /host/v1/gc/{job}/plan`.
  rpc PlanGc(PlanGcRequest) returns (PlanGcResponse);
  // `POST /host/v1/gc/{job}/run`.
  rpc RunGc(RunGcRequest) returns (RunGcResponse);
  // `GET /host/v1/storage/quota`.
  rpc GetStorageQuota(GetStorageQuotaRequest) returns (GetStorageQuotaResponse);
  // `POST /host/v1/storage/probe`.
  rpc ProbeStorage(ProbeStorageRequest) returns (ProbeStorageResponse);
  // `GET /host/v1/plans`.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  // `POST /host/v1/plans/{id}/approve`.
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse);
}

// A frame of the peer channel (WP-2.3): one message of the session protocol, its bytes the
// canonical CBOR `contracts/cbor/session.json` defines. The sender's identity comes first,
// then `hello`, `challenge` and the two proofs; task messages follow once the session is
// established. No frame ever carries a TLS exporter: each side takes its own from the
// connection.
message PeerFrame {
  oneof frame {
    // The sender's presentation: identity document, succession records, epoch-1 public key.
    bytes identity = 1;
    bytes hello = 2;
    bytes challenge = 3;
    // A COSE_Sign1 `permguard.host.proof.v1` over the transcript.
    bytes proof = 4;
    // A task message, inside an established session (WP-11).
    bytes task = 5;
    // The other side refused: a stable code, nothing more. A refusal of the session ends the
    // channel; `not_served_yet` answers a task message and keeps it.
    PeerRefusal refusal = 6;
  }
}

// Why the other side refused.
message PeerRefusal {
  string code = 1;
}

message GetIdentityRequest {}
// `GET /host/v1/identity` (WP-2.2): the signed document of the current epoch and every
// succession record, COSE_Sign1 bytes each; the epoch-1 public key the first fingerprint pins.
message GetIdentityResponse {
  bytes document = 1;
  repeated bytes successions = 2;
  bytes first_public_key = 3;
  repeated string protocol_versions = 4;
}
// `POST /host/v1/identity/rotate` (WP-2.2), under `identity.admin`.
message RotateIdentityRequest {
  string request_id = 1;
  uint64 expected_epoch = 2;
}
message RotateIdentityResponse {
  Receipt receipt = 1;
  // The succession record to the new epoch, COSE_Sign1.
  bytes succession = 2;
}
// `POST /host/v1/identity/reset/plan` (WP-4.1), under `identity.admin`.
message PlanIdentityResetRequest {
  string request_id = 1;
  // `normal` or `emergency`.
  string mode = 2;
  string reason = 3;
}
message PlanIdentityResetResponse {
  string plan_id = 1;
  string plan_digest = 2;
  string expires = 3;
  // The identity epoch the plan was made at.
  uint64 revision = 4;
  string mode = 5;
  repeated ResetMembership memberships = 6;
}
// One live membership, and what a reset does to it.
message ResetMembership {
  string membership_id = 1;
  string role = 2;
  string status = 3;
  MembershipHost peer = 4;
  optional string address = 5;
  // `revoke_remote`, `revoke_local` or `reject_local`.
  string step = 6;
}
// `POST /host/v1/identity/reset/run` (WP-4.1), under `identity.admin`.
message RunIdentityResetRequest {
  string request_id = 1;
  string plan_id = 2;
  string plan_digest = 3;
}
message RunIdentityResetResponse {
  Receipt receipt = 1;
  string old_host_id = 2;
  string host_id = 3;
  string fingerprint = 4;
  string witness = 5;
  repeated ResetEnded ended = 6;
  repeated ResetOrphaned orphaned = 7;
  // Always true: the process serves the new identity after a restart.
  bool restart_required = 8;
}
// A membership the reset ended, with its last manifest, COSE_Sign1.
message ResetEnded {
  string membership_id = 1;
  string role = 2;
  string status = 3;
  uint64 epoch = 4;
  optional bytes manifest = 5;
}
// A membership the reset left `orphaned`: its coordinator revokes it out of band.
message ResetOrphaned {
  string membership_id = 1;
  MembershipHost coordinator = 2;
  optional string address = 3;
}
// `GET /host/v1/ring-bindings` (WP-3.1), under `identity.read`.
message ListRingBindingsRequest {}
message ListRingBindingsResponse {
  repeated RingBinding bindings = 1;
}

// One identity-signed ring binding.
message RingBinding {
  string ring = 1;
  uint64 epoch = 2;
  // COSE_Sign1 `permguard.host.ring-binding.v1`.
  bytes binding = 3;
}
// `POST /host/v1/members/invites` (WP-4.1), under `membership.admin`.
message CreateInviteRequest {
  string request_id = 1;
  string selector = 2;
  repeated MembershipTask tasks = 3;
  // RFC 3339; 24 hours from now when absent, at most 7 days.
  optional string expires = 4;
  optional string expected_fingerprint = 5;
  optional string min_assurance = 6;
  // 1 when absent: an invitation is used once.
  optional uint64 max_uses = 7;
}
message CreateInviteResponse {
  Receipt receipt = 1;
  string invite_id = 2;
  // 256 random bits: answered once, held nowhere.
  bytes token = 3;
  // RFC 3339.
  string expires = 4;
}
// One task a membership grants.
message MembershipTask {
  string task_id = 1;
  // `policy.mirror`, `decisions.ship`, `events.ship`, `events.import`, `audit.checkpoints`,
  // `zone.secrets`.
  string type = 2;
  // The roles the type fixes: answered; on a request, empty or the type's own.
  string provider_role = 3;
  string consumer_role = 4;
  string selector = 5;
  repeated string resource_types = 6;
  bool required = 7;
  TaskLimits limits = 8;
  repeated string assurance_requirements = 9;
}
// A task's limits.
message TaskLimits {
  uint64 max_body_bytes = 1;
  uint64 max_concurrency = 2;
  uint64 max_rate_per_minute = 3;
  uint64 max_batch_records = 4;
  uint64 retention_seconds = 5;
}
// `GET /host/v1/members/invites` (WP-4.1), under `membership.read`.
message ListInvitesRequest {}
message ListInvitesResponse {
  repeated Invite invites = 1;
}
// One invitation, never its token nor anything that signs for it.
message Invite {
  string invite_id = 1;
  // Was the token's hash: it signed for the token (WP-4.1 review).
  reserved 2;
  reserved "token_hash";
  string selector = 3;
  repeated MembershipTask tasks = 4;
  string expires = 5;
  optional string expected_fingerprint = 6;
  optional string min_assurance = 7;
  uint64 max_uses = 8;
  // `issued`, `consumed`, `expired` or `revoked`.
  string status = 9;
  string created_at = 10;
  string created_by = 11;
}
// `DELETE /host/v1/members/invites/{id}` (WP-4.1), under `membership.admin`.
message DeleteInviteRequest {
  string invite_id = 1;
  string request_id = 2;
}
message DeleteInviteResponse {
  Receipt receipt = 1;
}
// `GET /host/v1/members?status=` (WP-4.1), under `membership.read`: empty is every status.
message ListMembersRequest {
  string status = 1;
}
message ListMembersResponse {
  repeated Member members = 1;
}
// `GET /host/v1/members/{id}` (WP-4.1), under `membership.read`.
message GetMemberRequest {
  string membership_id = 1;
}
message GetMemberResponse {
  Member member = 1;
}
// One membership, as an operator reads it.
message Member {
  string membership_id = 1;
  // This Host's role in it: `coordinator` or `member`.
  string role = 2;
  string status = 3;
  // One more at every manifest; 0 while pending.
  uint64 epoch = 4;
  // What `expected_revision` names.
  uint64 revision = 5;
  MembershipHost coordinator = 6;
  MembershipHost member = 7;
  string selector = 8;
  repeated MembershipTask tasks = 9;
  string member_assurance = 10;
  // Absent while pending.
  LeasePolicy lease_policy = 11;
  // The manifest in force, COSE_Sign1; absent while pending.
  optional bytes manifest = 12;
  string updated_at = 13;
  // The last task session: sessions come with WP-4.3.
  optional string last_session_at = 14;
  // The assurance binding the manifest signs; absent when it signs none (WP-4.2).
  AssuranceBinding assurance = 15;
  // While the coordinator appraises the tasks' controls; absent otherwise (WP-4.2).
  AppraisalState appraisal = 16;
}
// An assurance binding, as an operator reads it (WP-4.2).
message AssuranceBinding {
  // `accepted` or `revoked`.
  string verdict = 1;
  // Whether it admits tasks now.
  bool current = 2;
  string policy_revision = 3;
  repeated string task_ids = 4;
  repeated AssuranceClaim claims = 5;
  string appraised_by = 6;
  string issued_at = 7;
  string expires_at = 8;
  // What a task admission answers it by.
  string binding_digest = 9;
}
// One claim of a binding, without the record it cites.
message AssuranceClaim {
  string control = 1;
  // `declared`, `operator-approved` or `attested`.
  string class = 2;
  // The declared profile, the approving principal or the verifier id.
  string by = 3;
}
// The appraisal state of a membership whose tasks require controls.
message AppraisalState {
  string policy_revision = 1;
  // The nonce evidence for this revision binds to.
  bytes nonce = 2;
  repeated AssuranceRequirement requirements = 3;
}
// One control the tasks require.
message AssuranceRequirement {
  string control = 1;
  // The least class the policy wants; absent when it does not appraise the control.
  optional string wants = 2;
  // Whether the member's declaration meets it.
  bool declared = 3;
}
// What an approval or an appraisal brings for the controls the tasks require (WP-4.2).
message AssuranceOffer {
  repeated OperatorApproval approvals = 1;
  repeated AttestationEvidence evidence = 2;
}
// An operator's approval of one control; the principal is the caller's.
message OperatorApproval {
  string control = 1;
  string reason = 2;
  string expires_at = 3;
}
// One piece of evidence for a registered verifier; kept by its digest alone.
message AttestationEvidence {
  string verifier = 1;
  bytes evidence = 2;
}
// A Host as a membership pins it.
message MembershipHost {
  string host_id = 1;
  uint64 epoch = 2;
  // The first fingerprint: the identity's pin.
  string fingerprint = 3;
}
// The lease policy a manifest signs.
message LeasePolicy {
  uint64 max_session_seconds = 1;
  uint64 offline_grace_seconds = 2;
  uint64 clock_skew_seconds = 3;
  uint64 dormant_after_seconds = 4;
  uint64 revoke_after_seconds = 5;
}
// A selector and tasks: an approval's narrowing, a join's request.
message MembershipScope {
  string selector = 1;
  repeated MembershipTask tasks = 2;
}
// `POST /host/v1/members/{id}/approve` (WP-4.1), under `membership.admin`.
message ApproveMemberRequest {
  string membership_id = 1;
  string request_id = 2;
  uint64 expected_revision = 3;
  // A narrowing of the request, never wider.
  MembershipScope narrow = 4;
  LeasePolicy lease_policy = 5;
  // What the tasks' controls are appraised with (WP-4.2).
  AssuranceOffer assurance = 6;
}
message ApproveMemberResponse {
  Receipt receipt = 1;
  string status = 2;
  uint64 epoch = 3;
  // The manifest issued, COSE_Sign1.
  bytes manifest = 4;
}
// `POST /host/v1/members/{id}/reject` (WP-4.1), under `membership.admin`.
message RejectMemberRequest {
  string membership_id = 1;
  string request_id = 2;
  uint64 expected_revision = 3;
  optional string reason = 4;
}
message RejectMemberResponse {
  Receipt receipt = 1;
  string status = 2;
  uint64 epoch = 3;
  bytes manifest = 4;
}
// `POST /host/v1/members/{id}/suspend` (WP-4.1), under `membership.admin`.
message SuspendMemberRequest {
  string membership_id = 1;
  string request_id = 2;
  uint64 expected_revision = 3;
  optional string reason = 4;
}
message SuspendMemberResponse {
  Receipt receipt = 1;
  string status = 2;
  uint64 epoch = 3;
  bytes manifest = 4;
}
// `POST /host/v1/members/{id}/resume` (WP-4.1), under `membership.admin`.
message ResumeMemberRequest {
  string membership_id = 1;
  string request_id = 2;
  uint64 expected_revision = 3;
  optional string reason = 4;
}
message ResumeMemberResponse {
  Receipt receipt = 1;
  string status = 2;
  uint64 epoch = 3;
  bytes manifest = 4;
}
// `POST /host/v1/members/{id}/fence` (WP-4.1), under `membership.admin`.
message FenceMemberRequest {
  string membership_id = 1;
  string request_id = 2;
  uint64 expected_revision = 3;
  optional string reason = 4;
}
message FenceMemberResponse {
  Receipt receipt = 1;
  string status = 2;
  uint64 epoch = 3;
  bytes manifest = 4;
}
// `POST /host/v1/members/{id}/appraise` (WP-4.2), under `membership.admin`.
message AppraiseMemberRequest {
  string membership_id = 1;
  string request_id = 2;
  uint64 expected_revision = 3;
  repeated OperatorApproval approvals = 4;
  repeated AttestationEvidence evidence = 5;
  // Revokes the binding instead.
  RevokeBinding revoke = 6;
}
// Why a binding is revoked.
message RevokeBinding {
  string reason = 1;
}
message AppraiseMemberResponse {
  Receipt receipt = 1;
  string status = 2;
  uint64 epoch = 3;
  bytes manifest = 4;
}
// `POST /host/v1/members/{id}/revoke/plan` (WP-4.1), under `membership.admin`.
message PlanMemberRevokeRequest {
  string membership_id = 1;
  string request_id = 2;
  string reason = 3;
  optional uint64 expected_revision = 4;
}
message PlanMemberRevokeResponse {
  string plan_id = 1;
  string plan_digest = 2;
  string expires = 3;
  uint64 revision = 4;
}
// `POST /host/v1/members/{id}/revoke/run` (WP-4.1), under `membership.admin`.
message RunMemberRevokeRequest {
  string membership_id = 1;
  string request_id = 2;
  string plan_id = 3;
  string plan_digest = 4;
}
message RunMemberRevokeResponse {
  Receipt receipt = 1;
  string status = 2;
  uint64 epoch = 3;
  bytes manifest = 4;
}
message ListMemberSessionsRequest {}
message ListMemberSessionsResponse {}
// `POST /host/v1/memberships/join` (WP-4.1), under `membership.admin`: the coordinator, the
// invitation and its token, from the coordinator's operator out of band.
message JoinMembershipRequest {
  string request_id = 1;
  MembershipCoordinator coordinator = 2;
  string invite_id = 3;
  // Never kept.
  bytes token = 4;
  MembershipScope requested = 5;
}
// Where and who the coordinator is.
message MembershipCoordinator {
  // `https://<host>:<port>`.
  string address = 1;
  string host_id = 2;
  string fingerprint = 3;
}
message JoinMembershipResponse {
  Member member = 1;
}
// `POST /host/v1/memberships/{id}/sync` (WP-4.1), under `membership.admin`.
message SyncMembershipRequest {
  string membership_id = 1;
  string request_id = 2;
}
message SyncMembershipResponse {
  Member member = 1;
}
// `GET /host/v1/grants?principal&selector`: both filters optional, exact matches.
message ListGrantsRequest {
  string principal = 1;
  string selector = 2;
}
message ListGrantsResponse {
  // The store revision the list was read at.
  uint64 revision = 1;
  repeated Grant grants = 2;
}

// One grant, as the API shows it.
message Grant {
  string grant_id = 1;
  string principal = 2;
  repeated string operations = 3;
  string selector = 4;
  repeated string resource_types = 5;
  map<string, string> constraints = 6;
  uint64 revision = 7;
  // `active`, `revoked` or `expired`.
  string status = 8;
  string issued_by = 9;
  // RFC 3339.
  string issued_at = 10;
  // RFC 3339, when the grant expires.
  optional string expires_at = 11;
}

// The common envelope's receipt: `{operation_id, revision, audit}`.
message Receipt {
  string operation_id = 1;
  uint64 revision = 2;
  AuditReference audit = 3;
}

// Where the audit trail recorded a mutation; `seq` and `digest` arrive with the sealed trail.
message AuditReference {
  string trail = 1;
  optional uint64 seq = 2;
  optional string digest = 3;
}
// `POST /host/v1/grants`.
message CreateGrantRequest {
  string request_id = 1;
  optional uint64 expected_revision = 2;
  string principal = 3;
  repeated string operations = 4;
  string selector = 5;
  repeated string resource_types = 6;
  map<string, string> constraints = 7;
  // RFC 3339.
  optional string expires_at = 8;
}
message CreateGrantResponse {
  Receipt receipt = 1;
  Grant grant = 2;
}
// `POST /host/v1/grants/{id}/revoke/plan`.
message PlanGrantRevokeRequest {
  string grant_id = 1;
  string request_id = 2;
  optional uint64 expected_revision = 3;
}
message PlanGrantRevokeResponse {
  string plan_id = 1;
  string plan_digest = 2;
  // RFC 3339: when the plan can no longer be run.
  string expires = 3;
  // The grant revision the plan was made against.
  uint64 revision = 4;
}
// `POST /host/v1/grants/{id}/revoke/run`.
message RunGrantRevokeRequest {
  string grant_id = 1;
  string request_id = 2;
  string plan_id = 3;
  string plan_digest = 4;
}
message RunGrantRevokeResponse {
  Receipt receipt = 1;
  Grant grant = 2;
}
message ListKeyRingsRequest {}
message ListKeyRingsResponse {
  repeated KeyRingSummary rings = 1;
}

// One ring in the list.
message KeyRingSummary {
  string ring = 1;
  uint32 keys = 2;
  // The key-set digest of the published set, hex.
  string digest = 3;
  // The ring epoch (WP-3.1).
  uint64 epoch = 4;
}
// `GET /host/v1/keys/{ring}`: public, no grant is checked.
message GetKeyRingRequest {
  string ring = 1;
}
message GetKeyRingResponse {
  string ring = 1;
  // The ring epoch (WP-3.1).
  optional uint64 epoch = 2;
  // The key-set digest of the published set, hex: what a peer persists with the epoch.
  string digest = 3;
  // The identity-signed binding of this epoch, COSE_Sign1; absent for `host.identity`.
  optional bytes binding = 4;
  // How long a client may cache the set, in seconds.
  uint32 cache_max_age = 5;
  repeated Jwk keys = 6;
}

// One public key as RFC 7517 defines it; the private half is never expressed.
message Jwk {
  string kid = 1;
  string kty = 2;
  optional string crv = 3;
  string x = 4;
  optional string y = 5;
  string alg = 6;
  string use = 7;
}
// `POST /host/v1/keys/{ring}/rotate` (WP-3.1), under `keys.admin`.
message RotateKeyRingRequest {
  string ring = 1;
  string request_id = 2;
  uint64 expected_epoch = 3;
}
message RotateKeyRingResponse {
  Receipt receipt = 1;
  // The successor prepublished.
  string kid = 2;
}
// `POST /host/v1/keys/{ring}/revoke/plan` (WP-3.1), under `keys.admin`.
message PlanKeyRevokeRequest {
  string ring = 1;
  string request_id = 2;
  string kid = 3;
  string reason = 4;
  // RFC 3339.
  optional string compromised_at = 5;
  optional uint64 expected_epoch = 6;
}
message PlanKeyRevokeResponse {
  string plan_id = 1;
  string plan_digest = 2;
  // RFC 3339: when the plan can no longer be run.
  string expires = 3;
  // The ring epoch the plan was made against.
  uint64 revision = 4;
}
// `POST /host/v1/keys/{ring}/revoke/run` (WP-3.1), under `keys.admin`.
message RunKeyRevokeRequest {
  string ring = 1;
  string request_id = 2;
  string plan_id = 3;
  string plan_digest = 4;
}
message RunKeyRevokeResponse {
  Receipt receipt = 1;
  string kid = 2;
}
message GetKeyBundleRequest {
  // The resource the bundle covers, in the Host API's grammar: `host`, `plane/<p>`, ...
  string resource = 1;
  // The manifest a first page answered, base64url, which fixes the frontier; empty on the first
  // page (WP-3.4).
  string frontier = 2;
  // Where the page starts, as the page before answered it; requires `frontier`.
  string cursor = 3;
  // How many items the page carries: 1 to 500, 100 when absent.
  optional uint32 limit = 4;
}
message GetKeyBundleResponse {
  reserved 2;
  string resource = 1;
  // The signed manifest, COSE_Sign1 `permguard.keys.bundle.v1`, the same bytes on every page of
  // one frontier: a later page names it, base64url, as `frontier`.
  bytes manifest = 3;
  // The bundle digest, hex.
  string bundle_digest = 4;
  // How many items the whole bundle holds.
  uint64 total = 5;
  // This page's items, canonical CBOR each, in the bundle's digest order: identity, key,
  // binding, revocation, and the peer and peers items of the members this Host coordinates
  // (WP-4.1).
  repeated bytes items = 6;
  // The cursor of the next page; absent on the last one.
  optional string next_cursor = 7;
}
