  GcReport report = 4;
  Receipt receipt = 5;
}
// What a garbage-collection plan or run found, resource by resource.
message GcReport {
  repeated GcEntry entries = 1;
  // The resource a run stopped in at its bound.
  optional string resumes_at = 2;
  // The resources it could not read, and why: nothing of them was removed.
  repeated string skipped = 3;
  // Resources past the report's bound it does not list.
  uint64 omitted = 4;
}
message GcEntry {
  string resource = 1;
  uint64 candidates = 2;
  uint64 candidate_bytes = 3;
  // Zero for a plan.
  uint64 removed = 4;
  uint64 removed_bytes = 5;
  repeated GcKept kept = 6;
}
// What a sweep kept for one reason: `reachable`, `pinned`, `grace`, `held` or `bound`.
message GcKept {
  string reason = 1;
  uint64 count = 2;
}
message GetStorageQuotaRequest {}
message GetStorageQuotaResponse {}
message ProbeStorageRequest {}
message ProbeStorageResponse {}
// `GET /host/v1/plans?status` (WP-3.9): the plans whose operation the caller may do.
message ListPlansRequest {
  // `pending`, `ready`, `consumed` or `expired`; empty is every status.
  string status = 1;
}
message ListPlansResponse {
  repeated OperationPlan plans = 1;
}
// One plan of the plans store (WP-3.9).
message OperationPlan {
  string plan_id = 1;
  // `grant.revoke`, `keys.revoke`, `membership.revoke` or `identity.reset`.
  string operation = 2;
  string target = 3;
  uint64 revision = 4;
  // The planner.
  string principal = 5;
  string plan_digest = 6;
  // RFC 3339.
  string expires = 7;
  uint64 approvals_required = 8;
  repeated OperationPlanApproval approvals = 9;
  // `pending`, `ready`, `consumed` or `expired`; listed for the replay window past its expiry.
  string status = 10;
  // COSE_Sign1 `permguard.operation.plan.v1`, to the planner alone; empty for anyone else.
  bytes receipt = 11;
}
// One approval of a plan, attested by the Host (WP-3.9).
message OperationPlanApproval {
  string principal = 1;
  // RFC 3339.
  string approved_at = 2;
  // COSE_Sign1 `permguard.operation.approval.v1`.
  bytes approval = 3;
}
// `POST /host/v1/plans/{id}/approve` (WP-3.9), under the plan's operation grant.
message ApprovePlanRequest {
  string plan_id = 1;
  string request_id = 2;
}
message ApprovePlanResponse {
  Receipt receipt = 1;
  OperationPlan plan = 2;
}
