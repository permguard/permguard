# Supply-chain gates for the Permguard workspace.
#
# This file exists before the HTTP and gRPC stacks land on purpose. Turning `cargo deny` on after
# pulling in axum, tonic, hyper and rustls means the first run reports a wall of findings and nobody
# can tell which ones are ours. Turning it on while the tree is small means every later addition is
# reviewed one at a time, which is the only way the review actually happens.

[graph]
all-features = true

# The platforms this product is actually built for: the image is Debian, and it is developed on
# macOS and Linux. Without this, `cargo deny` reads the whole lock file — including the Windows and
# UEFI dependencies that exist in it only because something declares them for targets nobody here
# compiles — and reports duplicates in code that is never built.
#
# Narrowing the question is not hiding the answer: a crate that is never compiled cannot end up in a
# binary, and a warning about one is noise that makes the real warnings harder to see.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[advisories]
# A crate with a known advisory stops the build. A deliberate exception goes in `ignore` with the
# advisory id and a reason, so the exception is reviewable instead of invisible.
yanked = "deny"
ignore = [
    # `smartstring` has no maintainer. It is not a vulnerability — there is no CVE and no known
    # exploit — but there is also no safe upgrade: every version is affected, and the advisory's
    # own advice is to migrate to `compact_str` or `smol_str`.
    #
    # Not ours to migrate. It arrives through `rhai`, a non-optional dependency of
    # `amzn-dogwood-language` and the sandbox Dogwood evaluates information providers in, so the
    # fix belongs upstream and has been reported there. There is no configuration of Dogwood that
    # omits it.
    #
    # What bounds the exposure meanwhile: the crate is linked always and *executed* only when a
    # partition declares providers, and provider execution runs under the operation, depth, size
    # and time limits the Dogwood adapter imposes. A ledger with no `providers.json` never reaches
    # this code.
    #
    # TO REMOVE: when Dogwood moves off `smartstring`, or when the crate is adopted again.
    { id = "RUSTSEC-2026-0249", reason = "unmaintained `smartstring`, reached only through Dogwood's provider sandbox; reported upstream, no alternative configuration exists" },
]

[licenses]
# Permissive licences only. Anything copyleft reaching a binary a customer runs is a legal question,
# and a legal question should not be answered by a transitive dependency bump.
# Only what the tree actually uses. An allowance nobody matches is an allowance nobody reviewed:
# `cargo deny` reports it, and a warning list with permanent noise in it is a warning list nobody
# reads. Adding one back is a line, and a deliberate one.
allow = [
    "Apache-2.0",
    # LLVM's linking exception only ever *relaxes* Apache-2.0; reached through
    # cedar-policy → stacker → psm → ar_archive_writer (build-time only).
    "Apache-2.0 WITH LLVM-exception",
    # MIT without even the attribution clause; reached through cedar-policy's
    # URI handling (borrow-or-share).
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # ── Reached only through the experimental Dogwood runtime ──────────────────────────────────
    #
    # MPL-2.0 is copyleft, and this file says a legal question should not be answered by a
    # transitive bump. So it is answered here, deliberately, once.
    #
    # It is *file-level* copyleft: the obligation attaches to the licensed files, not to the
    # program linking them, and MPL-2.0 §3.3 says so explicitly — unlike the GPL, a binary that
    # links it does not become MPL. Permguard does not modify the crate, so the duty is the notice
    # and the pointer to source that `NOTICE.md` now carries.
    #
    # Reached through `rhai`, the sandbox Dogwood runs information providers in. It is a
    # non-optional dependency of that crate — no feature removes it — so accepting it and dropping
    # provider support are the only two options, and dropping providers would remove
    # `permguard.dogwood.provider.rhai.v1` from the artifact registry.
    "MPL-2.0",
    # A public-domain dedication, reached through a proc-macro (`const-random-macro`) that runs in
    # the compiler and is never linked into a shipped binary.
    "CC0-1.0",
]
confidence-threshold = 0.9

# Dogwood's crate manifest carries no `license` field, so `cargo deny` cannot read one and reports
# the crate as unlicensed. It is not: the repository is Apache-2.0, with the licence text at
# `LICENSE` and the attribution at `NOTICE`, both reviewed at the pinned revision and reproduced in
# this repository's `NOTICE.md`. Clarified here rather than ignored, so the claim is recorded with
# the file it was read from.
[[licenses.clarify]]
crate = "amzn-dogwood-language"
expression = "Apache-2.0"
license-files = []

[bans]
# Two versions of the same crate in one binary is usually harmless and occasionally a security
# problem: it means one copy is patched and the other is not.
multiple-versions = "warn"
wildcards = "deny"
deny = []

# The three below are not that. Each is a duplicate between the compiler's world and the binary's,
# and it was checked rather than assumed — `cargo tree --edges normal,no-proc-macro` reports exactly
# one `getrandom`, exactly one `hashbrown` and no `syn` at all in what actually gets linked.
#
# They are skipped by version so the exception stays narrow: a second copy appearing in the runtime
# graph, which is the case the rule exists for, would still be reported. The build-time copies are
# not unexamined — the advisories check reads every crate in the lock file whatever it is used for.
skip = [
    { crate = "getrandom@0.4", reason = "build script of tonic-prost-build, via prost-build and tempfile; the binary links only 0.2 through ring" },
    { crate = "hashbrown@0.15", reason = "prost-build's petgraph, at compile time; the binary links only 0.17 through indexmap" },
    { crate = "syn@2", reason = "x509-parser's derive macros; proc-macro crates run in the compiler and are never linked into the binary" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Dogwood is not on crates.io — it is published to an internal registry — so the reviewed upstream
# repository is the only reproducible coordinate for it. Allowed by name and pinned in
# `permguard-languages/Cargo.toml` to an immutable revision, never a branch: an allowed git source
# that tracked a moving ref would mean the reviewed code and the built code are different things.
#
# TO REMOVE: the day `amzn-dogwood-language` is published to crates.io, replace the `git`/`rev`
# dependency with a version requirement and delete this line. That retirement is independent of the
# MPL-2.0 allowance above — `smartstring` arrives through Dogwood's own `rhai` dependency, not
# through the way Dogwood itself is fetched, so publishing the crate does not retire it.
allow-git = ["https://github.com/dogwood-policy/dogwood"]
