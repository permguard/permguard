[workspace]
resolver = "3"
members = [
    "crates/permguard-all-in-one",
    "crates/permguard-authority-plane",
    "crates/permguard-authority-plane-server",
    "crates/permguard-cli",
    "crates/permguard-conformance",
    "crates/permguard-contracts",
    "crates/permguard-control-plane",
    "crates/permguard-control-plane-server",
    "crates/permguard-core",
    "crates/permguard-data-plane",
    "crates/permguard-data-plane-server",
    "crates/permguard-decisions",
    "crates/permguard-events",
    "crates/permguard-host",
    "crates/permguard-mirror",
    "crates/permguard-notp",
    "crates/permguard-client",
    "crates/permguard-objects",
    "crates/permguard-pdp-core",
    "crates/permguard-language-cedar",
    "crates/permguard-language-core",
    "crates/permguard-language-dogwood",
    "crates/permguard-language-rego",
    "crates/permguard-languages",
    "crates/permguard-server",
    "crates/permguard-std",
    "crates/permguard-stream",
    "crates/permguard-telemetry",
    "crates/permguard-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/permguard/permguard"

# Debug information, without the part that makes a debug binary a hundred megabytes.
#
# `target/` keeps one artifact per combination of inputs — dependency versions, feature sets, test
# harnesses — and Cargo never collects the old ones. A day of dependency bumps and `--all-features`
# runs leaves dozens, and at full DWARF each is enormous. Line tables keep what is actually used
# every day: a panic still names the file and the line. What is given up is inspecting variables in
# a debugger, and a session that needs it can rebuild with `RUSTFLAGS="-C debuginfo=2"`.
[profile.dev]
debug = "line-tables-only"

# Tests inherit `dev` for this, and they are where most of the artifacts come from.
[profile.test]
debug = "line-tables-only"

# Third-party crates built with optimizations in debug builds and tests: the cryptography, CBOR
# and TLS the tests run every time execute faster, and they are compiled once, while the
# workspace's own crates stay unoptimized and quick to rebuild.
[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
permguard-all-in-one = { path = "crates/permguard-all-in-one", version = "0.1.0" }
permguard-cli = { path = "crates/permguard-cli", version = "0.1.0" }
permguard-conformance = { path = "crates/permguard-conformance", version = "0.1.0" }
permguard-contracts = { path = "crates/permguard-contracts", version = "0.1.0" }
permguard-authority-plane = { path = "crates/permguard-authority-plane", version = "0.1.0" }
permguard-authority-plane-server = { path = "crates/permguard-authority-plane-server", version = "0.1.0" }
permguard-control-plane = { path = "crates/permguard-control-plane", version = "0.1.0" }
permguard-control-plane-server = { path = "crates/permguard-control-plane-server", version = "0.1.0" }
permguard-core = { path = "crates/permguard-core", version = "0.1.0" }
permguard-data-plane = { path = "crates/permguard-data-plane", version = "0.1.0" }
permguard-data-plane-server = { path = "crates/permguard-data-plane-server", version = "0.1.0" }
permguard-decisions = { path = "crates/permguard-decisions", version = "0.1.0" }
permguard-events = { path = "crates/permguard-events", version = "0.1.0" }
permguard-host = { path = "crates/permguard-host", version = "0.1.0" }
permguard-mirror = { path = "crates/permguard-mirror", version = "0.1.0" }
permguard-notp = { path = "crates/permguard-notp", version = "0.1.0" }
permguard-client = { path = "crates/permguard-client", version = "0.1.0" }
permguard-objects = { path = "crates/permguard-objects", version = "0.1.0" }
permguard-pdp-core = { path = "crates/permguard-pdp-core", version = "0.1.0" }
permguard-language-cedar = { path = "crates/permguard-language-cedar", version = "0.1.0" }
permguard-language-core = { path = "crates/permguard-language-core", version = "0.1.0" }
permguard-language-dogwood = { path = "crates/permguard-language-dogwood", version = "0.1.0" }
permguard-language-rego = { path = "crates/permguard-language-rego", version = "0.1.0" }
# No default language: each package states the languages and the half it carries.
permguard-languages = { path = "crates/permguard-languages", version = "0.1.0", default-features = false }
permguard-server = { path = "crates/permguard-server", version = "0.1.0" }
permguard-std = { path = "crates/permguard-std", version = "0.1.0", default-features = false }
permguard-stream = { path = "crates/permguard-stream", version = "0.1.0" }
permguard-telemetry = { path = "crates/permguard-telemetry", version = "0.1.0" }
permguard-transport = { path = "crates/permguard-transport", version = "0.1.0" }

anyhow = "1"
# Local users' passwords, as Argon2id PHC strings (WP-8.1); salts come from ring.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
flate2 = "1"
futures-core = "0.3"
# Pinned to the generation `sha2` is on. `hmac` 0.13 is built on `digest` 0.11 and `sha2` 0.10 on
# `digest` 0.10, and the two cannot meet: `Hmac<Sha256>` needs its hash to implement the *same*
# generation's traits. Bumping one without the other does not fail at resolution — it fails deep in
# a trait bound, which is why it reached CI. Moving up means moving `sha2` in the same commit.
hmac = "0.13"
http = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-legacy", "http1"] }
# The Vault Transit client of the `kms` custody (WP-3.2): one HTTP/1.1 request per connection.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
bytes = "1"
# The PKCS#11 custody (WP-3.2), behind the server's `pkcs11` feature: loads the token's module at
# runtime.
cryptoki = "0.12"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.33"
prost = "0.14"
prost-types = "0.14"
proptest = "1"
rcgen = "0.14"
regex = "1"
ring = "0.17"
rustix = { version = "1", features = ["fs", "process", "system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.7", default-features = false, features = ["catch-panic", "limit", "timeout"] }
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "registry"] }
tracing-opentelemetry = "0.34"
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }

# The policy engines, pinned once for every package that links one (`permguard-language-cedar`,
# `-rego`, `-dogwood`, and `permguard-language-core` for Dogwood's values): what evaluates policy is
# exactly what was reviewed and shipped — plugins are a build, not a deployment action.
# Held at 4.11 by Dogwood, not by choice: `cedar-policy-mcp-schema-generator`, a transitive
# dependency of `dogwood-language`, pins `cedar-policy-core = "=4.11.0"` exactly. Cedar's
# core cannot be two versions in one build, so 4.11 is the only line where Permguard's own Cedar
# engine and Dogwood's can coexist. Revisit when that generator relaxes its pin.
#
# Exact versions, no defaults, every feature named: a feature change is a descriptor change, so each
# list here equals its engine package's `ENGINE_FEATURES`, which
# `crates/permguard-languages/tests/engine_features.rs` enforces. Cedar's list is its upstream
# default set. Regorus's is its default set spelled out (`full-opa`, `arc`, `rvm`); its `http`
# feature only registers an `http.send` that answers `undefined`, and its `net` only parses
# addresses, so neither reaches the network.
cedar-policy = { version = "=4.11.0", default-features = false, features = ["datetime", "decimal", "ipaddr"] }
regorus = { version = "=0.12.0", default-features = false, features = [
    "arc",
    "ast",
    "base64",
    "base64url",
    "cache",
    "coverage",
    "glob",
    "graph",
    "hex",
    "http",
    "jsonpatch",
    "jsonschema",
    "net",
    "opa-runtime",
    "regex",
    "rvm",
    "semver",
    "std",
    "time",
    "urlquery",
    "uuid",
    "yaml",
] }
# Dogwood, the temporal governance language. Experimental and disabled at runtime by
# `experimental.dogwood.enabled`; a build that carries the `dogwood` feature of
# `permguard-languages` compiles it in either way, because a language is a build and not a
# deployment action — the gate decides whether a ledger may *use* it, not whether this binary
# contains it.
#
# From crates.io, `dogwood-language`, the crate upstream publishes from
# https://github.com/dogwood-policy/dogwood; until 1.1.0 it came from that repository at a pinned
# git revision, as `amzn-dogwood-language`. Pinned exactly, `=`: a published version cannot change,
# and the lock records its checksum, so the reviewed code and the built code are one thing. Update
# procedure: review the upstream diff between the two versions, run this workspace's Dogwood tests
# and regenerate the vectors that name the version, then move the requirement in one commit.
# `default-features = false` and an empty `features` list are stated rather than left implicit.
# Upstream declares three optional features and all must stay off here: `corpus` embeds ~13MB of
# regression data a server has no use for; `net` registers an `http_get` host function inside the
# provider sandbox, which makes provider evaluation non-deterministic and reachable from a policy —
# upstream's own note says the function performs no host validation, so a script building a URL
# from an event field is an SSRF into whatever the process can reach; and
# `experimental-arithmetic` accepts arithmetic upstream has not stabilised. Cargo features are
# additive across a dependency graph, so "off by default" is a property of this build only while
# nothing else in the graph asks for it; writing it down is what makes a future
# `features = ["net"]` a visible decision in a diff rather than a silent one.
dogwood-language = { version = "=1.1.0", default-features = false, features = [] }
